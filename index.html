
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Studio: Native UI</title>
    <style>
        body { margin: 0; background: #050505; overflow: hidden; font-family: sans-serif; color: #fff; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.9); z-index: 999;
        }
        button {
            padding: 15px 40px; font-size: 18px; background: #0088ff; color: #fff; border: none;
            border-radius: 8px; cursor: pointer; margin-top: 20px; text-transform: uppercase;
            font-weight: bold; box-shadow: 0 0 20px rgba(0,136,255,0.5);
        }
    </style>
</head>
<body>

<div id="overlay">
    <h1>MR STUDIO: NATIVE</h1>
    <p>Interfaz nativa de alto rendimiento</p>
    <button id="btn-start">INICIAR (AR/VR)</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

let scene, camera, renderer;
let ctrlRight, ctrlLeft, gripLeft;
let raycaster, tempMatrix = new THREE.Matrix4();

// Grupos
const worldGroup = new THREE.Group();
const uiGroup = new THREE.Group(); // El menú nativo
const uiButtons = []; // Lista para raycasting rápido

// Estado
const STATE = {
    hovered: null, // Botón bajo el puntero
    selectedObject: null
};

init();

function init() {
    // 1. Escena Básica
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    
    scene.add(worldGroup);
    
    // Luces
    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(2, 4, 1);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
    scene.add(new THREE.GridHelper(10, 10, 0x333333, 0x111111));

    // Cámara
    camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 20);
    camera.position.set(0, 1.6, 0);

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 2. Controladores XR
    setupControllers();

    // 3. Crear UI Nativa (Texturas Canvas)
    createNativeWristUI();

    // Evento Inicio
    document.getElementById('btn-start').addEventListener('click', () => {
        const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
        navigator.xr.requestSession('immersive-ar', sessionInit).then(session => {
            renderer.xr.setSession(session);
            document.getElementById('overlay').style.display = 'none';
            scene.background = null; // Passthrough
        });
    });

    renderer.setAnimationLoop(render);
}

function setupControllers() {
    // DERECHA (Puntero)
    ctrlRight = renderer.xr.getController(0);
    ctrlRight.addEventListener('selectstart', onTrigger); 
    scene.add(ctrlRight);

    // Rayo Láser Fino
    const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-3)]);
    const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x0088ff, opacity: 0.5, transparent: true }));
    ctrlRight.add(line);

    // IZQUIERDA (Anclaje Menú)
    ctrlLeft = renderer.xr.getController(1);
    scene.add(ctrlLeft);

    // Modelos físicos (para que veas dónde está tu mano)
    const modelFactory = new XRControllerModelFactory();
    
    gripLeft = renderer.xr.getControllerGrip(1);
    gripLeft.add(modelFactory.createControllerModel(gripLeft));
    scene.add(gripLeft);
    
    const gripRight = renderer.xr.getControllerGrip(0);
    gripRight.add(modelFactory.createControllerModel(gripRight));
    scene.add(gripRight);

    // ANCLAR MENU A LA MUÑECA IZQUIERDA
    gripLeft.add(uiGroup);

    raycaster = new THREE.Raycaster();
}

// ============================================================================
// GENERADOR DE UI NATIVA (Canvas Texture -> Mesh)
// ============================================================================
function createNativeWristUI() {
    // 1. Panel Base (Vidrio oscuro)
    // Tamaño compacto: 14cm x 10cm
    const bgGeo = new THREE.PlaneGeometry(0.14, 0.10); 
    const bgMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.8 });
    const bg = new THREE.Mesh(bgGeo, bgMat);
    uiGroup.add(bg);

    // Borde Neón
    const border = new THREE.LineSegments(
        new THREE.EdgesGeometry(bgGeo),
        new THREE.LineBasicMaterial({ color: 0x0088ff })
    );
    uiGroup.add(border);

    // Posición ergonómica:
    // x: 0.1 (hacia dentro del brazo)
    // y: 0.03 (un poco elevado)
    // rot x: -90 (acostado)
    // rot z: 45 (inclinado hacia la cara)
    uiGroup.position.set(0.1, 0.04, 0.05);
    uiGroup.rotation.set(-Math.PI/2, 0, Math.PI/4);

    // 2. Función para crear botones nítidos
    const createBtn = (label, color, x, y, action) => {
        const w = 0.04; // 4cm ancho
        const h = 0.03; // 3cm alto

        // Crear textura con Canvas 2D
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        
        // Fondo
        ctx.fillStyle = color; 
        ctx.fillRect(0,0,256,128);
        // Borde
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10;
        ctx.strokeRect(0,0,256,128);
        // Texto
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 50px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor="black"; ctx.shadowBlur=5;
        ctx.fillText(label, 128, 64);

        const tex = new THREE.CanvasTexture(canvas);
        const mat = new THREE.MeshBasicMaterial({ map: tex });
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
        
        mesh.position.set(x, y, 0.005); // Ligeramente encima del panel
        mesh.userData = { isButton: true, action: action, originalScale: 1 };
        
        uiGroup.add(mesh);
        uiButtons.push(mesh);
    };

    // --- FILA 1 ---
    createBtn("CUBO", "#0055aa", -0.045, 0.02, () => spawn('box'));
    createBtn("ESFERA", "#00aa55", 0, 0.02, () => spawn('sphere'));
    createBtn("CILIND", "#aa5500", 0.045, 0.02, () => spawn('cylinder'));

    // --- FILA 2 ---
    createBtn("BORRAR", "#aa0000", -0.045, -0.02, deleteSelected);
    createBtn("COLOR", "#aa00aa", 0, -0.02, randomColor);
    createBtn("RESET", "#555555", 0.045, -0.02, resetScene);
}

// ============================================================================
// LÓGICA
// ============================================================================

function onTrigger(e) {
    // Si hay un botón bajo el puntero (hover), ejecutar acción
    if (STATE.hovered) {
        STATE.hovered.userData.action();
        
        // Feedback visual de click (pequeño rebote)
        const btn = STATE.hovered;
        btn.scale.set(0.9, 0.9, 1);
        setTimeout(() => btn.scale.set(1.1, 1.1, 1), 100); // Vuelve al estado hover
        return;
    }

    // Si no, seleccionar objeto en escena
    checkSceneSelect(e.target);
}

function render() {
    if (!ctrlRight) return;

    // 1. Raycast desde mando derecho
    tempMatrix.identity().extractRotation(ctrlRight.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

    // 2. Comprobar Botones UI
    const intersects = raycaster.intersectObjects(uiButtons);
    
    if (intersects.length > 0) {
        const hit = intersects[0].object;
        
        // Cambio de estado HOVER
        if (STATE.hovered !== hit) {
            // Restaurar anterior
            if (STATE.hovered) STATE.hovered.scale.set(1, 1, 1);
            
            // Activar nuevo
            STATE.hovered = hit;
            STATE.hovered.scale.set(1.1, 1.1, 1); // Crece un 10%
        }
    } else {
        // Nada bajo el puntero
        if (STATE.hovered) {
            STATE.hovered.scale.set(1, 1, 1);
            STATE.hovered = null;
        }
    }

    renderer.render(scene, camera);
}

// --- Funciones de la App ---

function spawn(type) {
    let geo;
    if (type === 'box') geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
    else if (type === 'sphere') geo = new THREE.SphereGeometry(0.1, 16, 12);
    else geo = new THREE.CylinderGeometry(0.08, 0.08, 0.15, 16);

    const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
    const mesh = new THREE.Mesh(geo, mat);
    
    // Aparece frente a la cámara
    const spawnPos = new THREE.Vector3(0, 0, -0.5).applyMatrix4(camera.matrixWorld);
    mesh.position.copy(spawnPos);
    
    worldGroup.add(mesh);
    STATE.selectedObject = mesh;
    highlight(mesh);
}

function checkSceneSelect(controller) {
    const hits = raycaster.intersectObjects(worldGroup.children);
    if (hits.length > 0) {
        STATE.selectedObject = hits[0].object;
        highlight(STATE.selectedObject);
    } else {
        STATE.selectedObject = null;
        // Quitar highlight a todos
        worldGroup.children.forEach(o => o.material.wireframe = false);
    }
}

function deleteSelected() {
    if (STATE.selectedObject) {
        worldGroup.remove(STATE.selectedObject);
        STATE.selectedObject = null;
    }
}

function randomColor() {
    if (STATE.selectedObject) {
        STATE.selectedObject.material.color.setHex(Math.random() * 0xffffff);
    }
}

function resetScene() {
    worldGroup.clear();
    STATE.selectedObject = null;
}

function highlight(mesh) {
    worldGroup.children.forEach(o => o.material.wireframe = false);
    if(mesh) mesh.material.wireframe = true; // Feedback simple de selección
}

</script>
</body>
</html>
