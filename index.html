
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MR Studio Pro - Complete Edition</title>
  <style>
    body { margin:0; background:#000; overflow:hidden; font-family:'Segoe UI',sans-serif; color:#fff; }
    #overlay{
      position:absolute; inset:0;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      background:rgba(0,0,0,0.95); z-index:999;
    }
    button{
      padding:20px 60px; font-size:22px; background:#2b7fdb; border:none;
      border-radius:8px; font-weight:600; cursor:pointer; color:white;
      box-shadow:0 4px 20px rgba(43,127,219,0.4);
      transition:all .3s;
    }
    button:hover{ background:#3d8fe6; transform:translateY(-2px); }

    #info-panel{
      position:absolute; top:10px; right:10px;
      background:rgba(0,0,0,0.85); padding:15px; border-radius:8px;
      font-size:11px; border:1px solid rgba(43,127,219,0.3);
      min-width:220px;
    }
    .info-row{ display:flex; justify-content:space-between; margin:5px 0; }
    .info-label{ color:#888; font-weight:600; }
    .info-value{ color:#2b7fdb; font-weight:700; }

    .status-bar{
      position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.85); padding:10px 20px; border-radius:20px;
      font-size:12px; border:1px solid rgba(43,127,219,0.4);
      text-align:center;
    }
  </style>
</head>
<body>

<div id="overlay">
  <h1 style="font-size:48px; margin-bottom:10px; color:#2b7fdb;">⚡ MR STUDIO PRO</h1>
  <p style="font-size:18px; color:#888; margin-bottom:30px;">Complete Blender-Style Editor for Meta Quest</p>
  <button id="btn-start">INICIAR SESIÓN VR</button>
</div>

<div id="info-panel">
  <div style="font-size:14px; font-weight:bold; margin-bottom:10px; color:#2b7fdb;">📊 INFORMACIÓN</div>
  <div class="info-row"><span class="info-label">Modo:</span><span class="info-value" id="mode-display">OBJECT</span></div>
  <div class="info-row"><span class="info-label">Herramienta:</span><span class="info-value" id="tool-display">SELECT</span></div>
  <div class="info-row"><span class="info-label">Selección:</span><span class="info-value" id="sel-display">Ninguna</span></div>
  <div class="info-row"><span class="info-label">Transform:</span><span class="info-value" id="transform-display">GLOBAL</span></div>
  <div class="info-row"><span class="info-label">Shading:</span><span class="info-value" id="shading-display">SOLID</span></div>
  <div class="info-row"><span class="info-label">Vértices:</span><span class="info-value" id="vert-count">0</span></div>
  <div class="info-row"><span class="info-label">Caras:</span><span class="info-value" id="face-count">0</span></div>
  <div class="info-row"><span class="info-label">Position:</span><span class="info-value" id="pos-display">0, 0, 0</span></div>
</div>

<div class="status-bar" id="status-bar">
  Squeeze Izq: Menú | Squeeze Der: Agarrar | Trigger: Seleccionar
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ======================================================
// GLOBAL
// ======================================================
let scene, camera, renderer;
let ctrlRight = null, ctrlLeft = null;
let gripRight = null, gripLeft = null;

const objects = [];

let selectorSphere;
const SELECTOR_RADIUS = 0.08;

const _tempVecA = new THREE.Vector3();
const _tempVecB = new THREE.Vector3();
const _tempQuat = new THREE.Quaternion();
const _ray = new THREE.Raycaster();
const _mat = new THREE.Matrix4();

let gizmo = null;
let gizmoHandles = [];

const STATE = {
  mode: 'OBJECT',
  editMode: 'VERTEX',
  tool: 'SELECT',
  transform: 'GLOBAL',
  shading: 'SOLID',

  selected: null,
  mainMesh: null,
  selection: [],

  grabbedElement: null,
  grabbedGizmoAxis: null,
  gizmoStartPos: new THREE.Vector3(),
  controllerStartPos: new THREE.Vector3(),

  menuVisible: false,

  closestVertex: null,
  closestEdge: null,
  closestFace: null,

  vertexHelpers: [],
  edgeHelpers: [],
  faceHelpers: [],

  knifeMode: false,

  colors: {
    selected: 0xffa500,
    vertex: 0x00ff00,
    edge: 0xff8800,
    face: 0x00aaff,
    highlight: 0xffff00,
    knife: 0xff00ff
  }
};

const UI = {
  panel: null,
  buttons: [],
  container: null
};

init();

// ======================================================
// INIT
// ======================================================
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a1a);
  scene.fog = new THREE.Fog(0x1a1a1a, 5, 20);

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
  keyLight.position.set(5, 10, 7.5);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 2048;
  keyLight.shadow.mapSize.height = 2048;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x6699ff, 0.9);
  fillLight.position.set(-5, 5, -5);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xff9966, 0.7);
  rimLight.position.set(0, 5, -10);
  scene.add(rimLight);

  scene.add(new THREE.AmbientLight(0x404060, 0.5));

  const gridHelper = new THREE.GridHelper(20, 40, 0x444444, 0x222222);
  scene.add(gridHelper);

  const axesHelper = new THREE.AxesHelper(1);
  axesHelper.position.set(-4, 0.01, -4);
  scene.add(axesHelper);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
  camera.position.set(0, 1.6, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.xr.enabled = true;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  setupControllers();              // ✅ robusto
  createGizmo();
  createUIPanel();                 // ✅ menú existe aunque falle mano izq

  document.getElementById('btn-start').addEventListener('click', () => {
    // ✅ QUITAMOS hand-tracking PARA EVITAR QUE “DESAPAREZCAN” CONTROLES (puedes reactivarlo después)
    navigator.xr.requestSession('immersive-vr', {
      optionalFeatures: ['local-floor', 'bounded-floor']
    }).then(session => {
      renderer.xr.setSession(session);
      document.getElementById('overlay').style.display = 'none';
      scene.background = null;
      updateLog('✅ Sesión VR iniciada');
    }).catch(err => {
      console.error(err);
      updateLog('❌ No se pudo iniciar VR');
    });
  });

  window.addEventListener('keydown', handleKeyPress);
  window.addEventListener('resize', onResize);

  renderer.setAnimationLoop(render);

  setTimeout(() => {
    if (objects.length === 0) {
      spawnObject('box');
      updateLog('👋 Bienvenido a MR Studio Pro!');
    }
  }, 900);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ======================================================
// ✅ CONTROLLERS ROBUSTOS + MENU FALLBACK
// - NO depende del grip izquierdo para mostrar el menú.
// - Si no hay ctrlLeft, el menú se ancla a la cámara.
// ======================================================
function setupControllers() {
  const modelFactory = new XRControllerModelFactory();

  const c0 = renderer.xr.getController(0);
  const c1 = renderer.xr.getController(1);
  c0.userData.index = 0;
  c1.userData.index = 1;
  scene.add(c0, c1);

  const grips = [];
  grips[0] = renderer.xr.getControllerGrip(0);
  grips[1] = renderer.xr.getControllerGrip(1);

  grips[0].add(modelFactory.createControllerModel(grips[0]));
  grips[1].add(modelFactory.createControllerModel(grips[1]));
  scene.add(grips[0], grips[1]);

  const onConnected = (e) => {
    const controller = e.target;
    const idx = controller.userData.index;
    const grip = grips[idx];
    const handedness = e.data?.handedness;

    if (handedness === 'right') {
      ctrlRight = controller;
      gripRight = grip;

      // selector + línea
      const geo = new THREE.SphereGeometry(0.01, 16, 16);
      const mat = new THREE.MeshBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0.8 });
      selectorSphere = new THREE.Mesh(geo, mat);
      selectorSphere.position.set(0, -0.015, -0.05);
      ctrlRight.add(selectorSphere);

      const lineGeo = new THREE.BufferGeometry().setFromPoints([ new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-2) ]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x2b7fdb, opacity: 0.3, transparent: true });
      const line = new THREE.Line(lineGeo, lineMat);
      ctrlRight.add(line);

      controller.addEventListener('selectstart', onRightTriggerStart);
      controller.addEventListener('selectend', onRightTriggerEnd);
      controller.addEventListener('squeezestart', onRightGripStart);
      controller.addEventListener('squeezeend', onRightGripEnd);

      updateLog('🎮 Control derecho conectado');
    } else if (handedness === 'left') {
      ctrlLeft = controller;
      gripLeft = grip;

      // Menú: squeeze izq. Fallback: selectstart izq con "thumbstick click" no siempre disponible
      controller.addEventListener('squeezestart', toggleMenu);
      controller.addEventListener('selectstart', () => {
        // Si quieres también abrir con trigger izq, descomenta:
        // toggleMenu();
      });

      updateLog('🎮 Control izquierdo conectado');
    } else {
      // si no viene handedness, igual dejamos el controller vivo
      updateLog('⚠️ Controller conectado sin handedness');
    }
  };

  c0.addEventListener('connected', onConnected);
  c1.addEventListener('connected', onConnected);
}

// ======================================================
// GIZMO (mínimo)
// ======================================================
function createGizmo() {
  gizmo = new THREE.Group();
  gizmo.visible = false;

  const size = 0.15;
  const thickness = 0.005;

  const axes = [
    { color: 0xff0000, dir: new THREE.Vector3(1, 0, 0), axis: 'x' },
    { color: 0x00ff00, dir: new THREE.Vector3(0, 1, 0), axis: 'y' },
    { color: 0x0000ff, dir: new THREE.Vector3(0, 0, 1), axis: 'z' }
  ];

  axes.forEach(a => {
    const group = createGizmoAxis(a.color, a.dir, size, thickness);
    group.userData = { axis: a.axis, isGizmoHandle: true };
    gizmo.add(group);
    gizmoHandles.push(group);
  });

  const centerGeo = new THREE.SphereGeometry(0.02, 16, 16);
  const centerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
  const center = new THREE.Mesh(centerGeo, centerMat);
  center.userData = { axis: 'xyz', isGizmoHandle: true };
  gizmo.add(center);
  gizmoHandles.push(center);

  scene.add(gizmo);
}

function createGizmoAxis(color, direction, length, thickness) {
  const group = new THREE.Group();

  const lineGeo = new THREE.CylinderGeometry(thickness, thickness, length, 8);
  const lineMat = new THREE.MeshBasicMaterial({ color });
  const line = new THREE.Mesh(lineGeo, lineMat);
  line.position.copy(direction.clone().multiplyScalar(length / 2));
  line.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
  group.add(line);

  const coneGeo = new THREE.ConeGeometry(0.015, 0.04, 12);
  const coneMat = new THREE.MeshBasicMaterial({ color });
  const cone = new THREE.Mesh(coneGeo, coneMat);
  cone.position.copy(direction.clone().multiplyScalar(length));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
  group.add(cone);

  return group;
}

function showGizmo(visible) {
  gizmo.visible = visible && (STATE.tool === 'MOVE' || STATE.tool === 'ROTATE' || STATE.tool === 'SCALE');
}

// ======================================================
// ✅ MENÚ VR (NO depende de gripLeft)
// ======================================================
function createUIPanel() {
  UI.container = new THREE.Group();
  scene.add(UI.container);

  UI.panel = new THREE.Group();
  UI.panel.visible = false;

  const width = 0.40;
  const height = 0.55;

  const bgGeo = new THREE.PlaneGeometry(width, height);
  const bgMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a1a,
    transparent: true,
    opacity: 0.95,
    roughness: 0.8,
    metalness: 0.2
  });
  const bg = new THREE.Mesh(bgGeo, bgMat);
  UI.panel.add(bg);

  const borderGeo = new THREE.EdgesGeometry(bgGeo);
  const borderMat = new THREE.LineBasicMaterial({ color: 0x2b7fdb, linewidth: 3 });
  const border = new THREE.LineSegments(borderGeo, borderMat);
  border.position.z = 0.001;
  UI.panel.add(border);

  UI.container.add(UI.panel);

  createMainMenu();
}

function clearUIButtons() {
  UI.buttons.forEach(btn => {
    if (UI.panel.children.includes(btn)) UI.panel.remove(btn);
  });
  UI.buttons = [];
}

function createMainMenu() {
  clearUIButtons();

  const startY = 0.22;
  const spacing = 0.07;
  let y = startY;

  createMenuSection('CREAR', y, 0.38); y -= 0.045;
  createIconButton('📦','Cubo',   -0.14, y, () => spawnObject('box'));
  createIconButton('⚪','Esfera',  -0.04, y, () => spawnObject('sphere'));
  createIconButton('🔵','Cilindro', 0.06, y, () => spawnObject('cylinder'));
  createIconButton('🍩','Torus',    0.16, y, () => spawnObject('torus'));
  y -= spacing;

  createMenuSection('HERRAMIENTA', y, 0.38); y -= 0.045;
  createIconButton('👆','Select', -0.14, y, () => setTool('SELECT'), STATE.tool==='SELECT');
  createIconButton('↔️','Move',   -0.04, y, () => setTool('MOVE'),   STATE.tool==='MOVE');
  createIconButton('🔄','Rotate',  0.06, y, () => setTool('ROTATE'), STATE.tool==='ROTATE');
  createIconButton('↕️','Scale',   0.16, y, () => setTool('SCALE'),  STATE.tool==='SCALE');
  y -= spacing;

  createMenuSection('OTROS', y, 0.38); y -= 0.045;
  createIconButton('🗑️','Delete', -0.09, y, deleteSelected);
  createIconButton('✖️','Cerrar',  0.01, y, toggleMenu);
}

function createMenuSection(title, y, width) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0, 0, 512, 64);

  ctx.fillStyle = '#2b7fdb';
  ctx.font = 'bold 28px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(title, 10, 40);

  const texture = new THREE.CanvasTexture(canvas);
  const geo = new THREE.PlaneGeometry(width, 0.035);
  const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, y, 0.003);

  UI.panel.add(mesh);
}

function createIconButton(icon, label, x, y, callback, active=false) {
  const size = 0.06;

  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');

  const gradient = ctx.createLinearGradient(0, 0, 0, 128);
  if (active) {
    gradient.addColorStop(0, '#2b7fdb');
    gradient.addColorStop(1, '#1a5fa0');
  } else {
    gradient.addColorStop(0, '#3a3a3a');
    gradient.addColorStop(1, '#2a2a2a');
  }
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 128, 128);

  ctx.strokeStyle = active ? '#ffffff' : '#555555';
  ctx.lineWidth = active ? 4 : 2;
  ctx.strokeRect(2, 2, 124, 124);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 52px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(icon, 64, 48);

  ctx.font = 'bold 14px Arial';
  ctx.fillText(label, 64, 100);

  const texture = new THREE.CanvasTexture(canvas);
  const geo = new THREE.PlaneGeometry(size, size);
  const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
  const btn = new THREE.Mesh(geo, mat);
  btn.position.set(x, y, 0.004);

  btn.userData = { isButton: true, action: callback, label };
  UI.panel.add(btn);
  UI.buttons.push(btn);
  return btn;
}

// ✅ Posiciona el menú aunque NO exista mano izq (fallback a cámara)
function positionMenuNow() {
  if (!UI.container) return;

  const anchor = ctrlLeft || gripLeft || camera;
  if (!anchor) return;

  anchor.getWorldPosition(_tempVecA);
  anchor.getWorldQuaternion(_tempQuat);

  const offset = new THREE.Vector3(0.18, 0.05, -0.18);
  offset.applyQuaternion(_tempQuat);

  UI.container.position.copy(_tempVecA).add(offset);
  UI.container.quaternion.copy(_tempQuat);
  UI.container.rotateY(-Math.PI / 4);
}

function toggleMenu() {
  STATE.menuVisible = !STATE.menuVisible;
  UI.panel.visible = STATE.menuVisible;

  if (STATE.menuVisible) {
    positionMenuNow(); // ✅ aparece inmediato (no queda en 0,0,0)
    updateLog('📋 Menú abierto');
  } else {
    updateLog('📋 Menú cerrado');
  }
}

// ======================================================
// RENDER LOOP
// ======================================================
function render() {
  // ✅ Menú siempre se posiciona si está visible (NO depende del grip izquierdo)
  if (STATE.menuVisible && UI.container) positionMenuNow();

  // render
  updateInfoDisplay();
  renderer.render(scene, camera);
}

// ======================================================
// INTERACCIÓN MENU (ray desde ctrlRight)
// ======================================================
function checkUIInteraction() {
  if (!ctrlRight) return false;

  _mat.identity().extractRotation(ctrlRight.matrixWorld);
  _ray.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
  _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat);

  const hits = _ray.intersectObjects(UI.buttons, false);
  if (hits.length > 0) {
    const btn = hits[0].object;
    btn.userData?.action?.();
    animateButtonPress(btn);
    return true;
  }
  return false;
}

function animateButtonPress(btn) {
  const z = btn.position.z;
  btn.position.z -= 0.005;
  setTimeout(() => (btn.position.z = z), 120);
}

// ======================================================
// INPUT EVENTS
// ======================================================
function onRightTriggerStart() {
  if (STATE.menuVisible && checkUIInteraction()) return;
  if (STATE.mode === 'OBJECT') selectObjectRaycast();
}

function onRightTriggerEnd() {}

function onRightGripStart() {}
function onRightGripEnd() {}

function onLeftTriggerStart() {}

function handleKeyPress(event) {
  switch (event.key.toLowerCase()) {
    case 'm': toggleMenu(); break;
    case 'g': setTool('MOVE'); break;
    case 'r': setTool('ROTATE'); break;
    case 's': setTool('SCALE'); break;
  }
}

// ======================================================
// OBJECTS
// ======================================================
function spawnObject(type) {
  let geo;
  switch (type) {
    case 'box': geo = new THREE.BoxGeometry(0.2, 0.2, 0.2, 2, 2, 2); break;
    case 'sphere': geo = new THREE.SphereGeometry(0.12, 32, 24); break;
    case 'cylinder': geo = new THREE.CylinderGeometry(0.08, 0.08, 0.25, 32); break;
    case 'torus': geo = new THREE.TorusGeometry(0.1, 0.04, 24, 48); break;
    default: geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
  }

  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
    roughness: 0.5,
    metalness: 0.2,
    emissive: new THREE.Color(0x000000)
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = `${type}_${objects.length + 1}`;

  camera.getWorldPosition(_tempVecA);
  camera.getWorldQuaternion(_tempQuat);

  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(_tempQuat);
  mesh.position.copy(_tempVecA).add(forward.multiplyScalar(0.6));
  mesh.position.y = Math.max(mesh.position.y, 0.15);

  scene.add(mesh);
  objects.push(mesh);

  selectObject(mesh);
  updateLog(`✓ Creado: ${mesh.name}`);
}

function selectObject(obj) {
  if (STATE.selected && STATE.selected.material) {
    STATE.selected.material.emissive?.setHex(0x000000);
  }

  STATE.selected = obj;

  if (STATE.selected && STATE.selected.material) {
    STATE.selected.material.emissive?.setHex(STATE.colors.selected);
    showGizmo(STATE.tool !== 'SELECT');
  } else {
    showGizmo(false);
  }
}

function selectObjectRaycast() {
  if (!ctrlRight) return;

  _mat.identity().extractRotation(ctrlRight.matrixWorld);
  _ray.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
  _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat);

  const hits = _ray.intersectObjects(objects, false);
  if (hits.length > 0) selectObject(hits[0].object);
  else selectObject(null);
}

function deleteSelected() {
  if (!STATE.selected) { updateLog('⚠️ Nada que eliminar'); return; }

  scene.remove(STATE.selected);
  const idx = objects.indexOf(STATE.selected);
  if (idx > -1) objects.splice(idx, 1);

  STATE.selected = null;
  updateLog('✓ Objeto eliminado');
}

// ======================================================
// TOOLS
// ======================================================
function setTool(tool) {
  STATE.tool = tool;
  showGizmo(tool !== 'SELECT');
  updateLog(`🔨 Herramienta: ${tool}`);
}

// ======================================================
// UI TEXT
// ======================================================
function updateInfoDisplay() {
  document.getElementById('mode-display').textContent = STATE.mode;
  document.getElementById('tool-display').textContent = STATE.tool;
  document.getElementById('transform-display').textContent = STATE.transform;
  document.getElementById('shading-display').textContent = STATE.shading;

  let selText = 'Ninguna';
  if (STATE.selected) selText = STATE.selected.name || 'Objeto';
  document.getElementById('sel-display').textContent = selText;

  if (STATE.selected?.geometry?.attributes?.position) {
    const posAttr = STATE.selected.geometry.attributes.position;
    document.getElementById('vert-count').textContent = posAttr.count;
    document.getElementById('face-count').textContent = Math.floor(posAttr.count / 3);
  } else {
    document.getElementById('vert-count').textContent = '0';
    document.getElementById('face-count').textContent = '0';
  }

  if (STATE.selected) {
    const p = STATE.selected.position;
    document.getElementById('pos-display').textContent = `${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}`;
  } else {
    document.getElementById('pos-display').textContent = '0, 0, 0';
  }
}

function updateLog(message) {
  console.log(`[MR Studio Pro] ${message}`);
  const statusBar = document.getElementById('status-bar');
  if (!statusBar) return;
  statusBar.textContent = message;
  statusBar.style.background = 'rgba(43,127,219,0.3)';
  setTimeout(() => {
    statusBar.textContent = "Squeeze Izq: Menú | Squeeze Der: Agarrar | Trigger: Seleccionar | Tecla M: Menú";
    statusBar.style.background = 'rgba(0,0,0,0.85)';
  }, 2500);
}
</script>
