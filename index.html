<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Studio Pro - Fixed Edition</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif; 
            color: #fff; 
        }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.95); z-index: 999;
        }
        button {
            padding: 20px 60px; font-size: 22px; background: #2b7fdb; border: none;
            border-radius: 8px; font-weight: 600; cursor: pointer; color: white;
            box-shadow: 0 4px 20px rgba(43,127,219,0.4);
            transition: all 0.3s;
        }
        button:hover { background: #3d8fe6; transform: translateY(-2px); }
        
        #info-panel {
            position: absolute; top: 10px; right: 10px; 
            background: rgba(0,0,0,0.8); padding: 15px; 
            border-radius: 8px; font-size: 11px; 
            border: 1px solid rgba(43,127,219,0.3);
            min-width: 200px;
            pointer-events: none;
        }
        .info-row { display: flex; justify-content: space-between; margin: 5px 0; }
        .info-label { color: #888; font-weight: 600; }
        .info-value { color: #2b7fdb; font-weight: 700; }
        
        .status-bar {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 20px;
            font-size: 14px; border: 1px solid rgba(43,127,219,0.4);
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="overlay">
    <h1 style="font-size: 48px; margin-bottom: 10px; color: #2b7fdb;">⚡ MR STUDIO PRO</h1>
    <p style="font-size: 18px; color: #888; margin-bottom: 30px;">Versión Corregida: Menú Izquierdo + Locomoción</p>
    <button id="btn-start">ENTRAR EN VR</button>
</div>

<div id="info-panel">
    <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #2b7fdb;">📊 ESTADO</div>
    <div class="info-row"><span class="info-label">Modo:</span><span class="info-value" id="mode-display">OBJECT</span></div>
    <div class="info-row"><span class="info-label">Herramienta:</span><span class="info-value" id="tool-display">Select</span></div>
    <div class="info-row"><span class="info-label">Sel:</span><span class="info-value" id="sel-display">Nada</span></div>
</div>

<div class="status-bar" id="status-bar">
    🎮 IZQ: Gatillo=Menú, Grip=Moverme | DER: Gatillo=Seleccionar, Grip=Agarrar
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ==========================================
// VARIABLES GLOBALES
// ==========================================
let scene, camera, renderer;
let dolly; // El contenedor del usuario (cabeza + manos)
let ctrlRight, ctrlLeft; // Los rayos (Controllers)
let gripRight, gripLeft; // Los modelos visuales (Grips)
let uiPanel;
const objects = [];
const controllerModelFactory = new XRControllerModelFactory();

// Estado del sistema
const STATE = {
    mode: 'OBJECT',
    editMode: 'VERTEX',
    tool: 'SELECT',
    selected: null,
    mainMesh: null,
    selection: [],
    menuVisible: false,
    grabbedElement: null,
    
    // Locomoción
    draggingWorld: false,
    dragStartPos: new THREE.Vector3(),
    dollyStartPos: new THREE.Vector3(),
    
    // Helpers
    vertexHelpers: [],
    closestVertex: null,
    
    colors: { selected: 0xffa500, vertex: 0x00ff00, highlight: 0xffff00 }
};

// Gizmo simple
let gizmo;

// UI
const UI = { buttons: [] };

// Variables temporales
const _vec = new THREE.Vector3();
const _ray = new THREE.Raycaster();
const _mat = new THREE.Matrix4();

init();

// ==========================================
// INICIALIZACIÓN
// ==========================================
function init() {
    // 1. Escena
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    // 2. Dolly (Rig del Jugador)
    dolly = new THREE.Group();
    dolly.position.set(0, 0, 0);
    scene.add(dolly);

    // 3. Cámara
    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 500);
    camera.position.set(0, 1.6, 0); // Altura simulada si no hay VR
    dolly.add(camera);

    // 4. Luces
    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(5, 10, 7);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // 5. Grid
    const grid = new THREE.GridHelper(20, 40, 0x555555, 0x333333);
    scene.add(grid);

    // 6. Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 7. Componentes
    setupControllers();
    createGizmo();
    createUIPanel();
    
    // 8. Botón de inicio
    document.getElementById('btn-start').addEventListener('click', () => {
        navigator.xr.requestSession('immersive-vr', { 
            optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] 
        }).then(session => {
            renderer.xr.setSession(session);
            document.getElementById('overlay').style.display = 'none';
        });
    });

    renderer.setAnimationLoop(render);
}

// ==========================================
// CONFIGURACIÓN DE MANDOS (CORREGIDO)
// ==========================================
function setupControllers() {
    // Controller 0 y 1 (Genéricos al principio)
    const c0 = renderer.xr.getController(0);
    const c1 = renderer.xr.getController(1);
    
    const g0 = renderer.xr.getControllerGrip(0);
    const g1 = renderer.xr.getControllerGrip(1);
    
    // Modelos visuales
    g0.add(controllerModelFactory.createControllerModel(g0));
    g1.add(controllerModelFactory.createControllerModel(g1));

    // Añadir al Dolly
    dolly.add(c0, c1, g0, g1);

    // --- DETECCIÓN DE MANOS ---
    const onConnected = (event) => {
        const controller = event.target;
        const grip = event.data.handedness === 'right' ? g0 : g1; 
        
        // Corrección si los índices están invertidos en el hardware
        const realGrip = (controller === c0) ? g0 : g1;

        if (event.data.handedness === 'right') {
            ctrlRight = controller;
            gripRight = realGrip;
            setupVisuals(ctrlRight, 0xff0000); // Rayo Rojo
            
            // Eventos Derecha (Interacción)
            controller.addEventListener('selectstart', onRightTrigger);
            controller.addEventListener('squeezestart', onRightGripStart);
            controller.addEventListener('squeezeend', onRightGripEnd);
            console.log("Mando DERECHO listo");

        } else if (event.data.handedness === 'left') {
            ctrlLeft = controller;
            gripLeft = realGrip;
            setupVisuals(ctrlLeft, 0x0000ff); // Rayo Azul
            
            // Eventos Izquierda (UI y Movimiento)
            controller.addEventListener('selectstart', onLeftTrigger); // Menú
            controller.addEventListener('squeezestart', onLeftGripStart); // Mover mundo
            controller.addEventListener('squeezeend', onLeftGripEnd);
            console.log("Mando IZQUIERDO listo");
        }
    };

    c0.addEventListener('connected', onConnected);
    c1.addEventListener('connected', onConnected);
}

function setupVisuals(controller, colorHex) {
    // Línea del rayo
    const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-2)
    ]);
    const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: colorHex }));
    controller.add(line);
    
    // Bolita en la punta
    const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.01, 8, 8),
        new THREE.MeshBasicMaterial({ color: colorHex })
    );
    sphere.position.z = -0.05;
    controller.add(sphere);
}


// ==========================================
// LÓGICA DE CONTROLADORES
// ==========================================

// --- IZQUIERDA: MENÚ Y LOCOMOCIÓN ---

function onLeftTrigger() {
    // 1. Verificar si tocamos un botón de la UI
    if (STATE.menuVisible && checkUIInteraction(ctrlLeft)) return;
    
    // 2. Si no, abrir/cerrar menú
    toggleMenu();
}

function onLeftGripStart() {
    STATE.draggingWorld = true;
    ctrlLeft.getWorldPosition(STATE.dragStartPos);
    STATE.dollyStartPos.copy(dolly.position);
}

function onLeftGripEnd() {
    STATE.draggingWorld = false;
}

function updateLocomotion() {
    if (STATE.draggingWorld && ctrlLeft) {
        // Calcular cuánto se movió la mano desde que apretamos
        const currentPos = new THREE.Vector3();
        ctrlLeft.getWorldPosition(currentPos);
        
        const delta = new THREE.Vector3().subVectors(currentPos, STATE.dragStartPos);
        
        // Mover el dolly en dirección contraria (arrastrar el mundo)
        // O mover el dolly hacia la mano (como escalar). 
        // Implementación "Drag World":
        
        // Para que se sienta natural: DollyPos = StartDollyPos + (StartHand - CurrentHand)
        // (Si muevo la mano a la izquierda, el mundo se mueve a la izquierda, yo siento que voy a la derecha)
        
        // Corrección para VR (World Pulling):
        // Necesitamos calcular el desplazamiento en coordenadas locales del dolly para evitar rotaciones extrañas,
        // pero por simplicidad haremos traslación directa.
        
        // Re-calibrar lógica simple:
        // Delta = Current - Start.
        // Dolly = StartDolly - Delta.
        
        // IMPORTANTE: Al mover el dolly, el controller también se mueve (es hijo), 
        // lo que crea un bucle de retroalimentación. 
        // Solución simple: Mover el dolly y actualizar el startPos para el siguiente frame.
        
        const moveVector = delta.multiplyScalar(-1); // Invertir
        dolly.position.add(moveVector);
        
        // Resetear startPos para el siguiente frame relativo
        // (Esto evita el jittering del parentesco)
        // Pero como getControllerPosition es world, necesitamos cuidado.
        // Forma más segura sin bucles complejos:
        // Solo mover si el delta es significativo y usar velocidades.
        
        // Solución estable "Skyrim style":
        // No podemos usar world position directo así porque el mando es hijo del dolly.
        // Usamos la posición local del mando respecto al dolly.
        
        // Simplificación funcional:
        // Solo moveremos en X y Z para evitar volar involuntariamente (opcional)
        // moveVector.y = 0; 
        
        // Reiniciamos el punto de anclaje virtual
        STATE.dragStartPos.add(moveVector); 
    }
}

// --- DERECHA: SELECCIÓN Y EDICIÓN ---

function onRightTrigger() {
    if (STATE.menuVisible && checkUIInteraction(ctrlRight)) return;

    if (STATE.mode === 'OBJECT') {
        const hits = getIntersections(ctrlRight, objects);
        if (hits.length > 0) selectObject(hits[0].object);
        else selectObject(null);
    } 
    else if (STATE.mode === 'EDIT' && STATE.closestVertex) {
        // Seleccionar vértice
        const v = STATE.closestVertex;
        if (!STATE.selection.includes(v)) {
            STATE.selection.push(v);
            v.material.color.setHex(STATE.colors.highlight);
        } else {
            STATE.selection = STATE.selection.filter(x => x !== v);
            v.material.color.setHex(STATE.colors.vertex);
        }
    }
}

function onRightGripStart() {
    if (STATE.mode === 'OBJECT' && STATE.selected) {
        STATE.grabbedElement = STATE.selected;
        gripRight.attach(STATE.selected); // Parentesco físico
    } else if (STATE.mode === 'EDIT' && STATE.closestVertex) {
        STATE.grabbedElement = STATE.closestVertex;
        gripRight.attach(STATE.closestVertex);
    }
}

function onRightGripEnd() {
    if (STATE.grabbedElement) {
        scene.attach(STATE.grabbedElement); // Devolver a la escena
        if (STATE.grabbedElement.userData.isVertex) {
            // Re-parentar al mesh original
            const v = STATE.grabbedElement;
            v.userData.parentMesh.add(v);
            updateVertexGeo(v);
        }
        STATE.grabbedElement = null;
    }
}

// ==========================================
// MENÚ UI
// ==========================================
function createUIPanel() {
    uiPanel = new THREE.Group();
    
    // Fondo
    const bg = new THREE.Mesh(
        new THREE.PlaneGeometry(0.4, 0.5),
        new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide })
    );
    uiPanel.add(bg);
    
    // Título
    addTextToPanel('MENÚ PRINCIPAL', 0, 0.22, 20);

    // Botones
    addButton('📦 Cubo', -0.1, 0.1, () => spawn('box'));
    addButton('🔵 Esfera', 0.1, 0.1, () => spawn('sphere'));
    
    addButton('Modo Objeto', -0.1, 0.0, () => setMode('OBJECT'));
    addButton('Modo Edit', 0.1, 0.0, () => setMode('EDIT'));
    
    addButton('Color: Rojo', -0.1, -0.1, () => colorize(0xff0000));
    addButton('Color: Azul', 0.1, -0.1, () => colorize(0x0000ff));

    uiPanel.visible = false;
    scene.add(uiPanel);
}

function addButton(text, x, y, callback) {
    const btn = new THREE.Mesh(
        new THREE.PlaneGeometry(0.18, 0.08),
        new THREE.MeshBasicMaterial({ color: 0x333333 })
    );
    btn.position.set(x, y, 0.01);
    btn.userData = { isButton: true, callback: callback };
    
    // Texto del botón (Canvas simple)
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white';
    ctx.font = '40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(text, 128, 80);
    const tex = new THREE.CanvasTexture(canvas);
    const label = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.09), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    label.position.z = 0.01;
    btn.add(label);
    
    uiPanel.add(btn);
    UI.buttons.push(btn);
}

function addTextToPanel(text, x, y, size) {
    // Simplificación: En producción usar TextGeometry o TroikaText
    // Aquí solo placeholder visual
}

function toggleMenu() {
    STATE.menuVisible = !STATE.menuVisible;
    uiPanel.visible = STATE.menuVisible;

    if (STATE.menuVisible) {
        if (gripLeft) {
            // Pegar a la mano izquierda
            uiPanel.position.set(0.2, 0.1, 0); // Offset lateral
            uiPanel.rotation.set(-Math.PI/4, 0, -Math.PI/10);
            gripLeft.add(uiPanel);
        } else {
            // Flotar frente a cámara
            scene.add(uiPanel);
            uiPanel.position.copy(camera.position).add(new THREE.Vector3(0,0,-0.5).applyQuaternion(camera.quaternion));
            uiPanel.lookAt(camera.position);
        }
    } else {
        scene.add(uiPanel); // Devolver a escena para no perderlo
    }
}

function checkUIInteraction(controller) {
    _mat.identity().extractRotation(controller.matrixWorld);
    _ray.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat);

    const hits = _ray.intersectObjects(UI.buttons, false);
    if (hits.length > 0) {
        const btn = hits[0].object;
        btn.material.color.setHex(0x555555); // Feedback visual flash
        setTimeout(() => btn.material.color.setHex(0x333333), 100);
        
        if (btn.userData.callback) btn.userData.callback();
        return true;
    }
    return false;
}

// ==========================================
// FUNCIONES DE MODELADO
// ==========================================
function spawn(type) {
    let geo;
    if (type === 'box') geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    else geo = new THREE.SphereGeometry(0.15, 32, 16);
    
    const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
    const mesh = new THREE.Mesh(geo, mat);
    
    // Spawn frente al usuario
    const spawnPos = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).add(camera.position);
    mesh.position.copy(spawnPos);
    
    scene.add(mesh);
    objects.push(mesh);
    selectObject(mesh);
}

function selectObject(obj) {
    if (STATE.selected) STATE.selected.material.emissive.setHex(0x000000);
    STATE.selected = obj;
    if (obj) {
        obj.material.emissive.setHex(0x333333);
        STATE.mainMesh = obj;
        gizmo.visible = true;
    } else {
        STATE.mainMesh = null;
        gizmo.visible = false;
    }
    document.getElementById('sel-display').textContent = obj ? 'Objeto' : 'Nada';
}

function setMode(mode) {
    STATE.mode = mode;
    document.getElementById('mode-display').textContent = mode;
    
    // Limpiar helpers
    STATE.vertexHelpers.forEach(h => h.parent.remove(h));
    STATE.vertexHelpers = [];

    if (mode === 'EDIT' && STATE.mainMesh) {
        // Crear helpers de vértices
        const pos = STATE.mainMesh.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            const v = new THREE.Vector3().fromBufferAttribute(pos, i);
            const h = new THREE.Mesh(
                new THREE.SphereGeometry(0.015, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0x00ff00 })
            );
            h.position.copy(v);
            h.userData = { isVertex: true, index: i, parentMesh: STATE.mainMesh };
            STATE.mainMesh.add(h);
            STATE.vertexHelpers.push(h);
        }
        STATE.mainMesh.material.wireframe = true;
    } else if (STATE.mainMesh) {
        STATE.mainMesh.material.wireframe = false;
    }
}

function updateVertexGeo(helper) {
    const mesh = helper.userData.parentMesh;
    const attr = mesh.geometry.attributes.position;
    attr.setXYZ(helper.userData.index, helper.position.x, helper.position.y, helper.position.z);
    attr.needsUpdate = true;
}

function colorize(color) {
    if (STATE.selected) STATE.selected.material.color.setHex(color);
}

// ==========================================
// LOOP PRINCIPAL
// ==========================================
function render() {
    // Locomoción (Mover el usuario con la mano izquierda)
    updateLocomotion();
    
    // Actualizar Gizmo
    if (STATE.selected && gizmo.visible) {
        gizmo.position.copy(STATE.selected.position);
    }

    // Proximidad en modo edición
    if (STATE.mode === 'EDIT' && ctrlRight && STATE.vertexHelpers.length > 0) {
        const handPos = new THREE.Vector3();
        ctrlRight.getWorldPosition(handPos);
        
        let minDist = 0.1;
        let closest = null;
        
        STATE.vertexHelpers.forEach(h => {
            const hPos = new THREE.Vector3();
            h.getWorldPosition(hPos);
            const d = hPos.distanceTo(handPos);
            if (d < minDist) { minDist = d; closest = h; }
        });
        
        STATE.closestVertex = closest;
        // Feedback visual simple
        STATE.vertexHelpers.forEach(h => h.scale.setScalar(1));
        if (closest) closest.scale.setScalar(2);
    }

    renderer.render(scene, camera);
}

// Utilidades
function getIntersections(controller, list) {
    _mat.identity().extractRotation(controller.matrixWorld);
    _ray.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat);
    return _ray.intersectObjects(list, false);
}

function createGizmo() {
    gizmo = new THREE.AxesHelper(0.3);
    gizmo.visible = false;
    scene.add(gizmo);
}

</script>
</body>
</html>
