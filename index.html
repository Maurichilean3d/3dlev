
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Studio: Wrist Menu & Vertex Edit</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(10,10,20,0.9); z-index: 999; color: #ffaa00;
        }
        button {
            padding: 15px 40px; font-size: 20px; background: #ffaa00; color: #000; border: none;
            border-radius: 30px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="overlay">
    <h1>MR STUDIO: WRIST EDITION</h1>
    <p>Mano Izquierda: MENÚ | Mano Derecha: EDITAR</p>
    <button id="btn-start">ENTRAR EN MR (AR)</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ============================================================================
// VARIABLES GLOBALES
// ============================================================================
let scene, camera, renderer;
let controllerLeft, controllerRight;
let controllerGripLeft, controllerGripRight;
let raycaster, tempMatrix = new THREE.Matrix4();

// Grupos
const objectsGroup = new THREE.Group(); // Objetos editables
const helpersGroup = new THREE.Group(); // Visualizadores de vértices
const uiGroup = new THREE.Group();      // El menú de muñeca

// Estado
const APP = {
    mode: 'OBJECT', // 'OBJECT' o 'VERTEX'
    selected: null, // Objeto seleccionado
    grabbedElement: null, // Lo que estamos arrastrando (objeto o vértice)
    grabOffset: new THREE.Vector3() // Para arrastre suave
};

init();

function init() {
    // 1. Escena
    scene = new THREE.Scene();
    // Fondo gris oscuro por si falla AR, transparente luego
    scene.background = new THREE.Color(0x222222); 

    scene.add(objectsGroup);
    scene.add(helpersGroup);

    // Luces
    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(2, 4, 2);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    scene.add(new THREE.GridHelper(10, 10, 0x444444, 0x222222));

    // 2. Cámara y Renderer
    camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 20);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 3. Controladores XR
    setupControllers();

    // 4. Crear Menú de Muñeca (Se añade al controllerLeft en setupControllers)
    createWristUI();

    // 5. Botón de inicio
    document.getElementById('btn-start').addEventListener('click', startXR);

    renderer.setAnimationLoop(render);
}

function startXR() {
    const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
    navigator.xr.requestSession('immersive-ar', sessionInit).then(session => {
        renderer.xr.setSession(session);
        document.getElementById('overlay').style.display = 'none';
        scene.background = null; // Passthrough activo
    });
}

// ============================================================================
// CONTROLADORES Y MENÚ DE MUÑECA
// ============================================================================
function setupControllers() {
    // --- MANO DERECHA (Puntero / Edición) ---
    controllerRight = renderer.xr.getController(0); 
    controllerRight.addEventListener('selectstart', onTriggerDown);
    controllerRight.addEventListener('selectend', onTriggerUp);
    scene.add(controllerRight);

    // Línea visual para apuntar
    const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-2)]);
    const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({color: 0xffaa00}));
    controllerRight.add(line);

    // --- MANO IZQUIERDA (Menú) ---
    controllerLeft = renderer.xr.getController(1);
    scene.add(controllerLeft);

    // Modelos de manos/controles
    const modelFactory = new XRControllerModelFactory();
    const gripRight = renderer.xr.getControllerGrip(0);
    gripRight.add(modelFactory.createControllerModel(gripRight));
    scene.add(gripRight);
    
    const gripLeft = renderer.xr.getControllerGrip(1);
    gripLeft.add(modelFactory.createControllerModel(gripLeft));
    scene.add(gripLeft);

    raycaster = new THREE.Raycaster();
}

function createWristUI() {
    // Panel base
    const panelGeo = new THREE.PlaneGeometry(0.25, 0.2); // 25cm x 20cm
    const panelMat = new THREE.MeshBasicMaterial({ color: 0x111111, opacity: 0.8, transparent: true, side: THREE.DoubleSide });
    const panel = new THREE.Mesh(panelGeo, panelMat);
    
    // Borde brillante
    const border = new THREE.LineSegments(new THREE.EdgesGeometry(panelGeo), new THREE.LineBasicMaterial({color: 0xffaa00}));
    panel.add(border);

    uiGroup.add(panel);

    // Helper para botones
    function createButton(label, color, x, y, callback) {
        const btnGeo = new THREE.BoxGeometry(0.06, 0.04, 0.01);
        const btnMat = new THREE.MeshBasicMaterial({ color: color });
        const btn = new THREE.Mesh(btnGeo, btnMat);
        btn.position.set(x, y, 0.01);
        
        // Texto simple (canvas texture)
        const canvas = document.createElement('canvas'); canvas.width=128; canvas.height=64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle=color; ctx.fillRect(0,0,128,64);
        ctx.fillStyle='black'; ctx.font='bold 24px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(label, 64, 32);
        btn.material = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) });

        btn.userData = { isButton: true, action: callback };
        uiGroup.add(btn);
    }

    // Botones Creación
    createButton("CUBO", 0x4488ff, -0.07, 0.05, () => createObject('box'));
    createButton("ESFERA", 0x44ff88, 0, 0.05, () => createObject('sphere'));
    createButton("BORRAR", 0xff4444, 0.07, 0.05, deleteSelected);

    // Botones Modo
    createButton("OBJETO", 0xffaa00, -0.04, -0.05, () => setMode('OBJECT'));
    createButton("VÉRTICE", 0xaa00ff, 0.04, -0.05, () => setMode('VERTEX'));

    // POSICIONAMIENTO EN LA MUÑECA IZQUIERDA
    // Ajustamos posición y rotación para que sea visible al girar la muñeca
    uiGroup.position.set(0.2, 0.05, 0); // Desplazado a la derecha del control (interior muñeca)
    uiGroup.rotation.x = -Math.PI / 2;  // Acostado
    uiGroup.rotation.z = Math.PI / 4;   // Ligeramente inclinado hacia la cara
    
    // ANCLAR AL CONTROLADOR IZQUIERDO
    controllerLeft.add(uiGroup);
}

// ============================================================================
// LÓGICA DE MODELADO
// ============================================================================

function createObject(type) {
    let geo;
    if(type === 'box') geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    else geo = new THREE.SphereGeometry(0.12, 16, 12);

    const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.6, metalness: 0.2 });
    const mesh = new THREE.Mesh(geo, mat);
    
    // Aparece frente al usuario
    const spawnPos = new THREE.Vector3(0, 0, -0.5).applyMatrix4(controllerRight.matrixWorld);
    mesh.position.copy(spawnPos);
    
    objectsGroup.add(mesh);
    selectObject(mesh);
}

function setMode(mode) {
    APP.mode = mode;
    helpersGroup.clear(); // Limpiar puntos verdes
    
    if (APP.selected) {
        if (mode === 'VERTEX') {
            generateVertexHelpers(APP.selected);
            // Hacer el objeto transparente para ver mejor los vértices
            APP.selected.material.transparent = true;
            APP.selected.material.opacity = 0.6;
            APP.selected.material.wireframe = true;
        } else {
            // Restaurar objeto
            APP.selected.material.transparent = false;
            APP.selected.material.opacity = 1.0;
            APP.selected.material.wireframe = false;
        }
    }
}

function selectObject(mesh) {
    if (APP.selected && APP.selected !== mesh) {
        // Deseleccionar anterior
        if(APP.mode === 'VERTEX') {
            APP.selected.material.wireframe = false;
            APP.selected.material.transparent = false;
        }
    }
    APP.selected = mesh;
    setMode(APP.mode); // Refrescar visuales
}

function deleteSelected() {
    if (APP.selected) {
        objectsGroup.remove(APP.selected);
        APP.selected = null;
        helpersGroup.clear();
    }
}

// Genera esferas en cada vértice
function generateVertexHelpers(mesh) {
    const pos = mesh.geometry.attributes.position;
    const worldMat = mesh.matrixWorld;

    for (let i = 0; i < pos.count; i++) {
        const v = new THREE.Vector3().fromBufferAttribute(pos, i);
        v.applyMatrix4(worldMat); // Local a World

        const helper = new THREE.Mesh(
            new THREE.SphereGeometry(0.015, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0x00ff00 })
        );
        helper.position.copy(v);
        helper.userData = { 
            isVertex: true, 
            index: i, 
            parentMesh: mesh 
        };
        helpersGroup.add(helper);
    }
}

// ============================================================================
// INTERACCIÓN (RAYCAST & ARRASTRE)
// ============================================================================

function onTriggerDown(event) {
    const controller = event.target;

    // 1. Raycast
    tempMatrix.identity().extractRotation(controller.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

    // A. ¿Toca el Menú?
    const uiHits = raycaster.intersectObjects(uiGroup.children);
    if (uiHits.length > 0) {
        const btn = uiHits[0].object;
        if (btn.userData.isButton) {
            btn.userData.action();
            // Feedback visual
            btn.scale.set(0.9, 0.9, 0.9);
            setTimeout(() => btn.scale.set(1,1,1), 100);
            return;
        }
    }

    // B. ¿Toca un Vértice (Modo Vértice)?
    if (APP.mode === 'VERTEX') {
        const vertHits = raycaster.intersectObjects(helpersGroup.children);
        if (vertHits.length > 0) {
            const helper = vertHits[0].object;
            startGrab(controller, helper);
            return;
        }
    }

    // C. ¿Toca un Objeto?
    const objHits = raycaster.intersectObjects(objectsGroup.children);
    if (objHits.length > 0) {
        const obj = objHits[0].object;
        selectObject(obj);
        // Si estamos en modo Objeto, permitimos moverlo
        if (APP.mode === 'OBJECT') {
            startGrab(controller, obj);
        }
    }
}

function startGrab(controller, element) {
    APP.grabbedElement = element;
    
    // Calcular offset para que no salte al centro del control
    // Convertimos posición del elemento a espacio local del controlador
    const invControl = controller.matrixWorld.clone().invert();
    APP.grabOffset.copy(element.position).applyMatrix4(invControl);
    
    // Cambiar color para feedback
    if(element.material) element.material.color.setHex(0xffffff); 
}

function onTriggerUp() {
    if (APP.grabbedElement) {
        // Restaurar color
        if(APP.grabbedElement.userData.isVertex) {
            APP.grabbedElement.material.color.setHex(0x00ff00);
        } else {
            // Objeto normal (color aleatorio no restaurado, simple reset a gris para demo)
             // Opcional
        }
        APP.grabbedElement = null;
    }
}

function render() {
    // LÓGICA DE ARRASTRE (Update frame a frame)
    if (APP.grabbedElement && controllerRight) {
        
        // 1. Calcular nueva posición World basada en el movimiento del controlador
        const newPos = APP.grabOffset.clone().applyMatrix4(controllerRight.matrixWorld);
        
        // 2. Aplicar posición al elemento visual (Esfera o Caja)
        APP.grabbedElement.position.copy(newPos);

        // 3. SI ES UN VÉRTICE: Actualizar la geometría real
        if (APP.grabbedElement.userData.isVertex) {
            const mesh = APP.grabbedElement.userData.parentMesh;
            const idx = APP.grabbedElement.userData.index;

            // Convertir World Pos -> Mesh Local Pos
            const localPos = newPos.clone();
            mesh.worldToLocal(localPos);

            // Inyectar en buffer
            const posAttr = mesh.geometry.attributes.position;
            posAttr.setXYZ(idx, localPos.x, localPos.y, localPos.z);
            posAttr.needsUpdate = true;
            
            // Recalcular normales para que la luz reaccione bien a la deformación
            mesh.geometry.computeVertexNormals();
        }
    }

    renderer.render(scene, camera);
}

</script>
</body>
</html>
