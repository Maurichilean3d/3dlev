
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Studio: Fixed VR Interface</title>
    <style>
        body { margin: 0; background-color: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        /* Botón de inicio centrado y grande */
        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 20px; background: #ffaa00; color: #000;
            border: none; border-radius: 10px; cursor: pointer; z-index: 9999;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.5);
        }

        /* Instrucciones simples en pantalla */
        #instructions {
            position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center;
            pointer-events: none; color: #888;
        }
    </style>
</head>
<body>

    <button id="start-btn">ENTRAR EN VR / AR</button>
    <div id="instructions">Usa el panel flotante dentro de la experiencia para crear objetos.</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        let scene, camera, renderer;
        let controller1, controller2;
        let controllerGrip1, controllerGrip2;
        let raycaster;
        let transformControl;
        
        const intersected = [];
        const objects = []; // Lista de objetos creados
        let menuGroup; // El menú 3D flotante

        init();
        animate();

        function init() {
            // 1. Configuración básica
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);
            camera.position.set(0, 1.6, 3);

            // Luces
            const light = new THREE.DirectionalLight(0xffffff, 2);
            light.position.set(1, 1, 1).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            // Grid para referencia
            const grid = new THREE.GridHelper(10, 10);
            scene.add(grid);

            // 2. Renderer con soporte XR
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 3. Configuración de Controladores VR
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            controller1.addEventListener('selectend', onSelectEnd);
            scene.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('selectend', onSelectEnd);
            scene.add(controller2);

            const controllerModelFactory = new XRControllerModelFactory();

            controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
            scene.add(controllerGrip1);

            controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
            scene.add(controllerGrip2);

            // Línea del rayo láser para apuntar
            const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]);
            const line = new THREE.Line(geometry);
            line.name = 'line';
            line.scale.z = 5;

            controller1.add(line.clone());
            controller2.add(line.clone());

            raycaster = new THREE.Raycaster();

            // 4. Transform Controls (Gizmo para mover objetos)
            transformControl = new TransformControls(camera, renderer.domElement);
            // Hacer que el gizmo funcione en VR requiere trucos avanzados, 
            // para esta versión simple usaremos "agarrar y mover" básico sin gizmo complejo,
            // o arrastre directo.
            scene.add(transformControl);

            // 5. Crear el MENÚ FLOTANTE 3D
            createFloatingMenu();

            // Eventos de ventana
            window.addEventListener('resize', onWindowResize);

            // Configurar botón de entrada
            setupVRButton();
        }

        function createFloatingMenu() {
            menuGroup = new THREE.Group();
            menuGroup.position.set(0, 1.5, -1); // 1.5m de altura, 1m frente al usuario
            scene.add(menuGroup);

            // Fondo del menú
            const panelGeo = new THREE.PlaneGeometry(0.8, 0.3);
            const panelMat = new THREE.MeshBasicMaterial({ color: 0x333333, opacity: 0.8, transparent: true });
            const panel = new THREE.Mesh(panelGeo, panelMat);
            menuGroup.add(panel);

            // Función helper para botones
            function create3DButton(name, color, x, action) {
                const btnGeo = new THREE.BoxGeometry(0.2, 0.1, 0.05);
                const btnMat = new THREE.MeshStandardMaterial({ color: color });
                const btn = new THREE.Mesh(btnGeo, btnMat);
                btn.position.set(x, 0, 0.05);
                btn.userData = { isButton: true, action: action }; // Guardamos la acción aquí
                menuGroup.add(btn);
                return btn;
            }

            // Botón Cubo (Rojo)
            create3DButton('Cubo', 0xff0000, -0.25, () => createObject('box'));
            
            // Botón Esfera (Verde)
            create3DButton('Esfera', 0x00ff00, 0, () => createObject('sphere'));

            // Botón Cilindro (Azul)
            create3DButton('Cilindro', 0x0000ff, 0.25, () => createObject('cylinder'));
        }

        function createObject(type) {
            let geometry;
            let color = Math.random() * 0xffffff;

            if (type === 'box') geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            else if (type === 'sphere') geometry = new THREE.SphereGeometry(0.15, 32, 16);
            else if (type === 'cylinder') geometry = new THREE.CylinderGeometry(0.1, 0.1, 0.2, 32);

            const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
            const mesh = new THREE.Mesh(geometry, material);

            // Aparece frente al usuario (ligeramente más cerca que el menú)
            mesh.position.set(0, 1.2, -0.5);
            mesh.userData.isDraggable = true; // Marca para poder arrastrarlo

            scene.add(mesh);
            objects.push(mesh);
        }

        function setupVRButton() {
            const button = document.getElementById('start-btn');
            
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    const mode = supported ? 'immersive-ar' : 'immersive-vr';
                    button.textContent = supported ? 'INICIAR AR (Passthrough)' : 'INICIAR VR';
                    
                    button.addEventListener('click', () => {
                        const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
                        navigator.xr.requestSession(mode, sessionInit).then((session) => {
                            renderer.xr.setSession(session);
                            button.style.display = 'none'; // Ocultar botón HTML
                            if (supported) scene.background = null; // Fondo transparente para AR
                        });
                    });
                });
            } else {
                button.textContent = "WEBXR NO SOPORTADO";
                button.disabled = true;
            }
        }

        function onSelectStart(event) {
            const controller = event.target;
            const intersections = getIntersections(controller);

            if (intersections.length > 0) {
                const intersection = intersections[0];
                const object = intersection.object;

                // 1. Si es un botón del menú
                if (object.userData.isButton) {
                    object.userData.action(); // Ejecutar acción (crear cubo, etc.)
                    // Animación simple de click
                    object.scale.set(0.9, 0.9, 0.9);
                    setTimeout(() => object.scale.set(1, 1, 1), 100);
                    return;
                }

                // 2. Si es un objeto creado (Arrastrar)
                if (object.userData.isDraggable) {
                    controller.attach(object); // Pegar objeto al control
                    controller.userData.selected = object;
                }
            }
        }

        function onSelectEnd(event) {
            const controller = event.target;
            if (controller.userData.selected) {
                const object = controller.userData.selected;
                scene.attach(object); // Soltar objeto en la escena
                controller.userData.selected = null;
            }
        }

        function getIntersections(controller) {
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controller.matrixWorld);

            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            // Detectar tanto el menú como los objetos creados
            const targetObjects = [...menuGroup.children, ...objects];
            return raycaster.intersectObjects(targetObjects, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
