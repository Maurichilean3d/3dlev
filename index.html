<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Studio: Debug Edition</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; color: #0f0; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.9); z-index: 999;
        }
        button {
            padding: 20px 50px; font-size: 20px; background: #00ff00; color: #000; border: none;
            border-radius: 5px; cursor: pointer; margin-top: 20px; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="overlay">
    <h1>MR STUDIO: SURGICAL MODE</h1>
    <p>Depuración activada. Revisa el panel flotante en VR.</p>
    <button id="btn-start">INICIAR SISTEMA</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// ==========================================
// VARIABLES
// ==========================================
let scene, camera, renderer;
let ctrlRight, ctrlLeft, gripLeft;
let uiGroup; 
const uiButtons = []; 
const objects = []; 
let gizmo; 
let debugPanel, debugCtx; // Panel de texto para ver errores en VR

// ESTADO
const STATE = {
    hoveredBtn: null,
    selected: null, 
    mode: 'OBJECT', // OBJECT | VERTEX
    vertexHelpers: [], // Lista de puntos verdes
    activeMesh: null   // El objeto que estamos editando
};

// UTILIDADES REUTILIZABLES
const _ray = new THREE.Raycaster();
const _mat = new THREE.Matrix4();
const _vec = new THREE.Vector3();

init();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    // Luces
    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(2, 5, 2);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    scene.add(new THREE.GridHelper(10, 10, 0x333333, 0x111111));

    camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.6, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // GIZMO
    gizmo = new TransformControls(camera, renderer.domElement);
    gizmo.addEventListener('dragging-changed', (e) => {
        // Bloquear logica extra mientras arrastras
    });
    gizmo.addEventListener('change', () => {
        if (STATE.mode === 'VERTEX' && STATE.selected && STATE.selected.userData.isVertex) {
            updateVertexPosition(STATE.selected);
        }
    });
    scene.add(gizmo);

    createDebugPanel();
    setupControllers();
    createWristUI();

    document.getElementById('btn-start').addEventListener('click', () => {
        navigator.xr.requestSession('immersive-ar', { 
            optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] 
        }).then(session => {
            renderer.xr.setSession(session);
            document.getElementById('overlay').style.display = 'none';
            scene.background = null;
            log("Sesión Iniciada. Esperando mandos...");
        });
    });

    renderer.setAnimationLoop(render);
}

// ==========================================
// DEBUG EN VR (Panel Flotante)
// ==========================================
function createDebugPanel() {
    const cvs = document.createElement('canvas');
    cvs.width = 512; cvs.height = 256;
    debugCtx = cvs.getContext('2d');
    debugCtx.fillStyle = 'rgba(0,0,0,0.8)';
    debugCtx.fillRect(0,0,512,256);
    
    const tex = new THREE.CanvasTexture(cvs);
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.25), mat);
    plane.position.set(0, 1.8, -1.5); // Flotando frente a la cara
    scene.add(plane);
    debugPanel = tex;
    log("Sistema listo.");
}

function log(msg) {
    if (!debugCtx) return;
    // Limpiar y redibujar
    debugCtx.fillStyle = 'rgba(0,0,0,0.8)';
    debugCtx.fillRect(0,0,512,256);
    debugCtx.fillStyle = '#0f0';
    debugCtx.font = '24px monospace';
    debugCtx.fillText(msg, 10, 50);
    debugCtx.fillText("Mode: " + STATE.mode, 10, 100);
    if(STATE.selected) debugCtx.fillText("Sel: " + (STATE.selected.userData.isVertex ? "Vertice" : "Objeto"), 10, 140);
    debugPanel.needsUpdate = true;
}

// ==========================================
// CONTROLADORES
// ==========================================
function setupControllers() {
    const modelFactory = new XRControllerModelFactory();

    // Detección estricta de manos
    const c0 = renderer.xr.getController(0);
    const c1 = renderer.xr.getController(1);

    const onConnected = (e) => {
        if (e.data.handedness === 'right') {
            ctrlRight = e.target;
            log("Mano Derecha Conectada");
            
            // Rayo
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]),
                new THREE.LineBasicMaterial({ color: 0x0088ff })
            );
            ctrlRight.add(line);
            
            ctrlRight.addEventListener('selectstart', onTriggerStart);
        }
        if (e.data.handedness === 'left') {
            ctrlLeft = e.target;
            log("Mano Izquierda Conectada");
        }
    };

    c0.addEventListener('connected', onConnected);
    c1.addEventListener('connected', onConnected);
    scene.add(c0);
    scene.add(c1);

    // Grip Izquierdo para el menú
    gripLeft = renderer.xr.getControllerGrip(0); // Asumimos 0/1, si falla, el menú no aparecerá pero el log dirá por qué
    // Mejor lógica: buscar el grip que coincida con la mano izquierda
    gripLeft.add(modelFactory.createControllerModel(gripLeft));
    scene.add(gripLeft);
}

// ==========================================
// UI
// ==========================================
function createWristUI() {
    uiGroup = new THREE.Group();
    // Posición y rotación de reloj
    uiGroup.position.set(0.05, 0.05, -0.05);
    uiGroup.rotation.set(-Math.PI/2, 0, Math.PI/2);

    const bg = new THREE.Mesh(
        new THREE.PlaneGeometry(0.18, 0.22),
        new THREE.MeshBasicMaterial({ color: 0x000000, opacity: 0.8, transparent: true })
    );
    uiGroup.add(bg);

    createBtn('CUBO', 0x0055ff, -0.04, 0.06, () => spawn('box'));
    createBtn('ESFERA', 0x00aa55, 0.04, 0.06, () => spawn('sphere'));
    
    createBtn('MOVER', 0xffaa00, -0.04, 0.01, () => setGizmo('translate'));
    createBtn('EDITAR (VERT)', 0xff00ff, 0.04, 0.01, toggleEditMode);
    
    createBtn('BORRAR', 0xff0000, 0, -0.06, deleteSelected);
}

function createBtn(text, color, x, y, cb) {
    const btn = new THREE.Mesh(
        new THREE.PlaneGeometry(0.07, 0.04),
        new THREE.MeshBasicMaterial({ color: color })
    );
    btn.position.set(x, y, 0.01);
    
    // Canvas Text
    const cvs = document.createElement('canvas'); cvs.width=128; cvs.height=64;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#' + new THREE.Color(color).getHexString(); ctx.fillRect(0,0,128,64);
    ctx.fillStyle = 'white'; ctx.font = 'bold 20px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(text, 64, 32);
    const tex = new THREE.CanvasTexture(cvs);
    
    const label = new THREE.Mesh(new THREE.PlaneGeometry(0.07, 0.04), new THREE.MeshBasicMaterial({map:tex, transparent:true}));
    label.position.z = 0.005;
    btn.add(label);

    btn.userData = { isButton: true, action: cb, baseColor: new THREE.Color(color) };
    uiGroup.add(btn);
    uiButtons.push(btn);
}

// ==========================================
// LÓGICA CORE
// ==========================================

function onTriggerStart() {
    if (STATE.hoveredBtn) {
        log("Boton presionado");
        STATE.hoveredBtn.userData.action();
        // Animacion
        STATE.hoveredBtn.scale.set(0.9,0.9,1);
        setTimeout(()=>STATE.hoveredBtn.scale.set(1,1,1), 100);
    } else {
        // Intentar seleccionar en escena
        trySelect();
    }
}

function render() {
    // Anclar menú a mano izquierda si está disponible
    if (uiGroup.parent !== gripLeft && gripLeft) {
        gripLeft.add(uiGroup);
    }

    if (ctrlRight) {
        _mat.identity().extractRotation(ctrlRight.matrixWorld);
        _ray.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
        _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat);

        // 1. Check UI
        const uiHits = _ray.intersectObjects(uiButtons, false);
        if (uiHits.length > 0) {
            if(STATE.hoveredBtn !== uiHits[0].object) {
                if(STATE.hoveredBtn) STATE.hoveredBtn.material.color.copy(STATE.hoveredBtn.userData.baseColor);
                STATE.hoveredBtn = uiHits[0].object;
                STATE.hoveredBtn.material.color.setHex(0xffffff);
            }
        } else {
            if(STATE.hoveredBtn) {
                STATE.hoveredBtn.material.color.copy(STATE.hoveredBtn.userData.baseColor);
                STATE.hoveredBtn = null;
            }
        }
    }

    renderer.render(scene, camera);
}

// ==========================================
// LÓGICA DE EDICIÓN (LA CLAVE)
// ==========================================

function spawn(type) {
    let geo = (type==='box') ? new THREE.BoxGeometry(0.2,0.2,0.2) : new THREE.SphereGeometry(0.15,12,8);
    let mat = new THREE.MeshStandardMaterial({ color: Math.random()*0xffffff, roughness:0.4 });
    let mesh = new THREE.Mesh(geo, mat);
    
    mesh.position.set(0, 1.3, -0.5).applyMatrix4(camera.matrixWorld);
    scene.add(mesh);
    objects.push(mesh);
    
    select(mesh);
    log("Objeto Creado");
}

function toggleEditMode() {
    if (!STATE.activeMesh && (!STATE.selected || STATE.selected.userData.isVertex)) {
        log("Selecciona un objeto primero");
        return;
    }

    if (STATE.mode === 'OBJECT') {
        // ENTRAR A MODO VÉRTICE
        STATE.mode = 'VERTEX';
        STATE.activeMesh = STATE.selected; // Guardar referencia
        
        gizmo.detach();
        
        // 1. Mostrar Wireframe
        STATE.activeMesh.material.wireframe = true;
        
        // 2. Generar Puntos Verdes
        generateVertexHelpers(STATE.activeMesh);
        
        log("MODO VERTICE: Objeto bloqueado");
        
    } else {
        // SALIR A MODO OBJETO
        STATE.mode = 'OBJECT';
        
        gizmo.detach();
        
        // 1. Quitar Wireframe
        if(STATE.activeMesh) {
            STATE.activeMesh.material.wireframe = false;
            removeVertexHelpers(STATE.activeMesh);
            select(STATE.activeMesh);
        }
        
        STATE.vertexHelpers = [];
        log("MODO OBJETO");
    }
}

function trySelect() {
    // Si estamos en la UI, ignorar
    if (STATE.hoveredBtn) return;

    let targets = [];

    if (STATE.mode === 'VERTEX') {
        // FILTRO QUIRÚRGICO: Solo miramos los puntos verdes.
        // Ignoramos completamente el array 'objects' (los cubos grandes)
        targets = STATE.vertexHelpers; 
    } else {
        // Modo normal
        targets = objects;
    }

    const hits = _ray.intersectObjects(targets, false);

    if (hits.length > 0) {
        select(hits[0].object);
        log("Seleccionado: " + (hits[0].object.userData.isVertex ? "Punto" : "Objeto"));
    } else {
        // Si clicamos en el vacío en modo objeto, deseleccionar.
        // En modo vértice, no deseleccionamos para no perder el contexto.
        if (STATE.mode === 'OBJECT') {
            select(null);
            log("Deseleccionado");
        }
    }
}

function select(obj) {
    STATE.selected = obj;
    
    if (!obj) {
        gizmo.detach();
        return;
    }

    if (obj.userData.isVertex) {
        gizmo.attach(obj);
        gizmo.setSpace('local'); 
        obj.material.color.setHex(0xffff00); // Amarillo
    } else {
        // Solo permitir seleccionar objetos principales en modo OBJETO
        if (STATE.mode === 'OBJECT') {
            gizmo.attach(obj);
            gizmo.setSpace('local');
        }
    }
}

function setGizmo(mode) {
    gizmo.setMode(mode);
    log("Gizmo: " + mode);
}

// --- HELPER FUNCTIONS PARA VÉRTICES ---

function generateVertexHelpers(mesh) {
    STATE.vertexHelpers = []; // Limpiar lista
    const pos = mesh.geometry.attributes.position;
    
    // Usamos esferas para mejor detección visual, aunque consumen más que cubos
    const geo = new THREE.SphereGeometry(0.015, 6, 6); 
    const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

    for(let i=0; i<pos.count; i++) {
        const dot = new THREE.Mesh(geo, mat.clone());
        const v = new THREE.Vector3().fromBufferAttribute(pos, i);
        
        dot.position.copy(v); // Posición local relativa al padre
        dot.userData = { isVertex: true, index: i, parentMesh: mesh };
        
        mesh.add(dot); // IMPORTANTE: Es hijo del objeto
        STATE.vertexHelpers.push(dot); // Añadir a la lista "Quirúrgica"
    }
}

function removeVertexHelpers(mesh) {
    // Borrar hijos vértices
    for (let i = mesh.children.length - 1; i >= 0; i--) {
        if (mesh.children[i].userData.isVertex) {
            mesh.remove(mesh.children[i]);
        }
    }
    STATE.vertexHelpers = [];
}

function updateVertexPosition(dot) {
    const mesh = dot.userData.parentMesh;
    const idx = dot.userData.index;
    const attr = mesh.geometry.attributes.position;
    
    // Como el dot es hijo del mesh, dot.position YA ES local
    attr.setXYZ(idx, dot.position.x, dot.position.y, dot.position.z);
    attr.needsUpdate = true;
}

function deleteSelected() {
    if(STATE.selected && !STATE.selected.userData.isVertex) {
        scene.remove(STATE.selected);
        const idx = objects.indexOf(STATE.selected);
        if(idx > -1) objects.splice(idx, 1);
        gizmo.detach();
        STATE.selected = null;
        log("Borrado");
    }
}

</script>
</body>
</html>
