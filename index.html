<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Studio: Diamond Hybrid</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.9); z-index: 999;
        }
        button {
            padding: 20px 50px; font-size: 20px; background: #ffaa00; border: none;
            border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px;
            box-shadow: 0 0 20px #ffaa00;
        }
        .stats { font-size: 12px; color: #888; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>

<div id="overlay">
    <h1>MR STUDIO: HYBRID</h1>
    <p>Grip (Lateral): Rotación Libre (Mano)</p>
    <p>Gatillo (Índice): Gizmo de Precisión</p>
    <button id="btn-start">INICIAR SISTEMA</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// ==========================================
// 1. SISTEMA CENTRAL
// ==========================================
const _mat4 = new THREE.Matrix4();
const _ray = new THREE.Raycaster();
const _tempVec = new THREE.Vector3();

let scene, camera, renderer;
let ctrlRight, gripLeft, gripRight;
let uiGroup; 
const uiButtons = []; 
const objects = []; 
let gizmo; // El controlador de transformación (Flechas)

// Estado del Sistema
const STATE = {
    hoveredBtn: null,
    selectedObj: null,
    mode: 'OBJECT', // OBJECT | VERTEX
    gizmoMode: 'translate', // translate | rotate | scale
    menuAttached: false,
    grabbedObject: null // Objeto agarrado con el GRIP
};

init();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    // Luces
    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(2, 5, 2);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    scene.add(new THREE.GridHelper(10, 10, 0x333333, 0x111111));

    camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.6, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Gizmo (Transform Controls)
    gizmo = new TransformControls(camera, renderer.domElement);
    gizmo.addEventListener('dragging-changed', (event) => {
        // Desactivar otros inputs si estamos arrastrando el gizmo
    });
    // Al mover vértice, actualizar geometría
    gizmo.addEventListener('change', () => {
        if (STATE.mode === 'VERTEX' && STATE.selectedObj && STATE.selectedObj.userData.isVertex) {
            updateVertexGeo(STATE.selectedObj);
        }
    });
    scene.add(gizmo);

    setupControllers();
    createWristUI();

    document.getElementById('btn-start').addEventListener('click', () => {
        const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
        navigator.xr.requestSession('immersive-ar', sessionInit).then(session => {
            renderer.xr.setSession(session);
            document.getElementById('overlay').style.display = 'none';
            scene.background = null;
        });
    });

    renderer.setAnimationLoop(render);
}

function setupControllers() {
    const modelFactory = new XRControllerModelFactory();

    // --- MANO DERECHA (Interacción) ---
    const c0 = renderer.xr.getController(0);
    const c1 = renderer.xr.getController(1);

    const onConnected = (e) => {
        if (e.data.handedness === 'right') {
            ctrlRight = e.target;
            
            // Rayo Láser
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]),
                new THREE.LineBasicMaterial({ color: 0x0088ff })
            );
            ctrlRight.add(line);

            // GATILLO (Select / Gizmo)
            ctrlRight.addEventListener('selectstart', onTriggerStart);
            ctrlRight.addEventListener('selectend', onTriggerEnd);

            // GRIP/LATERAL (Agarre libre y rotación)
            ctrlRight.addEventListener('squeezestart', onGripStart);
            ctrlRight.addEventListener('squeezeend', onGripEnd);
        }
    };
    c0.addEventListener('connected', onConnected);
    c1.addEventListener('connected', onConnected);
    scene.add(c0);
    scene.add(c1);

    // Grips (Modelos)
    gripLeft = renderer.xr.getControllerGrip(0); 
    gripLeft.add(modelFactory.createControllerModel(gripLeft));
    scene.add(gripLeft);

    gripRight = renderer.xr.getControllerGrip(1);
    gripRight.add(modelFactory.createControllerModel(gripRight));
    scene.add(gripRight);
}

// ==========================================
// 2. UI COMPLETAMENTE RENOVADA
// ==========================================
function createWristUI() {
    uiGroup = new THREE.Group();
    // Posición y rotación ergonómica (revisada)
    uiGroup.position.set(0.05, 0.05, -0.05); 
    uiGroup.rotation.set(-Math.PI / 2, 0, Math.PI / 2);

    // Panel
    const w = 0.16, h = 0.20; // Más alto para opciones de edición
    const bg = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.8 })
    );
    const border = new THREE.LineSegments(
        new THREE.EdgesGeometry(bg.geometry),
        new THREE.LineBasicMaterial({ color: 0xffaa00 })
    );
    bg.add(border);
    uiGroup.add(bg);

    // --- SECCIÓN CREACIÓN ---
    createBtn('CUBO', 0x0055ff, -0.04, 0.07, () => spawn('box'));
    createBtn('ESFERA', 0x00aa55, 0.04, 0.07, () => spawn('sphere'));

    // --- SECCIÓN EDICIÓN (Gizmo) ---
    createBtn('MOVER', 0xffaa00, -0.04, 0.02, () => setGizmo('translate'));
    createBtn('ROTAR', 0xffaa00, 0.04, 0.02, () => setGizmo('rotate'));
    createBtn('ESCALAR', 0xffaa00, -0.04, -0.03, () => setGizmo('scale'));
    
    // --- SECCIÓN MODO ---
    createBtn('OBJ/VERT', 0xaa00aa, 0.04, -0.03, toggleMode);

    // --- ACCIONES ---
    createBtn('BORRAR', 0xff0000, 0, -0.08, deleteSelected);
}

function createBtn(text, color, x, y, cb) {
    const btn = new THREE.Mesh(
        new THREE.PlaneGeometry(0.06, 0.04),
        new THREE.MeshBasicMaterial({ color: color })
    );
    btn.position.set(x, y, 0.005);

    const cvs = document.createElement('canvas'); cvs.width=128; cvs.height=64;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#' + new THREE.Color(color).getHexString(); ctx.fillRect(0,0,128,64);
    ctx.fillStyle = 'white'; ctx.font = 'bold 24px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(text, 64, 32);
    
    const tex = new THREE.CanvasTexture(cvs);
    const label = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.03), new THREE.MeshBasicMaterial({map:tex, transparent:true}));
    label.position.z = 0.002;
    btn.add(label);

    btn.userData = { isButton: true, action: cb, baseColor: new THREE.Color(color) };
    uiGroup.add(btn);
    uiButtons.push(btn);
}

// ==========================================
// 3. LÓGICA DE INTERACCIÓN (HYBRID DIAMOND)
// ==========================================

// --- GRIP: MANIPULACIÓN LIBRE (ROTACIÓN) ---
function onGripStart() {
    // Si tenemos un objeto seleccionado (o un vértice), lo agarramos
    if (STATE.selectedObj) {
        // MAGIA DE THREE.JS: attach()
        // Esto mueve el objeto dentro del controlador manteniendo su posición visual exacta.
        // Al rotar la muñeca, el objeto rota con ella.
        STATE.grabbedObject = STATE.selectedObj;
        
        if (STATE.mode === 'OBJECT') {
            gizmo.detach(); // Ocultar gizmo mientras agarramos
            ctrlRight.attach(STATE.grabbedObject);
            highlight(STATE.grabbedObject, 0xffffff); // Blanco al agarrar
        } 
        else if (STATE.mode === 'VERTEX') {
            // Lógica especial vértices (opcional, por ahora solo objetos para grip)
            // Para vértices es mejor usar el Gizmo
        }
    }
}

function onGripEnd() {
    if (STATE.grabbedObject) {
        // Devolver a la escena
        scene.attach(STATE.grabbedObject); // Mantiene la nueva posición mundial
        
        if (STATE.mode === 'OBJECT') {
            gizmo.attach(STATE.grabbedObject); // Devolver gizmo
            highlight(STATE.grabbedObject, 0xffff00); // Amarillo al soltar
        }
        STATE.grabbedObject = null;
    }
}

// --- TRIGGER: UI & GIZMO ---
function onTriggerStart() {
    if (STATE.hoveredBtn) {
        STATE.hoveredBtn.userData.action();
        pulseBtn(STATE.hoveredBtn);
    } else {
        // Raycast para seleccionar
        checkSelection();
    }
}

function onTriggerEnd() {
    // Nada especial, el Gizmo se maneja solo
}

function render() {
    // Anclar UI
    if (!STATE.menuAttached && gripLeft) {
        gripLeft.add(uiGroup);
        STATE.menuAttached = true;
    }

    if (ctrlRight) {
        // Actualizar Raycaster
        _mat4.identity().extractRotation(ctrlRight.matrixWorld);
        _ray.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
        _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat4);

        // UI Hover
        const uiHits = _ray.intersectObjects(uiButtons, false);
        if (uiHits.length > 0) {
            setHover(uiHits[0].object);
        } else {
            setHover(null);
        }
    }

    renderer.render(scene, camera);
}

// ==========================================
// 4. FUNCIONES DE EDICIÓN
// ==========================================

function spawn(type) {
    let geo;
    if(type==='box') geo = new THREE.BoxGeometry(0.2,0.2,0.2);
    else geo = new THREE.SphereGeometry(0.15, 16, 12);

    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: Math.random()*0xffffff, roughness: 0.5 }));
    
    // Spawn frente al usuario
    mesh.position.set(0, 0, -0.5).applyMatrix4(camera.matrixWorld);
    
    scene.add(mesh);
    objects.push(mesh);
    select(mesh);
}

function checkSelection() {
    // Solo si no estamos sobre la UI
    if (STATE.hoveredBtn) return;

    // Si estamos en modo vértice, raycast a puntos
    let targets = objects;
    if (STATE.mode === 'VERTEX' && STATE.selectedObj && STATE.selectedObj.children.length > 0) {
        // Los hijos son los puntos verdes
        targets = STATE.selectedObj.children; 
    }

    const hits = _ray.intersectObjects(targets, false);
    if (hits.length > 0) {
        select(hits[0].object);
    } else {
        // Si clicamos fuera, soltamos (opcional)
    }
}

function select(obj) {
    if (STATE.selectedObj === obj) return;

    // Limpieza selección anterior
    if (STATE.selectedObj && STATE.mode === 'OBJECT') {
        highlight(STATE.selectedObj, null); // Quitar color
    }

    STATE.selectedObj = obj;

    if (obj) {
        // Si seleccionamos un VÉRTICE (punto verde)
        if (obj.userData.isVertex) {
             gizmo.attach(obj);
             gizmo.setSpace('local'); // Vértices mejor en local
        } 
        // Si seleccionamos un OBJETO
        else {
             if (STATE.mode === 'OBJECT') {
                 highlight(obj, 0xffff00);
                 gizmo.attach(obj);
                 gizmo.setSpace('local');
             }
        }
    } else {
        gizmo.detach();
    }
}

function setGizmo(mode) {
    STATE.gizmoMode = mode;
    gizmo.setMode(mode);
}

function toggleMode() {
    if (!STATE.selectedObj || STATE.selectedObj.userData.isVertex) return;

    if (STATE.mode === 'OBJECT') {
        STATE.mode = 'VERTEX';
        gizmo.detach(); // Quitamos gizmo del objeto principal
        STATE.selectedObj.material.wireframe = true;
        createVertexHelpers(STATE.selectedObj);
    } else {
        STATE.mode = 'OBJECT';
        clearVertexHelpers(STATE.selectedObj);
        STATE.selectedObj.material.wireframe = false;
        gizmo.attach(STATE.selectedObj); // Volvemos gizmo al objeto
    }
}

// Helpers de Vértices
function createVertexHelpers(mesh) {
    const pos = mesh.geometry.attributes.position;
    for(let i=0; i<pos.count; i++) {
        const v = new THREE.Vector3().fromBufferAttribute(pos, i);
        // Crear punto visual
        const dot = new THREE.Mesh(
            new THREE.BoxGeometry(0.015, 0.015, 0.015),
            new THREE.MeshBasicMaterial({ color: 0x00ff00 })
        );
        // Posicionar en local
        dot.position.copy(v);
        dot.userData = { isVertex: true, index: i, parentMesh: mesh };
        mesh.add(dot); // Añadimos como hijo para que siga al objeto
    }
}

function clearVertexHelpers(mesh) {
    // Borrar hijos que sean vértices
    for(let i = mesh.children.length - 1; i >= 0; i--) {
        if(mesh.children[i].userData.isVertex) {
            mesh.remove(mesh.children[i]);
        }
    }
}

function updateVertexGeo(dot) {
    const mesh = dot.userData.parentMesh;
    const idx = dot.userData.index;
    const posAttr = mesh.geometry.attributes.position;
    
    // dot.position ya es local porque es hijo del mesh
    posAttr.setXYZ(idx, dot.position.x, dot.position.y, dot.position.z);
    posAttr.needsUpdate = true;
}

function deleteSelected() {
    if (STATE.selectedObj) {
        if (STATE.selectedObj.userData.isVertex) return; // No borrar vértices sueltos
        gizmo.detach();
        scene.remove(STATE.selectedObj);
        const i = objects.indexOf(STATE.selectedObj);
        if(i>-1) objects.splice(i,1);
        STATE.selectedObj = null;
    }
}

// Helpers Visuales
function setHover(btn) {
    if (STATE.hoveredBtn === btn) return;
    if (STATE.hoveredBtn) {
        STATE.hoveredBtn.scale.set(1,1,1);
        STATE.hoveredBtn.material.color.copy(STATE.hoveredBtn.userData.baseColor);
    }
    STATE.hoveredBtn = btn;
    if (btn) {
        btn.scale.set(1.1, 1.1, 1);
        btn.material.color.setHex(0x00ff00);
    }
}

function pulseBtn(btn) {
    btn.scale.set(0.9,0.9,1);
    setTimeout(()=>btn.scale.set(1.1,1.1,1),100);
}

function highlight(obj, color) {
    if (!obj.material.emissive) return;
    if (color) obj.material.emissive.setHex(0x333333);
    else obj.material.emissive.setHex(0x000000);
}

</script>
</body>
</html>
