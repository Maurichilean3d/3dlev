<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Studio: Fixed Touch</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.9); z-index: 999;
        }
        button {
            padding: 20px 60px; font-size: 22px; background: #0088ff; border: none;
            border-radius: 12px; font-weight: bold; cursor: pointer; color: white;
            box-shadow: 0 0 20px rgba(0,136,255,0.5);
        }
        .instr { margin-top: 20px; color: #aaa; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div id="overlay">
    <h1>MR STUDIO: PRECISION TOUCH</h1>
    <p>Problema "Todo Amarillo" Solucionado.</p>
    <button id="btn-start">ENTRAR</button>
    <div class="instr">1. Crea esfera<br>2. Activa OBJ/VERT<br>3. Toca UN punto con la bola roja</div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// ==========================================
// 1. MOTOR
// ==========================================
let scene, camera, renderer;
let ctrlRight, gripLeft;
let uiGroup; 
const uiButtons = []; 
const objects = []; 
let gizmo; 

// Selector de Proximidad
let selectorSphere;
const SELECTOR_RADIUS = 0.06; // 6cm de rango de atracción

// Variables reutilizables
const _tempVecA = new THREE.Vector3();
const _tempVecB = new THREE.Vector3();
const _ray = new THREE.Raycaster();
const _mat = new THREE.Matrix4();

// ESTADO
const STATE = {
    hoveredBtn: null,
    selected: null,      
    mainMesh: null,      
    mode: 'OBJECT',      
    grabbedObj: null,    
    menuAttached: false,
    closestVertex: null
};

init();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(3, 10, 3);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    scene.add(new THREE.GridHelper(10, 10, 0x333333, 0x111111));

    camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.6, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // GIZMO
    gizmo = new TransformControls(camera, renderer.domElement);
    gizmo.addEventListener('dragging-changed', (e) => { });
    gizmo.addEventListener('change', () => {
        if (STATE.mode === 'VERTEX' && STATE.selected && STATE.selected.userData.isVertex) {
            updateVertexPosition(STATE.selected);
        }
    });
    scene.add(gizmo);

    setupControllers();
    createWristUI();

    document.getElementById('btn-start').addEventListener('click', () => {
        navigator.xr.requestSession('immersive-ar', { 
            optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] 
        }).then(session => {
            renderer.xr.setSession(session);
            document.getElementById('overlay').style.display = 'none';
            scene.background = null; 
        });
    });

    renderer.setAnimationLoop(render);
}

// ==========================================
// 2. CONTROLADORES
// ==========================================
function setupControllers() {
    const modelFactory = new XRControllerModelFactory();

    const c0 = renderer.xr.getController(0);
    const c1 = renderer.xr.getController(1);

    const onConnected = (e) => {
        if (e.data.handedness === 'right') {
            ctrlRight = e.target;
            
            // ESFERA ROJA (Puntero Táctil)
            // La hacemos pequeña para que se sienta precisa
            const geo = new THREE.SphereGeometry(0.008, 16, 16); 
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.6 });
            selectorSphere = new THREE.Mesh(geo, mat);
            // Posicionada ligeramente delante del mando real
            selectorSphere.position.set(0, -0.01, -0.03); 
            ctrlRight.add(selectorSphere);

            // Rayo tenue solo para UI
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]),
                new THREE.LineBasicMaterial({ color: 0x0088ff, opacity: 0.2, transparent: true })
            );
            ctrlRight.add(line);

            ctrlRight.addEventListener('selectstart', onTriggerStart); 
            ctrlRight.addEventListener('squeezestart', onGripStart);   
            ctrlRight.addEventListener('squeezeend', onGripEnd);       
        }
    };
    c0.addEventListener('connected', onConnected);
    c1.addEventListener('connected', onConnected);
    scene.add(c0);
    scene.add(c1);

    gripLeft = renderer.xr.getControllerGrip(0);
    gripLeft.add(modelFactory.createControllerModel(gripLeft));
    scene.add(gripLeft);
    
    const gripRight = renderer.xr.getControllerGrip(1);
    gripRight.add(modelFactory.createControllerModel(gripRight));
    scene.add(gripRight);
}

// ==========================================
// 3. UI
// ==========================================
function createWristUI() {
    uiGroup = new THREE.Group();
    uiGroup.position.set(0.05, 0.05, -0.05);
    uiGroup.rotation.set(-Math.PI/2, 0, Math.PI/2);

    const bg = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.22), new THREE.MeshBasicMaterial({ color: 0x000000, opacity: 0.8, transparent: true }));
    uiGroup.add(bg);

    createBtn('CUBO', 0x0055ff, -0.04, 0.08, () => spawn('box'));
    createBtn('ESFERA', 0x00aa55, 0.04, 0.08, () => spawn('sphere'));
    createBtn('MOVER', 0xffaa00, -0.04, 0.03, () => setGizmo('translate'));
    createBtn('ROTAR', 0xffaa00, 0.04, 0.03, () => setGizmo('rotate'));
    createBtn('OBJ / VERT', 0xaa00aa, 0.0, -0.02, toggleMode);
    createBtn('BORRAR', 0xff0000, 0, -0.08, deleteSelected);
}

function createBtn(text, color, x, y, cb) {
    const btn = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.04), new THREE.MeshBasicMaterial({ color: color }));
    btn.position.set(x, y, 0.01);
    const cvs = document.createElement('canvas'); cvs.width=128; cvs.height=64;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#' + new THREE.Color(color).getHexString(); ctx.fillRect(0,0,128,64);
    ctx.fillStyle = 'white'; ctx.font = 'bold 24px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(text, 64, 32);
    const tex = new THREE.CanvasTexture(cvs);
    const label = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.04), new THREE.MeshBasicMaterial({map:tex, transparent:true}));
    label.position.z = 0.002;
    btn.add(label);
    btn.userData = { isButton: true, action: cb, baseColor: new THREE.Color(color) };
    uiGroup.add(btn);
    uiButtons.push(btn);
}

// ==========================================
// 4. LÓGICA MAGNÉTICA (CORREGIDA)
// ==========================================

function checkProximitySelection() {
    // Si no estamos en modo vértice o no hay esfera roja, salir
    if (STATE.mode !== 'VERTEX' || !STATE.mainMesh || !selectorSphere) return;

    selectorSphere.getWorldPosition(_tempVecA);
    
    let minDist = SELECTOR_RADIUS;
    let closest = null;

    // 1. Encontrar el más cercano
    for (let child of STATE.mainMesh.children) {
        if (!child.userData.isVertex) continue;

        child.getWorldPosition(_tempVecB);
        const dist = _tempVecA.distanceTo(_tempVecB);

        if (dist < minDist) {
            minDist = dist;
            closest = child;
        }
    }

    // 2. Actualizar Colores
    // Recorremos TODOS los puntos para asegurarnos de que solo el cercano sea amarillo
    for (let child of STATE.mainMesh.children) {
        if (!child.userData.isVertex) continue;

        if (child === closest) {
            // Este es el "elegido"
            child.material.color.setHex(0xffff00); // Amarillo
            // Hacemos que crezca un poco para feedback visual
            child.scale.set(1.5, 1.5, 1.5);
        } else if (child === STATE.selected) {
            // Este es el que ya tenemos seleccionado con el Gizmo
            child.material.color.setHex(0xff0000); // Rojo
            child.scale.set(1, 1, 1);
        } else {
            // Todos los demás
            child.material.color.setHex(0x00ff00); // Verde
            child.scale.set(1, 1, 1);
        }
    }

    STATE.closestVertex = closest;
}

// ==========================================
// 5. INPUTS
// ==========================================

function onTriggerStart() {
    // UI Click
    if (STATE.hoveredBtn) {
        STATE.hoveredBtn.userData.action();
        const b = STATE.hoveredBtn;
        b.scale.set(0.9,0.9,1); setTimeout(()=>b.scale.set(1,1,1),100);
        return;
    }

    // Selección Vértice (Si hay uno cercano amarillo)
    if (STATE.mode === 'VERTEX' && STATE.closestVertex) {
        select(STATE.closestVertex);
        return;
    }

    // Selección Objeto (Raycast normal)
    if (STATE.mode === 'OBJECT') {
        checkRaycastSelection();
    }
}

function onGripStart() {
    // Agarre Objeto
    if (STATE.selected && !STATE.selected.userData.isVertex) {
        STATE.grabbedObj = STATE.selected;
        gizmo.detach();
        ctrlRight.attach(STATE.grabbedObj);
        STATE.grabbedObj.material.emissive.setHex(0x555555);
    }
}

function onGripEnd() {
    if (STATE.grabbedObj) {
        scene.attach(STATE.grabbedObj);
        gizmo.attach(STATE.grabbedObj);
        STATE.grabbedObj.material.emissive.setHex(0x000000);
        STATE.grabbedObj = null;
    }
}

function render() {
    if (!STATE.menuAttached && gripLeft) {
        gripLeft.add(uiGroup);
        STATE.menuAttached = true;
    }

    if (ctrlRight) {
        // UI Raycast
        _mat.identity().extractRotation(ctrlRight.matrixWorld);
        _ray.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
        _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat);

        const uiHits = _ray.intersectObjects(uiButtons, false);
        if (uiHits.length > 0) {
            const btn = uiHits[0].object;
            if (STATE.hoveredBtn !== btn) {
                if(STATE.hoveredBtn) STATE.hoveredBtn.material.color.copy(STATE.hoveredBtn.userData.baseColor);
                STATE.hoveredBtn = btn;
                btn.material.color.setHex(0xffffff);
            }
        } else {
            if (STATE.hoveredBtn) {
                STATE.hoveredBtn.material.color.copy(STATE.hoveredBtn.userData.baseColor);
                STATE.hoveredBtn = null;
            }
        }

        // Lógica Proximidad
        checkProximitySelection();
    }

    renderer.render(scene, camera);
}

// ==========================================
// 6. FUNCIONES CORE
// ==========================================

function spawn(type) {
    const geo = (type==='box') ? new THREE.BoxGeometry(0.2,0.2,0.2) : new THREE.SphereGeometry(0.15,12,8);
    const mat = new THREE.MeshStandardMaterial({ color: Math.random()*0xffffff, roughness: 0.4 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, 1.3, -0.6).applyMatrix4(camera.matrixWorld);
    scene.add(mesh);
    objects.push(mesh);
    if(STATE.mode === 'VERTEX') toggleMode();
    select(mesh);
}

function checkRaycastSelection() {
    // En modo objeto, usamos raycast
    const hits = _ray.intersectObjects(objects, false);
    if (hits.length > 0) select(hits[0].object);
    else select(null);
}

function select(obj) {
    STATE.selected = obj;
    if (!obj) {
        gizmo.detach();
        return;
    }

    gizmo.attach(obj);
    gizmo.setSpace('local');
    
    if (obj.userData.isVertex) {
        // Si es vértice, ya se colorea en el loop de proximidad (rojo)
    } else {
        obj.material.emissive.setHex(0x333333);
    }
}

function toggleMode() {
    const target = (STATE.selected && STATE.selected.userData.isVertex) ? STATE.selected.userData.parentMesh : (STATE.selected || STATE.mainMesh);
    if (!target) return;

    if (STATE.mode === 'OBJECT') {
        STATE.mode = 'VERTEX';
        STATE.mainMesh = target;
        gizmo.detach();
        target.material.wireframe = true;
        createVertexHelpers(target);
        select(null);
    } else {
        STATE.mode = 'OBJECT';
        gizmo.detach();
        if(STATE.mainMesh) {
            STATE.mainMesh.material.wireframe = false;
            clearVertexHelpers(STATE.mainMesh);
            select(STATE.mainMesh);
        }
    }
}

// *** AQUÍ ESTABA EL ERROR ANTERIOR ***
function createVertexHelpers(mesh) {
    const pos = mesh.geometry.attributes.position;
    const geo = new THREE.BoxGeometry(0.015, 0.015, 0.015);
    // Material base
    const baseMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

    for(let i=0; i<pos.count; i++) {
        // IMPORTANTE: mat.clone() para que cada punto tenga su propio material
        const dot = new THREE.Mesh(geo, baseMat.clone());
        
        const v = new THREE.Vector3().fromBufferAttribute(pos, i);
        dot.position.copy(v);
        dot.userData = { isVertex: true, index: i, parentMesh: mesh };
        mesh.add(dot);
    }
}

function clearVertexHelpers(mesh) {
    for(let i = mesh.children.length - 1; i >= 0; i--) {
        if(mesh.children[i].userData.isVertex) {
            const child = mesh.children[i];
            child.geometry.dispose();
            child.material.dispose(); // Limpiar memoria
            mesh.remove(child);
        }
    }
}

function updateVertexPosition(dot) {
    const mesh = dot.userData.parentMesh;
    const idx = dot.userData.index;
    const attr = mesh.geometry.attributes.position;
    attr.setXYZ(idx, dot.position.x, dot.position.y, dot.position.z);
    attr.needsUpdate = true;
}

function setGizmo(mode) { gizmo.setMode(mode); }

function deleteSelected() {
    if (STATE.selected && !STATE.selected.userData.isVertex) {
        scene.remove(STATE.selected);
        gizmo.detach();
        const i = objects.indexOf(STATE.selected);
        if(i>-1) objects.splice(i,1);
        STATE.selected = null;
        STATE.mainMesh = null;
    }
}

</script>
</body>
</html>
