<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>MR Studio: Blender-Quest FINAL</title>
  <style>
    /* ESTILO VISUAL "QUEST" (Dark Glass) */
    :root {
      --main: #ffaa00; 
      --bg: rgba(20, 20, 25, 0.9);
      --border: rgba(255, 170, 0, 0.3);
    }
    body { margin: 0; overflow: hidden; background: #111; color: #fff; font-family: 'Segoe UI', sans-serif; }
    #c { position: fixed; inset: 0; z-index: 0; outline: none; }

    /* PANEL PRINCIPAL (Visible en PC/Móvil) */
    #ui-panel {
      position: fixed; left: 20px; top: 20px; width: 340px; max-height: 90vh;
      background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
      padding: 20px; z-index: 100; backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); overflow-y: auto;
    }
    
    h2 { margin: 0 0 15px 0; color: var(--main); font-size: 16px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    
    /* GRID DE CREACIÓN (Lo que faltaba) */
    .grid-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .grid-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 15px 5px; text-align: center; cursor: pointer; transition: 0.2s;
    }
    .grid-btn:hover { background: rgba(255,170,0,0.2); border-color: var(--main); transform: scale(1.05); }
    .grid-btn div { font-size: 20px; margin-bottom: 5px; }
    .grid-btn span { font-size: 10px; font-weight: bold; display: block; text-transform: uppercase; color: #ccc; }

    /* CONTROLES DE EDICIÓN */
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button.tool-btn {
      flex: 1; padding: 10px; background: #222; border: 1px solid #444; color: #fff;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase;
    }
    button.tool-btn.active { background: var(--main); color: #000; border-color: var(--main); }
    button.tool-btn:active { transform: scale(0.95); }

    /* BOTÓN VR */
    #vr-btn {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      padding: 15px 50px; background: var(--main); color: #000; font-weight: 900;
      border-radius: 50px; border: 3px solid #fff; cursor: pointer; z-index: 200;
      box-shadow: 0 0 30px var(--main); font-size: 16px; display: none;
    }

    /* MENSAJE DE ESTADO */
    #status {
      margin-top: 15px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px;
      font-family: monospace; font-size: 11px; color: var(--main);
    }
  </style>
</head>
<body>

  <canvas id="c"></canvas>
  <button id="vr-btn">INICIAR VR/MR</button>

  <div id="ui-panel">
    <h2>🔷 Menú de Creación</h2>
    
    <div class="grid-menu">
      <div class="grid-btn" onclick="addPrimitive('box')">
        <div>📦</div><span>Cubo</span>
      </div>
      <div class="grid-btn" onclick="addPrimitive('sphere')">
        <div>⚫</div><span>Esfera</span>
      </div>
      <div class="grid-btn" onclick="addPrimitive('cylinder')">
        <div>🛢️</div><span>Cilindro</span>
      </div>
      <div class="grid-btn" onclick="addPrimitive('cone')">
        <div>🔺</div><span>Cono</span>
      </div>
      <div class="grid-btn" onclick="addPrimitive('torus')">
        <div>🍩</div><span>Torus</span>
      </div>
      <div class="grid-btn" onclick="addPrimitive('plane')">
        <div>⬜</div><span>Plano</span>
      </div>
    </div>

    <h2>🛠️ Edición</h2>
    <div class="row">
      <button class="tool-btn active" id="mode-object" onclick="setEditMode('object')">Modo Objeto</button>
      <button class="tool-btn" id="mode-vertex" onclick="setEditMode('vertex')">Modo Vértice</button>
    </div>
    
    <div class="row">
      <button class="tool-btn active" id="giz-translate" onclick="setGizmoMode('translate')">Mover</button>
      <button class="tool-btn" id="giz-rotate" onclick="setGizmoMode('rotate')">Rotar</button>
      <button class="tool-btn" id="giz-scale" onclick="setGizmoMode('scale')">Escalar</button>
    </div>

    <div class="row" style="margin-top:15px;">
      <button class="tool-btn" style="background:#442222; border-color:#ff4444;" onclick="deleteSelected()">🗑️ Eliminar</button>
      <button class="tool-btn" onclick="resetView()">👁️ Reset Cam</button>
    </div>

    <div id="status">Listo. Crea un objeto para empezar.</div>
  </div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ==========================================
// 1. CONFIGURACIÓN E INICIO
// ==========================================
let scene, camera, renderer, orbit, transformCtrl;
let controller1, controller2, controllerGrip1, controllerGrip2;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let tempMatrix = new THREE.Matrix4();

// Listas
const objects = []; // Objetos creados
let activeObject = null; // El objeto seleccionado actualmente
let vertexHelpers = new THREE.Group(); // Puntos verdes para editar vértices

// Estado
let editMode = 'object'; // 'object' o 'vertex'

init();
animate();

function init() {
  // Escena
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222222);
  scene.add(vertexHelpers); // Grupo para visualizar vértices

  // Luces
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(5, 10, 5);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // Grid (Suelo de referencia)
  const grid = new THREE.GridHelper(10, 10, 0x555555, 0x333333);
  scene.add(grid);

  // Cámara
  camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 50);
  camera.position.set(0, 1.6, 2);

  // Renderer
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.shadowMap.enabled = true;

  // Controles Desktop
  orbit = new OrbitControls(camera, renderer.domElement);
  orbit.target.set(0, 1, 0);
  orbit.update();

  // Herramienta de Transformación (Gizmo)
  transformCtrl = new TransformControls(camera, renderer.domElement);
  transformCtrl.addEventListener('dragging-changed', (e) => {
    orbit.enabled = !e.value; // Desactivar órbita al arrastrar flechas
  });
  transformCtrl.addEventListener('change', () => {
    // Si estamos editando un vértice, hay que actualizar la geometría
    if (editMode === 'vertex' && activeObject && transformCtrl.object.userData.isVertex) {
      updateGeometryFromVertex(transformCtrl.object);
    }
  });
  scene.add(transformCtrl);

  // Eventos de ratón (Desktop)
  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('pointerdown', onPointerDown);

  setupXR();
  
  // Crear un objeto inicial para que no esté vacío
  addPrimitive('box');
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ==========================================
// 2. CREACIÓN DE OBJETOS (El "Menú")
// ==========================================
window.addPrimitive = (type) => {
  let geo;
  switch(type) {
    case 'box': geo = new THREE.BoxGeometry(0.4, 0.4, 0.4); break;
    case 'sphere': geo = new THREE.SphereGeometry(0.25, 32, 16); break;
    case 'cylinder': geo = new THREE.CylinderGeometry(0.2, 0.2, 0.4, 32); break;
    case 'cone': geo = new THREE.ConeGeometry(0.2, 0.4, 32); break;
    case 'torus': geo = new THREE.TorusGeometry(0.2, 0.08, 16, 32); break;
    case 'plane': geo = new THREE.PlaneGeometry(0.5, 0.5); break;
  }

  const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.3, metalness: 0.1 });
  const mesh = new THREE.Mesh(geo, mat);
  
  // Posición inicial: Frente a la cámara (más o menos)
  mesh.position.set(0, 1.2, -1); 
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.isEditable = true;

  scene.add(mesh);
  objects.push(mesh);
  
  selectObject(mesh); // Seleccionar automáticamente al crear
  updateStatus(`Creado: ${type}`);
};

window.deleteSelected = () => {
  if (!activeObject) return;
  transformCtrl.detach();
  scene.remove(activeObject);
  vertexHelpers.clear();
  
  const idx = objects.indexOf(activeObject);
  if (idx > -1) objects.splice(idx, 1);
  
  activeObject = null;
  updateStatus("Objeto eliminado");
};

// ==========================================
// 3. SELECCIÓN Y EDICIÓN
// ==========================================
function selectObject(mesh) {
  if (editMode === 'vertex' && mesh.userData.isVertex) {
    // Seleccionando un punto verde (vértice)
    transformCtrl.attach(mesh);
    updateStatus(`Vértice ${mesh.userData.index} seleccionado`);
    return;
  }
  
  if (mesh === activeObject && editMode === 'object') return; // Ya seleccionado

  activeObject = mesh;
  vertexHelpers.clear(); // Limpiar puntos antiguos

  if (editMode === 'object') {
    transformCtrl.attach(mesh);
    updateStatus("Objeto seleccionado");
  } else {
    // Modo Vértice: Crear puntos visuales
    transformCtrl.detach();
    createVertexHelpers(mesh);
    updateStatus("Modo Vértice: Selecciona un punto verde");
  }
}

// Crear esferas visuales en cada vértice
function createVertexHelpers(mesh) {
  const pos = mesh.geometry.attributes.position;
  const worldMatrix = mesh.matrixWorld;

  for (let i = 0; i < pos.count; i++) {
    const vLocal = new THREE.Vector3().fromBufferAttribute(pos, i);
    const vWorld = vLocal.clone().applyMatrix4(worldMatrix);

    const helper = new THREE.Mesh(
      new THREE.SphereGeometry(0.015, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0x00ff00, depthTest: false, transparent:true })
    );
    helper.position.copy(vWorld);
    helper.userData = { isVertex: true, index: i, parentMesh: mesh };
    helper.renderOrder = 999;
    vertexHelpers.add(helper);
  }
}

// Mover el vértice real cuando movemos la esfera helper
function updateGeometryFromVertex(helper) {
  const mesh = helper.userData.parentMesh;
  const idx = helper.userData.index;
  const posAttr = mesh.geometry.attributes.position;
  
  // Convertir posición World del helper a Local del mesh
  const localPos = helper.position.clone();
  mesh.worldToLocal(localPos);
  
  posAttr.setXYZ(idx, localPos.x, localPos.y, localPos.z);
  posAttr.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
}

// ==========================================
// 4. INTERACCIÓN (Desktop & VR)
// ==========================================
function onPointerDown(event) {
  // Calcular coordenadas mouse
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  
  // 1. Mirar si tocamos un vértice (si estamos en modo vértice)
  if (editMode === 'vertex') {
    const hits = raycaster.intersectObjects(vertexHelpers.children);
    if (hits.length > 0) {
      selectObject(hits[0].object);
      return;
    }
  }

  // 2. Mirar si tocamos un objeto
  const hits = raycaster.intersectObjects(objects);
  if (hits.length > 0) {
    selectObject(hits[0].object);
  } else {
    // Clic en el vacío: Deseleccionar
    transformCtrl.detach();
    activeObject = null;
    vertexHelpers.clear();
    updateStatus("Nada seleccionado");
  }
}

// ==========================================
// 5. SISTEMA VR (Controles y Menú de Muñeca)
// ==========================================
let vrMenuGroup;

function setupXR() {
  if ('xr' in navigator) {
    navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
      const btn = document.getElementById('vr-btn');
      btn.style.display = 'block';
      btn.textContent = supported ? 'ENTRAR EN MR (AR)' : 'ENTRAR EN VR';
      btn.onclick = () => {
        const mode = supported ? 'immersive-ar' : 'immersive-vr';
        const init = { requiredFeatures: ['local-floor'], optionalFeatures: ['hand-tracking'] };
        navigator.xr.requestSession(mode, init).then(onSessionStarted);
      };
    });
  }

  // Controladores
  const modelFactory = new XRControllerModelFactory();

  controller1 = renderer.xr.getController(0); // Izq o Der según sistema
  controller1.addEventListener('selectstart', onVRSelect);
  scene.add(controller1);

  controller2 = renderer.xr.getController(1);
  controller2.addEventListener('selectstart', onVRSelect);
  scene.add(controller2);

  // Líneas visuales (Rayos)
  const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]);
  const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xffaa00 }));
  controller1.add(line.clone());
  controller2.add(line.clone());

  // Modelos de controles
  controllerGrip1 = renderer.xr.getControllerGrip(0);
  controllerGrip1.add(modelFactory.createControllerModel(controllerGrip1));
  scene.add(controllerGrip1);
  
  // Agregar Menú a la mano izquierda (Controller Grip 1)
  createVRWristMenu();
  controllerGrip1.add(vrMenuGroup); // Anclado a la mano
}

function onSessionStarted(session) {
  renderer.xr.setSession(session);
  document.getElementById('ui-panel').style.display = 'none'; // Ocultar HTML en VR
  document.getElementById('vr-btn').style.display = 'none';
  scene.background = null; // Passthrough en AR
}

// Menú 3D Flotante (Para VR, ya que no vemos el HTML)
function createVRWristMenu() {
  vrMenuGroup = new THREE.Group();
  vrMenuGroup.position.set(0.1, 0.05, 0); // Offset sobre la muñeca
  vrMenuGroup.rotation.x = -Math.PI / 2;  // Mirando hacia arriba

  // Fondo
  const bg = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.15), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.8 }));
  vrMenuGroup.add(bg);

  // Botones simples (Cubo, Esfera, Mover)
  const createBtn = (color, x, y, action) => {
    const btn = new THREE.Mesh(new THREE.PlaneGeometry(0.04, 0.04), new THREE.MeshBasicMaterial({ color: color }));
    btn.position.set(x, y, 0.01);
    btn.userData = { isVRButton: true, action: action };
    vrMenuGroup.add(btn);
  };

  // Fila 1: Primitivas
  createBtn(0xff0000, -0.05, 0.03, () => window.addPrimitive('box')); // Rojo: Cubo
  createBtn(0x00ff00, 0, 0.03, () => window.addPrimitive('sphere')); // Verde: Esfera
  createBtn(0x0000ff, 0.05, 0.03, () => window.addPrimitive('cylinder')); // Azul: Cilindro

  // Fila 2: Herramientas
  createBtn(0xffaa00, -0.05, -0.03, () => window.setGizmoMode('translate')); // Naranja: Mover
  createBtn(0xaaaaaa, 0.05, -0.03, () => window.setGizmoMode('rotate')); // Gris: Rotar
}

function onVRSelect(event) {
  const controller = event.target;
  
  // Raycast en VR
  tempMatrix.identity().extractRotation(controller.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

  // 1. Chequear Menú VR (si estamos apuntando a la mano)
  const menuHits = raycaster.intersectObjects(vrMenuGroup.children);
  if (menuHits.length > 0) {
    const btn = menuHits[0].object;
    if (btn.userData.isVRButton) {
      btn.userData.action();
      btn.scale.set(0.9, 0.9, 0.9); setTimeout(()=>btn.scale.set(1,1,1), 100);
      return;
    }
  }

  // 2. Chequear Escena
  const hits = raycaster.intersectObjects(objects);
  if (hits.length > 0) {
    selectObject(hits[0].object);
  }
}

// ==========================================
// 6. UTILIDADES UI
// ==========================================
window.setEditMode = (mode) => {
  editMode = mode;
  document.getElementById('mode-object').classList.toggle('active', mode === 'object');
  document.getElementById('mode-vertex').classList.toggle('active', mode === 'vertex');
  
  if (activeObject) {
    // Refrescar selección para mostrar/ocultar puntos
    const obj = activeObject;
    activeObject = null; // Forzar re-selección
    selectObject(obj);
  }
  updateStatus(`Modo cambiado a: ${mode}`);
};

window.setGizmoMode = (mode) => {
  transformCtrl.setMode(mode);
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); // Hack rápido visual
  document.getElementById(`giz-${mode}`).classList.add('active');
};

window.resetView = () => {
  camera.position.set(0, 1.6, 2);
  orbit.target.set(0, 1, 0);
  orbit.update();
};

function updateStatus(msg) {
  const el = document.getElementById('status');
  if(el) el.textContent = msg;
}

function animate() {
  renderer.render(scene, camera);
}
</script>
</body>
</html>
