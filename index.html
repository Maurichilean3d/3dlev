
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Studio: Optimized & Rotated</title>
    <style>
        body { margin: 0; background: #050505; overflow: hidden; font-family: sans-serif; color: #fff; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.9); z-index: 999;
        }
        button {
            padding: 15px 40px; font-size: 20px; background: #ffaa00; border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
        .info { font-size: 14px; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>

<div id="overlay">
    <h1>MR STUDIO: OPTIMIZED</h1>
    <p>1. Menú ROTADO en mano IZQUIERDA</p>
    <p>2. Gestión de RAM mejorada</p>
    <button id="btn-start">INICIAR (AR/VR)</button>
    <div class="info">Versión v4.5 - Stable Core</div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ==========================================
// 1. VARIABLES GLOBALES (Optimizadas)
// ==========================================
let scene, camera, renderer;
let controllerRight, gripLeft, gripRight;
let uiGroup; 
const uiButtons = []; 
const objects = []; 

// VARIABLES REUTILIZABLES (Evita basura en RAM)
const _tempMatrix = new THREE.Matrix4();
const _raycaster = new THREE.Raycaster();
const _tempVec = new THREE.Vector3();
const _tempQuat = new THREE.Quaternion();
const _forward = new THREE.Vector3(0, 0, -1);

let cursorVisual; 

// Estado
const STATE = {
    hoveredBtn: null,
    selectedObj: null,
    isDragging: false,
    dragOffset: new THREE.Vector3(),
    menuAttached: false // Para controlar si ya pegamos el menú a la mano
};

init();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    // Luces
    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(2, 4, 1);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    scene.add(new THREE.GridHelper(10, 10, 0x333333, 0x111111));

    camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 20);
    camera.position.set(0, 1.6, 0);

    // Renderer Optimizado
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Limitar pixel ratio para rendimiento en Quest
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    setupControllers();
    createWristUI(); // Creamos la UI pero no la añadimos a la escena global aun

    // Cursor Visual (Punto de mira)
    cursorVisual = new THREE.Mesh(
        new THREE.SphereGeometry(0.005, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffff00 })
    );
    scene.add(cursorVisual);

    document.getElementById('btn-start').addEventListener('click', () => {
        const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
        navigator.xr.requestSession('immersive-ar', sessionInit).then(session => {
            renderer.xr.setSession(session);
            document.getElementById('overlay').style.display = 'none';
            scene.background = null;
        });
    });

    renderer.setAnimationLoop(render);
}

function setupControllers() {
    const modelFactory = new XRControllerModelFactory();

    // --- MANO DERECHA (Puntero) ---
    // Usamos events 'connected' para garantizar que es la derecha
    const c0 = renderer.xr.getController(0);
    const c1 = renderer.xr.getController(1);

    const onConnected = (e) => {
        const source = e.data;
        const ctrl = e.target;
        
        if (source.handedness === 'right') {
            controllerRight = ctrl;
            // Rayo láser visual
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]),
                new THREE.LineBasicMaterial({ color: 0x0088ff, opacity: 0.6, transparent: true })
            );
            ctrl.add(line);
            ctrl.addEventListener('selectstart', onTriggerStart);
            ctrl.addEventListener('selectend', onTriggerEnd);
        }
    };

    c0.addEventListener('connected', onConnected);
    c1.addEventListener('connected', onConnected);
    scene.add(c0);
    scene.add(c1);

    // --- GRIPS (Modelos físicos para anclar UI) ---
    gripLeft = renderer.xr.getControllerGrip(0); 
    gripLeft.add(modelFactory.createControllerModel(gripLeft));
    scene.add(gripLeft); // Se añade a la escena temporalmente

    gripRight = renderer.xr.getControllerGrip(1);
    gripRight.add(modelFactory.createControllerModel(gripRight));
    scene.add(gripRight);
}

// ============================================================================
// UI OPTIMIZADA (Geometry Reusing)
// ============================================================================
function createWristUI() {
    uiGroup = new THREE.Group();
    
    // Configuración Ergonómica solicitada
    // Posición relativa a la muñeca (Local Space)
    uiGroup.position.set(0.02, 0.05, -0.08); // Ligeramente elevado y hacia el brazo
    
    // ROTACIÓN CORREGIDA: 90 grados contra reloj
    // X -90: Mira hacia arriba
    // Z +90: Gira 90 grados CCW
    uiGroup.rotation.set(-Math.PI / 2, 0, Math.PI / 2);

    // Panel Base
    const bg = new THREE.Mesh(
        new THREE.PlaneGeometry(0.14, 0.18), // Más alto que ancho ahora por la rotación
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent:true, opacity: 0.85 })
    );
    // Borde
    const border = new THREE.LineSegments(
        new THREE.EdgesGeometry(bg.geometry),
        new THREE.LineBasicMaterial({ color: 0xffaa00 })
    );
    bg.add(border);
    uiGroup.add(bg);

    // Botones (Reutilizamos lógica)
    const btnW = 0.05; 
    const btnH = 0.035; 
    
    // Layout ajustado para vertical (ya que rotamos 90 grados)
    // Fila 1
    createButton("CUBO", "#0055ff", -0.03, 0.06, () => spawn('box'));
    createButton("ESFERA", "#00aa55", 0.03, 0.06, () => spawn('sphere'));
    
    // Fila 2
    createButton("CILIND", "#aa5500", -0.03, 0.01, () => spawn('cylinder'));
    createButton("COLOR", "#aa00aa", 0.03, 0.01, randomColor);
    
    // Fila 3
    createButton("BORRAR", "#aa0000", -0.03, -0.04, deleteSelected);
    createButton("RESET", "#555555", 0.03, -0.04, resetScene);
}

function createButton(text, color, x, y, callback) {
    const btn = new THREE.Mesh(
        new THREE.PlaneGeometry(0.05, 0.035),
        new THREE.MeshBasicMaterial({ color: color })
    );
    btn.position.set(x, y, 0.005);

    // Texto con Canvas (Generado una vez)
    const cvs = document.createElement('canvas'); cvs.width=128; cvs.height=64;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = color; ctx.fillRect(0,0,128,64);
    ctx.fillStyle = 'white'; ctx.font = 'bold 30px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(text, 64, 32);
    
    const tex = new THREE.CanvasTexture(cvs);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    
    const label = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.025), new THREE.MeshBasicMaterial({map:tex, transparent:true}));
    label.position.z = 0.001;
    btn.add(label);

    btn.userData = { isButton: true, action: callback, baseColor: new THREE.Color(color) };
    uiGroup.add(btn);
    uiButtons.push(btn);
}

// ============================================================================
// LÓGICA DE BUCLE (Render Loop Optimizado)
// ============================================================================

function onTriggerStart() {
    if (STATE.hoveredBtn) {
        // Ejecutar acción de botón
        STATE.hoveredBtn.userData.action();
        pulseButton(STATE.hoveredBtn);
    } else {
        // Seleccionar objeto
        checkSceneIntersection(true);
    }
}

function onTriggerEnd() {
    STATE.isDragging = false;
}

function render() {
    // 1. ANCLAJE DE UI (Solo una vez cuando detectamos la mano izquierda)
    if (!STATE.menuAttached && renderer.xr.isPresenting) {
        const session = renderer.xr.getSession();
        if (session) {
            for (const source of session.inputSources) {
                if (source.handedness === 'left') {
                    // Encontrar qué grip corresponde a la izquierda
                    // (Threejs asigna grips dinámicamente, probamos ambos)
                    // Este es un truco seguro: mirar cual está en el lado izquierdo del mundo
                    if (gripLeft.position.x < 0 || gripRight.position.x > 0) {
                       // Asignación simple por ahora basada en setup inicial
                       // Lo mejor es añadirlo al gripLeft directamente
                       gripLeft.add(uiGroup); // Parenting nativo de Three.js (0 coste CPU)
                       STATE.menuAttached = true;
                    }
                }
            }
        }
    }

    // 2. RAYCASTING (Reutilizando variables globales)
    if (controllerRight) {
        _tempMatrix.identity().extractRotation(controllerRight.matrixWorld);
        _raycaster.ray.origin.setFromMatrixPosition(controllerRight.matrixWorld);
        _raycaster.ray.direction.set(0, 0, -1).applyMatrix4(_tempMatrix);

        // A. UI Hit Test
        const uiHits = _raycaster.intersectObjects(uiButtons);
        if (uiHits.length > 0) {
            const hit = uiHits[0];
            updateHover(hit.object);
            
            // Mover cursor visual al botón
            cursorVisual.position.copy(hit.point);
            cursorVisual.material.color.setHex(0x00ff00); // Verde = Clickable
            cursorVisual.scale.set(1.5, 1.5, 1.5);
        } else {
            updateHover(null);
            
            // B. Scene Hit Test
            const sceneHits = _raycaster.intersectObjects(objects);
            if (sceneHits.length > 0) {
                const hit = sceneHits[0];
                cursorVisual.position.copy(hit.point);
                cursorVisual.material.color.setHex(0xffff00); // Amarillo = Objeto
                cursorVisual.scale.set(1, 1, 1);

                if (STATE.isDragging && STATE.selectedObj) {
                    // Lógica de arrastre simple
                    // Movemos el objeto a donde apunta el rayo (con offset)
                    _tempVec.copy(_raycaster.ray.origin).addScaledVector(_raycaster.ray.direction, hit.distance);
                    STATE.selectedObj.position.copy(_tempVec.sub(STATE.dragOffset));
                }

            } else {
                // Rayo al infinito
                _tempVec.copy(_raycaster.ray.origin).addScaledVector(_raycaster.ray.direction, 2);
                cursorVisual.position.copy(_tempVec);
                cursorVisual.material.color.setHex(0xff0000); // Rojo = Nada
                cursorVisual.scale.set(0.5, 0.5, 0.5);
            }
        }
    }

    renderer.render(scene, camera);
}

// Helpers Lógicos
function updateHover(btn) {
    if (STATE.hoveredBtn === btn) return;

    // Salir del anterior
    if (STATE.hoveredBtn) {
        STATE.hoveredBtn.scale.set(1, 1, 1);
        STATE.hoveredBtn.material.color.copy(STATE.hoveredBtn.userData.baseColor);
    }

    // Entrar al nuevo
    STATE.hoveredBtn = btn;
    if (btn) {
        btn.scale.set(1.1, 1.1, 1); // Pop effect
        btn.material.color.setHex(0x00ff00); // Highlight verde
    }
}

function pulseButton(btn) {
    btn.scale.set(0.9, 0.9, 1);
    setTimeout(() => { if(btn === STATE.hoveredBtn) btn.scale.set(1.1, 1.1, 1); else btn.scale.set(1,1,1); }, 100);
}

// --- Funciones App ---
function spawn(type) {
    let geo;
    if (type === 'box') geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
    else if (type === 'sphere') geo = new THREE.SphereGeometry(0.1, 16, 12);
    else geo = new THREE.CylinderGeometry(0.08, 0.08, 0.15, 16);

    const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
    const mesh = new THREE.Mesh(geo, mat);
    
    // Aparecer a 0.5m frente a la cámara (sin crear new vector)
    _tempVec.set(0, 0, -0.5).applyMatrix4(camera.matrixWorld);
    mesh.position.copy(_tempVec);
    
    worldGroup.add(mesh);
    objects.push(mesh); // Añadir a lista de interactuables
    select(mesh);
}

function checkSceneIntersection(isTrigger) {
    const hits = _raycaster.intersectObjects(objects);
    if (hits.length > 0) {
        const obj = hits[0].object;
        select(obj);
        if (isTrigger) {
            STATE.isDragging = true;
            // Guardar offset
            STATE.dragOffset.copy(hits[0].point).sub(obj.position);
        }
    } else if (isTrigger) {
        select(null);
    }
}

function select(mesh) {
    // Restaurar anterior
    if (STATE.selectedObj && STATE.selectedObj !== mesh) {
        STATE.selectedObj.material.wireframe = false;
    }
    STATE.selectedObj = mesh;
    if (mesh) mesh.material.wireframe = true;
}

// Grupos
const worldGroup = new THREE.Group();
scene.add(worldGroup);

function deleteSelected() {
    if (STATE.selectedObj) {
        worldGroup.remove(STATE.selectedObj);
        const idx = objects.indexOf(STATE.selectedObj);
        if (idx > -1) objects.splice(idx, 1);
        STATE.selectedObj = null;
    }
}

function randomColor() {
    if (STATE.selectedObj) STATE.selectedObj.material.color.setHex(Math.random()*0xffffff);
}

function resetScene() {
    while(objects.length > 0) {
        const o = objects.pop();
        worldGroup.remove(o);
        if(o.geometry) o.geometry.dispose(); // Limpiar RAM geometría
    }
    STATE.selectedObj = null;
}

</script>
</body>
</html>
