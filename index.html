<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Studio: Functional Core</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; font-family: sans-serif; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.9); z-index: 999; color: #fff;
        }
        button {
            padding: 15px 40px; font-size: 20px; background: #ffaa00; border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="overlay">
    <h1>MR STUDIO: CORE</h1>
    <p>1. Menu en mano IZQUIERDA (muñeca)</p>
    <p>2. Rayo en mano DERECHA</p>
    <button id="btn-start">INICIAR SISTEMA</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

let scene, camera, renderer;
let ctrlLeft, ctrlRight; // Referencias lógicas
let gripLeft, gripRight; // Modelos físicos
let raycaster;
let uiGroup; // El menú
const uiButtons = []; // Array para colisiones

// Cursor visual para depurar puntería
let cursorVisual; 

// Estado
const STATE = {
    hoveredBtn: null,
    selectedObj: null,
    isDragging: false,
    dragOffset: new THREE.Vector3()
};

const objects = []; // Objetos creados

init();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    // Luces
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(2, 5, 2);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    scene.add(new THREE.GridHelper(10, 10, 0x444444, 0x222222));

    camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 20);
    camera.position.set(0, 1.6, 2);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Setup XR
    setupControllers();
    createWristUI();

    // Cursor Visual (La bolita en la punta del rayo)
    const cursorGeo = new THREE.SphereGeometry(0.008, 16, 16);
    const cursorMat = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // Amarillo default
    cursorVisual = new THREE.Mesh(cursorGeo, cursorMat);
    scene.add(cursorVisual);

    document.getElementById('btn-start').addEventListener('click', () => {
        const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
        navigator.xr.requestSession('immersive-ar', sessionInit).then(session => {
            renderer.xr.setSession(session);
            document.getElementById('overlay').style.display = 'none';
            scene.background = null;
        });
    });

    renderer.setAnimationLoop(render);
}

function setupControllers() {
    const modelFactory = new XRControllerModelFactory();

    // Crear 2 controladores genéricos primero
    const c0 = renderer.xr.getController(0);
    const c1 = renderer.xr.getController(1);
    
    // Escuchar conexión para asignar Izquierda/Derecha correctamente
    const onConnected = (event) => {
        const ctrl = event.target;
        const source = event.data; // XRInputSource

        ctrl.userData.handedness = source.handedness; // 'left' o 'right'

        if (source.handedness === 'left') {
            ctrlLeft = ctrl;
            // Anclar menú a la izquierda
            const grip = renderer.xr.getControllerGrip(0) === ctrl ? renderer.xr.getControllerGrip(0) : renderer.xr.getControllerGrip(1); 
            // (Simplificación: usamos el grip correspondiente al índice del evento)
            // Mejor: buscar el grip que coincida.
        } 
        else if (source.handedness === 'right') {
            ctrlRight = ctrl;
            // Rayo solo en derecha
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]),
                new THREE.LineBasicMaterial({ color: 0xffaa00 })
            );
            ctrl.add(line);
            ctrl.addEventListener('selectstart', onTrigger);
            ctrl.addEventListener('selectend', onTriggerEnd);
        }
    };

    c0.addEventListener('connected', onConnected);
    c1.addEventListener('connected', onConnected);

    scene.add(c0);
    scene.add(c1);

    // Grips (Modelos visuales de manos/controles)
    gripLeft = renderer.xr.getControllerGrip(0); // Asumimos orden inicial, se corregirá si es necesario
    gripLeft.add(modelFactory.createControllerModel(gripLeft));
    scene.add(gripLeft);

    gripRight = renderer.xr.getControllerGrip(1);
    gripRight.add(modelFactory.createControllerModel(gripRight));
    scene.add(gripRight);

    // *** TRUCO CRÍTICO ***
    // Como getControllerGrip(0) no garantiza ser izquierda, añadiremos el menú a 
    // un contenedor que buscaremos actualizar en el render loop a la posición de la mano izquierda real.
    uiGroup = new THREE.Group();
    scene.add(uiGroup); // Lo añadimos a la escena, no al grip directamente, para tener control total.

    raycaster = new THREE.Raycaster();
}

// ============================================================================
// UI NATIVA (CANVAS)
// ============================================================================
function createWristUI() {
    const w = 0.18; // 18cm ancho
    const h = 0.12; // 12cm alto

    // Fondo panel
    const bg = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: 0x111111, transparent:true, opacity: 0.9 })
    );
    // Borde neón
    const border = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)),
        new THREE.LineBasicMaterial({ color: 0x00ff00 })
    );
    bg.add(border);
    uiGroup.add(bg);

    // Botones
    const btnW = 0.05;
    const btnH = 0.04;
    const gap = 0.01;

    createButton('CUBO', '#0055ff', -0.06, 0.03, () => spawn('box'));
    createButton('ESFERA', '#00aa55', 0, 0.03, () => spawn('sphere'));
    createButton('CILIND', '#aa5500', 0.06, 0.03, () => spawn('cylinder'));

    createButton('BORRAR', '#ff0000', -0.06, -0.03, deleteSelected);
    createButton('COLOR', '#aa00aa', 0, -0.03, randomColor);
    createButton('RESET', '#555555', 0.06, -0.03, resetScene);
}

function createButton(text, color, x, y, callback) {
    // Geometría física del botón
    const geo = new THREE.BoxGeometry(0.05, 0.04, 0.01);
    const mat = new THREE.MeshBasicMaterial({ color: color });
    const btn = new THREE.Mesh(geo, mat);
    btn.position.set(x, y, 0.01); // Sobresale del panel
    
    // Texto
    const cvs = document.createElement('canvas'); cvs.width=128; cvs.height=64;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = color; ctx.fillRect(0,0,128,64); // Fondo color para evitar bordes feos
    ctx.fillStyle = 'white'; ctx.font = 'bold 30px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(text, 64, 32);
    
    const tex = new THREE.CanvasTexture(cvs);
    const label = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.025), new THREE.MeshBasicMaterial({map:tex, transparent:true}));
    label.position.z = 0.006; // Encima del botón
    btn.add(label);

    // Datos para lógica
    btn.userData = { isButton: true, action: callback, baseColor: new THREE.Color(color) };
    uiGroup.add(btn);
    uiButtons.push(btn);
}

// ============================================================================
// LÓGICA DE INTERACCIÓN
// ============================================================================

function onTrigger(e) {
    // 1. Si hay botón en hover (verde)
    if (STATE.hoveredBtn) {
        STATE.hoveredBtn.userData.action();
        // Feedback click
        STATE.hoveredBtn.scale.set(0.9,0.9,0.5);
        setTimeout(()=>STATE.hoveredBtn.scale.set(1,1,1), 100);
        return;
    }

    // 2. Si no, interactuar con escena
    checkSceneIntersects(true);
}

function onTriggerEnd() {
    STATE.isDragging = false;
}

function render() {
    // 1. Actualizar posición del Menú (Watch UI)
    // Buscamos cuál grip es el izquierdo dinámicamente
    updateMenuPose();

    // 2. Raycast constante si hay control derecho
    if (ctrlRight) {
        const tempMat = new THREE.Matrix4();
        tempMat.identity().extractRotation(ctrlRight.matrixWorld);
        
        raycaster.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMat);

        // A. Chequear Botones UI
        const uiHits = raycaster.intersectObjects(uiButtons);
        
        if (uiHits.length > 0) {
            // HIT EN BOTÓN
            const hit = uiHits[0];
            const btn = hit.object;
            
            // Mover cursor visual al punto de impacto
            cursorVisual.position.copy(hit.point);
            cursorVisual.visible = true;
            cursorVisual.material.color.setHex(0x00ff00); // VERDE = "PUEDES PULSAR"

            if (STATE.hoveredBtn !== btn) {
                // Entrar hover
                if (STATE.hoveredBtn) STATE.hoveredBtn.material.color.copy(STATE.hoveredBtn.userData.baseColor);
                STATE.hoveredBtn = btn;
                btn.material.color.setHex(0x00ff00); // Botón se pone verde
                btn.scale.set(1.1, 1.1, 1);
            }
        } else {
            // NO HIT EN BOTÓN
            if (STATE.hoveredBtn) {
                STATE.hoveredBtn.material.color.copy(STATE.hoveredBtn.userData.baseColor);
                STATE.hoveredBtn.scale.set(1,1,1);
                STATE.hoveredBtn = null;
            }

            // B. Chequear Escena (para el cursor visual)
            const sceneHits = raycaster.intersectObjects(objects);
            if (sceneHits.length > 0) {
                cursorVisual.position.copy(sceneHits[0].point);
                cursorVisual.visible = true;
                cursorVisual.material.color.setHex(0xffff00); // Amarillo = objeto
            } else {
                // Rayo al infinito visual (punto a 2 metros)
                cursorVisual.position.copy(raycaster.ray.origin).add(raycaster.ray.direction.multiplyScalar(2));
                cursorVisual.visible = true;
                cursorVisual.material.color.setHex(0xff0000); // Rojo = nada
            }
        }

        // C. Lógica de Arrastre
        if (STATE.isDragging && STATE.selectedObj) {
            const pos = raycaster.ray.origin.clone().add(raycaster.ray.direction.multiplyScalar(STATE.dragDist));
            STATE.selectedObj.position.copy(pos.sub(STATE.dragOffset));
        }
    }

    renderer.render(scene, camera);
}

function updateMenuPose() {
    // Buscar la fuente de entrada izquierda
    const session = renderer.xr.getSession();
    if (!session) return;

    let leftSource = null;
    for (const source of session.inputSources) {
        if (source.handedness === 'left') {
            leftSource = source;
            break;
        }
    }

    if (leftSource && gripLeft) { // Usamos gripLeft como referencia genérica si coincide
        // En Threejs WebXR los grips se actualizan solos. 
        // Si detectamos que ctrlLeft está activo, copiamos su transform.
        
        // Truco: Copiar posición del grip izquierdo detectado
        if (ctrlLeft) {
            uiGroup.position.copy(ctrlLeft.position);
            uiGroup.quaternion.copy(ctrlLeft.quaternion);

            // Offset ergonómico (Muñeca interna)
            // X: 0.1 (hacia derecha local = hacia el brazo interior)
            // Y: 0.05 (arriba)
            // Z: 0.05 (atras)
            uiGroup.translateX(0.12); 
            uiGroup.translateY(0.04);
            uiGroup.translateZ(0.05);
            
            // Rotar para mirar a la cara (-90 X, +45 Y)
            uiGroup.rotateX(-Math.PI / 2);
            uiGroup.rotateY(Math.PI / 4);
        }
    }
}

// --- Funciones App ---

function spawn(type) {
    let geo;
    if (type === 'box') geo = new THREE.BoxGeometry(0.15,0.15,0.15);
    else if (type === 'sphere') geo = new THREE.SphereGeometry(0.1,16,12);
    else geo = new THREE.CylinderGeometry(0.08,0.08,0.15,16);

    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: Math.random()*0xffffff }));
    // Aparecer frente al usuario
    const spawnPos = new THREE.Vector3(0, 0, -0.8).applyMatrix4(camera.matrixWorld);
    mesh.position.copy(spawnPos);
    
    scene.add(mesh);
    objects.push(mesh);
    STATE.selectedObj = mesh;
}

function checkSceneIntersects(isClick) {
    const hits = raycaster.intersectObjects(objects);
    if (hits.length > 0) {
        STATE.selectedObj = hits[0].object;
        
        // Highlight
        objects.forEach(o => o.material.emissive.setHex(0x000000));
        STATE.selectedObj.material.emissive.setHex(0x333333);

        if (isClick) {
            STATE.isDragging = true;
            STATE.dragDist = hits[0].distance;
            // Offset para no saltar al centro
            STATE.dragOffset = hits[0].point.clone().sub(STATE.selectedObj.position);
        }
    } else if (isClick) {
        STATE.selectedObj = null;
        objects.forEach(o => o.material.emissive.setHex(0x000000));
    }
}

function deleteSelected() {
    if (STATE.selectedObj) {
        scene.remove(STATE.selectedObj);
        const idx = objects.indexOf(STATE.selectedObj);
        if (idx > -1) objects.splice(idx, 1);
        STATE.selectedObj = null;
    }
}

function randomColor() {
    if (STATE.selectedObj) STATE.selectedObj.material.color.setHex(Math.random()*0xffffff);
}

function resetScene() {
    objects.forEach(o => scene.remove(o));
    objects.length = 0;
    STATE.selectedObj = null;
}

</script>
</body>
</html>
