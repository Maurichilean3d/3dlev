<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Studio: Optimized v5</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.9); z-index: 999;
        }
        button {
            padding: 20px 50px; font-size: 20px; background: #ffaa00; border: none;
            border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
        .stats { font-size: 12px; color: #888; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>

<div id="overlay">
    <h1>MR STUDIO: OPTIMIZED CORE</h1>
    <p>1. Menú Rotado (90° CCW) en Mano IZQUIERDA</p>
    <p>2. Cero asignación de memoria en Loop</p>
    <button id="btn-start">INICIAR SISTEMA</button>
    <div class="stats">RAM Optimized | GPU Instancing Ready</div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ==========================================
// 1. VARIABLES REUTILIZABLES (ZERO GC)
// ==========================================
// Estas variables se crean UNA vez y se reciclan. 
// Esto evita que la RAM se llene y cause "tirones".
const _mat4 = new THREE.Matrix4();
const _ray = new THREE.Raycaster();
const _vec3 = new THREE.Vector3();
const _quat = new THREE.Quaternion();
const _color = new THREE.Color();

// Variables Globales
let scene, camera, renderer;
let ctrlRight, gripLeft, gripRight;
let uiGroup; 
const uiButtons = []; 
const objects = []; 

// Estado
const STATE = {
    hoveredBtn: null,
    selectedObj: null,
    isDragging: false,
    dragOffset: new THREE.Vector3(),
    menuAttached: false
};

// Cursor Visual (Reutilizado)
let cursorVisual;

init();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    // Iluminación
    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(2, 5, 2);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    scene.add(new THREE.GridHelper(10, 10, 0x333333, 0x111111));

    camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 20);
    camera.position.set(0, 1.6, 0);

    // Renderer Optimizado para VR
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Limitar a 1.5x para rendimiento en Quest
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    setupControllers();
    createWristUI();

    // Crear Cursor Visual
    cursorVisual = new THREE.Mesh(
        new THREE.SphereGeometry(0.005, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffff00 })
    );
    cursorVisual.visible = false;
    scene.add(cursorVisual);

    document.getElementById('btn-start').addEventListener('click', () => {
        const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
        navigator.xr.requestSession('immersive-ar', sessionInit).then(session => {
            renderer.xr.setSession(session);
            document.getElementById('overlay').style.display = 'none';
            scene.background = null;
        });
    });

    renderer.setAnimationLoop(render);
}

function setupControllers() {
    const modelFactory = new XRControllerModelFactory();

    // Setup Mano Derecha (Puntero)
    const c0 = renderer.xr.getController(0);
    const c1 = renderer.xr.getController(1);

    // Detectar manos al conectar
    const onConnected = (e) => {
        if (e.data.handedness === 'right') {
            ctrlRight = e.target;
            // Línea visual (estática, bajo coste)
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]),
                new THREE.LineBasicMaterial({ color: 0x0088ff, opacity: 0.5, transparent: true })
            );
            ctrlRight.add(line);
            ctrlRight.addEventListener('selectstart', onTriggerStart);
            ctrlRight.addEventListener('selectend', onTriggerEnd);
        }
    };
    c0.addEventListener('connected', onConnected);
    c1.addEventListener('connected', onConnected);
    scene.add(c0);
    scene.add(c1);

    // Setup Grips (Para anclar UI)
    gripLeft = renderer.xr.getControllerGrip(0); 
    gripLeft.add(modelFactory.createControllerModel(gripLeft));
    scene.add(gripLeft);

    gripRight = renderer.xr.getControllerGrip(1);
    gripRight.add(modelFactory.createControllerModel(gripRight));
    scene.add(gripRight);
}

// ==========================================
// 2. UI OPTIMIZADA & ROTADA
// ==========================================
function createWristUI() {
    uiGroup = new THREE.Group();
    
    // POSICIONAMIENTO Y ROTACIÓN PEDIDA
    // Posición: Un poco elevado (Y) y hacia adentro (X)
    uiGroup.position.set(0.05, 0.05, -0.05); 
    
    // ROTACIÓN: 
    // -90 en X para mirar arriba.
    // +90 en Z para girar 90 grados contra reloj (verticalizar respecto al brazo)
    uiGroup.rotation.set(-Math.PI / 2, 0, Math.PI / 2);

    // Panel Fondo
    const w = 0.16, h = 0.12;
    const bg = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.8 })
    );
    // Borde (Optimizado: LineLoop es más ligero que EdgesGeometry completo en algunos casos)
    const pts = [
        new THREE.Vector3(-w/2, h/2, 0), new THREE.Vector3(w/2, h/2, 0),
        new THREE.Vector3(w/2, -h/2, 0), new THREE.Vector3(-w/2, -h/2, 0)
    ];
    const borderGeo = new THREE.BufferGeometry().setFromPoints(pts);
    const border = new THREE.LineLoop(borderGeo, new THREE.LineBasicMaterial({ color: 0xffaa00 }));
    bg.add(border);
    uiGroup.add(bg);

    // Generar Botones
    // Como rotamos 90 grados, ajustamos las coordenadas X/Y visualmente
    createBtn('CUBO', '#0055ff', -0.04, 0.03, () => spawn('box'));
    createBtn('ESFERA', '#00aa55', 0.04, 0.03, () => spawn('sphere'));
    
    createBtn('CILIND', '#aa5500', -0.04, -0.03, () => spawn('cylinder'));
    createBtn('BORRAR', '#ff0000', 0.04, -0.03, deleteSelected);
}

function createBtn(text, color, x, y, cb) {
    const btn = new THREE.Mesh(
        new THREE.PlaneGeometry(0.06, 0.04),
        new THREE.MeshBasicMaterial({ color: color })
    );
    btn.position.set(x, y, 0.005);

    // Textura Canvas (Solo se crea al inicio, no consume en runtime)
    const cvs = document.createElement('canvas'); cvs.width=128; cvs.height=64;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = color; ctx.fillRect(0,0,128,64);
    ctx.fillStyle = 'white'; ctx.font = 'bold 30px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(text, 64, 32);
    
    const tex = new THREE.CanvasTexture(cvs);
    const label = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.03), new THREE.MeshBasicMaterial({map:tex, transparent:true}));
    label.position.z = 0.002;
    btn.add(label);

    btn.userData = { isButton: true, action: cb, baseColor: new THREE.Color(color) };
    uiGroup.add(btn);
    uiButtons.push(btn);
}

// ==========================================
// 3. RENDER LOOP (ZERO GC)
// ==========================================
function onTriggerStart() {
    if (STATE.hoveredBtn) {
        STATE.hoveredBtn.userData.action();
        // Animación simple sin crear tweens
        STATE.hoveredBtn.scale.set(0.9, 0.9, 1);
        setTimeout(() => { if(STATE.hoveredBtn) STATE.hoveredBtn.scale.set(1.1, 1.1, 1); }, 100);
    } else {
        checkIntersection(true);
    }
}

function onTriggerEnd() {
    STATE.isDragging = false;
}

function render() {
    // A. Anclar UI a mano izquierda (Solo una vez)
    if (!STATE.menuAttached) {
        // En Three WebXR, gripLeft se actualiza automáticamente si está añadido a scene.
        // Pero para parenting real, necesitamos saber que el tracking ha empezado.
        // Asumiremos gripLeft es correcto.
        if (gripLeft && gripLeft.visible) {
            gripLeft.add(uiGroup); // Parenting físico
            STATE.menuAttached = true;
        }
    }

    // B. Lógica de Raycaster (Sin crear objetos nuevos)
    if (ctrlRight) {
        // 1. Configurar Raycaster reutilizado
        _mat4.identity().extractRotation(ctrlRight.matrixWorld);
        _ray.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
        _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat4);

        // 2. Comprobar Botones UI
        const uiHits = _ray.intersectObjects(uiButtons, false);
        
        if (uiHits.length > 0) {
            const btn = uiHits[0].object;
            setHover(btn);
            
            cursorVisual.visible = true;
            cursorVisual.position.copy(uiHits[0].point);
            cursorVisual.material.color.setHex(0x00ff00);
        } else {
            setHover(null);
            
            // 3. Comprobar Escena
            const sceneHits = _ray.intersectObjects(objects, false);
            if (sceneHits.length > 0) {
                cursorVisual.visible = true;
                cursorVisual.position.copy(sceneHits[0].point);
                cursorVisual.material.color.setHex(0xffff00);

                if (STATE.isDragging && STATE.selectedObj) {
                    // Mover objeto sin crear vectores
                    _vec3.copy(_ray.ray.origin).addScaledVector(_ray.ray.direction, sceneHits[0].distance);
                    STATE.selectedObj.position.copy(_vec3.sub(STATE.dragOffset));
                }
            } else {
                cursorVisual.visible = true;
                // Punto lejano
                _vec3.copy(_ray.ray.origin).addScaledVector(_ray.ray.direction, 2);
                cursorVisual.position.copy(_vec3);
                cursorVisual.material.color.setHex(0xff0000);
            }
        }
    }

    renderer.render(scene, camera);
}

// Helpers
function setHover(btn) {
    if (STATE.hoveredBtn === btn) return;
    if (STATE.hoveredBtn) {
        STATE.hoveredBtn.scale.set(1, 1, 1);
        STATE.hoveredBtn.material.color.copy(STATE.hoveredBtn.userData.baseColor);
    }
    STATE.hoveredBtn = btn;
    if (btn) {
        btn.scale.set(1.1, 1.1, 1);
        btn.material.color.setHex(0x00ff00);
    }
}

// Funciones de Escena
function spawn(type) {
    let geo;
    // Reutilizar geometrías podría optimizar más, pero por ahora creamos simple
    if (type === 'box') geo = new THREE.BoxGeometry(0.15,0.15,0.15);
    else if (type === 'sphere') geo = new THREE.SphereGeometry(0.1,16,12);
    else geo = new THREE.CylinderGeometry(0.08,0.08,0.15,16);

    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: Math.random()*0xffffff }));
    
    // Posición spawn sin garbage
    _vec3.set(0, 0, -0.6).applyMatrix4(camera.matrixWorld);
    mesh.position.copy(_vec3);
    
    scene.add(mesh);
    objects.push(mesh);
    select(mesh);
}

function checkIntersection(isClick) {
    const hits = _ray.intersectObjects(objects, false);
    if (hits.length > 0) {
        const obj = hits[0].object;
        select(obj);
        if (isClick) {
            STATE.isDragging = true;
            STATE.dragOffset.copy(hits[0].point).sub(obj.position);
        }
    } else {
        if (isClick) select(null);
    }
}

function select(obj) {
    if (STATE.selectedObj && STATE.selectedObj !== obj) {
        STATE.selectedObj.material.wireframe = false;
    }
    STATE.selectedObj = obj;
    if (obj) obj.material.wireframe = true;
}

// Gestión de Memoria (Limpiar GPU)
function deleteSelected() {
    if (STATE.selectedObj) {
        // Limpiar memoria GPU
        STATE.selectedObj.geometry.dispose();
        STATE.selectedObj.material.dispose();
        scene.remove(STATE.selectedObj);
        
        const idx = objects.indexOf(STATE.selectedObj);
        if (idx > -1) objects.splice(idx, 1);
        
        STATE.selectedObj = null;
    }
}

</script>
</body>
</html>
