<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ==========================================
// CONFIGURACIÓN GLOBAL
// ==========================================
let scene, camera, renderer;
let ctrlRight, ctrlLeft, gripLeft, gripRight;
let uiPanel, propertiesPanel, numericPanel;
let uiContainer; // Contenedor separado para el UI
const objects = [];

let selectorSphere;
const SELECTOR_RADIUS = 0.08;

const _tempVecA = new THREE.Vector3();
const _tempVecB = new THREE.Vector3();
const _tempVecC = new THREE.Vector3();
const _tempQuat = new THREE.Quaternion();
const _ray = new THREE.Raycaster();
const _mat = new THREE.Matrix4();

let gizmo = null;
let gizmoHandles = [];

// ESTADO PRINCIPAL
const STATE = {
  mode: 'OBJECT',
  editMode: 'VERTEX',
  tool: 'SELECT',
  transform: 'GLOBAL',
  shading: 'SOLID',

  selected: null,
  mainMesh: null,
  selection: [],

  hoveredBtn: null,
  grabbedElement: null,
  grabbedGizmoAxis: null,
  gizmoStartPos: new THREE.Vector3(),
  controllerStartPos: new THREE.Vector3(),

  menuVisible: false,
  propertiesVisible: false,
  numericInputActive: false,
  currentInputField: null,

  closestVertex: null,
  closestEdge: null,
  closestFace: null,

  vertexHelpers: [],
  edgeHelpers: [],
  faceHelpers: [],

  knifeMode: false,
  knifePoints: [],

  colors: {
    selected: 0xffa500,
    vertex: 0x00ff00,
    edge: 0xff8800,
    face: 0x00aaff,
    highlight: 0xffff00,
    knife: 0xff00ff
  },

  extrudeAmount: 0.1,
  subdivisionLevel: 1,
  bevelAmount: 0.02,
  insetAmount: 0.8
};

const UI = {
  panel: null,
  buttons: [],
  propertiesPanel: null,
  numericPanel: null,
  numericButtons: [],
  inputFields: {},
  container: null
};

init();

// ==========================================
// INICIALIZACIÓN
// ==========================================
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a1a);
  scene.fog = new THREE.Fog(0x1a1a1a, 5, 20);

  // Iluminación mejorada
  const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
  keyLight.position.set(5, 10, 7.5);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 2048;
  keyLight.shadow.mapSize.height = 2048;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x6699ff, 0.9);
  fillLight.position.set(-5, 5, -5);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xff9966, 0.7);
  rimLight.position.set(0, 5, -10);
  scene.add(rimLight);

  scene.add(new THREE.AmbientLight(0x404060, 0.5));

  // Grid y ejes
  const gridHelper = new THREE.GridHelper(20, 40, 0x444444, 0x222222);
  scene.add(gridHelper);

  const axesHelper = new THREE.AxesHelper(1);
  axesHelper.position.set(-4, 0.01, -4);
  scene.add(axesHelper);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
  camera.position.set(0, 1.6, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.xr.enabled = true;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  setupControllers(); // ✅ FIX AQUÍ
  createGizmo();
  createUIPanel();
  createPropertiesPanel();
  createNumericPanel();

  document.getElementById('btn-start').addEventListener('click', () => {
    navigator.xr.requestSession('immersive-vr', {
      optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
    }).then(session => {
      renderer.xr.setSession(session);
      document.getElementById('overlay').style.display = 'none';
      scene.background = null;
    });
  });

  window.addEventListener('keydown', handleKeyPress);
  renderer.setAnimationLoop(render);
}

// ==========================================
// ✅ CONTROLADORES VR (FIX: GRIPS POR HANDEDNESS)
// ==========================================
function setupControllers() {
  const modelFactory = new XRControllerModelFactory();

  // Controllers por índice (NO asumimos left/right)
  const c0 = renderer.xr.getController(0);
  const c1 = renderer.xr.getController(1);

  c0.userData.index = 0;
  c1.userData.index = 1;

  scene.add(c0, c1);

  // Grips por índice
  const grips = [];
  grips[0] = renderer.xr.getControllerGrip(0);
  grips[1] = renderer.xr.getControllerGrip(1);

  grips[0].add(modelFactory.createControllerModel(grips[0]));
  grips[1].add(modelFactory.createControllerModel(grips[1]));

  scene.add(grips[0], grips[1]);

  const onConnected = (e) => {
    const controller = e.target;
    const handedness = e.data.handedness; // 'left' | 'right'
    const idx = controller.userData.index; // 0 | 1
    const grip = grips[idx]; // grip correcto para ese controller

    if (handedness === 'right') {
      ctrlRight = controller;
      gripRight = grip;

      const geo = new THREE.SphereGeometry(0.01, 16, 16);
      const mat = new THREE.MeshBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0.8 });
      selectorSphere = new THREE.Mesh(geo, mat);
      selectorSphere.position.set(0, -0.015, -0.05);
      ctrlRight.add(selectorSphere);

      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -2)
      ]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x2b7fdb, opacity: 0.3, transparent: true });
      const line = new THREE.Line(lineGeo, lineMat);
      ctrlRight.add(line);

      controller.addEventListener('selectstart', onRightTriggerStart);
      controller.addEventListener('selectend', onRightTriggerEnd);
      controller.addEventListener('squeezestart', onRightGripStart);
      controller.addEventListener('squeezeend', onRightGripEnd);

    } else if (handedness === 'left') {
      ctrlLeft = controller;
      gripLeft = grip;

      controller.addEventListener('selectstart', onLeftTriggerStart);
      controller.addEventListener('squeezestart', toggleMenu);
    }
  };

  c0.addEventListener('connected', onConnected);
  c1.addEventListener('connected', onConnected);
}

// ==========================================
// GIZMO
// ==========================================
function createGizmo() {
  gizmo = new THREE.Group();
  gizmo.visible = false;

  const size = 0.15;
  const thickness = 0.005;

  const axes = [
    { color: 0xff0000, dir: new THREE.Vector3(1, 0, 0), axis: 'x' },
    { color: 0x00ff00, dir: new THREE.Vector3(0, 1, 0), axis: 'y' },
    { color: 0x0000ff, dir: new THREE.Vector3(0, 0, 1), axis: 'z' }
  ];

  axes.forEach(axisData => {
    const group = createGizmoAxis(axisData.color, axisData.dir, size, thickness);
    group.userData = { axis: axisData.axis, isGizmoHandle: true };
    gizmo.add(group);
    gizmoHandles.push(group);
  });

  const centerGeo = new THREE.SphereGeometry(0.02, 16, 16);
  const centerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
  const center = new THREE.Mesh(centerGeo, centerMat);
  center.userData = { axis: 'xyz', isGizmoHandle: true };
  gizmo.add(center);
  gizmoHandles.push(center);

  scene.add(gizmo);
}

function createGizmoAxis(color, direction, length, thickness) {
  const group = new THREE.Group();

  const lineGeo = new THREE.CylinderGeometry(thickness, thickness, length, 8);
  const lineMat = new THREE.MeshBasicMaterial({ color: color });
  const line = new THREE.Mesh(lineGeo, lineMat);
  line.position.copy(direction.clone().multiplyScalar(length / 2));
  line.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
  group.add(line);

  const coneGeo = new THREE.ConeGeometry(0.015, 0.04, 12);
  const coneMat = new THREE.MeshBasicMaterial({ color: color });
  const cone = new THREE.Mesh(coneGeo, coneMat);
  cone.position.copy(direction.clone().multiplyScalar(length));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
  group.add(cone);

  const planeGeo = new THREE.PlaneGeometry(length * 1.5, length * 1.5);
  const planeMat = new THREE.MeshBasicMaterial({ visible: false });
  const plane = new THREE.Mesh(planeGeo, planeMat);
  plane.position.copy(direction.clone().multiplyScalar(length / 2));

  if (direction.x !== 0) {
    plane.rotation.y = Math.PI / 2;
  } else if (direction.z !== 0) {
    plane.rotation.y = 0;
  }
  group.add(plane);

  return group;
}

function updateGizmoPosition() {
  if (!gizmo.visible || (!STATE.selected && STATE.selection.length === 0)) return;

  if (STATE.mode === 'EDIT' && STATE.selection.length > 0) {
    const center = new THREE.Vector3();
    STATE.selection.forEach(el => {
      el.getWorldPosition(_tempVecA);
      center.add(_tempVecA);
    });
    center.divideScalar(STATE.selection.length);
    gizmo.position.copy(center);

    if (STATE.transform === 'LOCAL' && STATE.mainMesh) {
      STATE.mainMesh.getWorldQuaternion(_tempQuat);
      gizmo.quaternion.copy(_tempQuat);
    } else if (STATE.transform === 'NORMAL' && STATE.selection[0] && STATE.selection[0].userData.normal) {
      gizmo.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), STATE.selection[0].userData.normal);
    } else {
      gizmo.quaternion.identity();
    }
  } else if (STATE.mode === 'OBJECT' && STATE.selected) {
    STATE.selected.getWorldPosition(_tempVecA);
    gizmo.position.copy(_tempVecA);

    if (STATE.transform === 'LOCAL') {
      STATE.selected.getWorldQuaternion(_tempQuat);
      gizmo.quaternion.copy(_tempQuat);
    } else {
      gizmo.quaternion.identity();
    }
  }
}

function showGizmo(visible) {
  gizmo.visible = visible && (STATE.tool === 'MOVE' || STATE.tool === 'ROTATE' || STATE.tool === 'SCALE');
  if (visible) updateGizmoPosition();
}

// UI PANEL - CONTENEDOR INDEPENDIENTE

function createMenuSection(title, y, width) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0, 0, 512, 64);

  ctx.fillStyle = '#2b7fdb';
  ctx.font = 'bold 28px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(title, 10, 40);

  const texture = new THREE.CanvasTexture(canvas);
  const geo = new THREE.PlaneGeometry(width, 0.035);
  const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, y, 0.003);

  UI.panel.add(mesh);
}

function createIconButton(icon, label, x, y, callback, active = false) {
  const size = 0.06;
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');

  const gradient = ctx.createLinearGradient(0, 0, 0, 128);
  if (active) {
    gradient.addColorStop(0, '#2b7fdb');
    gradient.addColorStop(1, '#1a5fa0');
  } else {
    gradient.addColorStop(0, '#3a3a3a');
    gradient.addColorStop(1, '#2a2a2a');
  }
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 128, 128);

  ctx.strokeStyle = active ? '#ffffff' : '#555555';
  ctx.lineWidth = active ? 4 : 2;
  ctx.strokeRect(2, 2, 124, 124);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 52px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(icon, 64, 48);

  ctx.font = 'bold 14px Arial';
  ctx.fillText(label, 64, 100);

  const texture = new THREE.CanvasTexture(canvas);
  const geo = new THREE.PlaneGeometry(size, size);
  const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
  const btn = new THREE.Mesh(geo, mat);
  btn.position.set(x, y, 0.004);

  btn.userData = { isButton: true, action: callback, label };
  UI.panel.add(btn);
  UI.buttons.push(btn);

  return btn;
}

function clearUIButtons() {
  UI.buttons.forEach(btn => {
    if (UI.panel.children.includes(btn)) UI.panel.remove(btn);
  });
  UI.buttons = [];
}

// ==========================================
// LOOP PRINCIPAL
// ==========================================
function render() {
  // Menú anclado al grip izquierdo cada frame
  if (STATE.menuVisible && gripLeft && UI.container) {
    gripLeft.getWorldPosition(_tempVecA);
    gripLeft.getWorldQuaternion(_tempQuat);

    const offset = new THREE.Vector3(0.15, 0.05, -0.1);
    offset.applyQuaternion(_tempQuat);

    UI.container.position.copy(_tempVecA).add(offset);
    UI.container.quaternion.copy(_tempQuat);
    UI.container.rotateY(-Math.PI / 4);
  }

  if (ctrlRight) {
    if (STATE.mode === 'EDIT' && STATE.mainMesh) {
      if (STATE.editMode === 'VERTEX') checkVertexProximity();
      else if (STATE.editMode === 'EDGE') checkEdgeProximity();
      else if (STATE.editMode === 'FACE') checkFaceProximity();
    }

    if (STATE.grabbedElement) {
      if (STATE.grabbedElement.userData.isVertex) updateVertexGeometry(STATE.grabbedElement);
      else if (STATE.grabbedElement.userData.isEdge) updateEdgeGeometry(STATE.grabbedElement);
      else if (STATE.grabbedElement.userData.isFace) updateFaceGeometry(STATE.grabbedElement);
    }

    if (STATE.grabbedGizmoAxis) applyGizmoTransform();
  }

  updateGizmoPosition();
  updateInfoDisplay();
  renderer.render(scene, camera);
}

// ==========================================
// INPUT / INTERACCIÓN
// ==========================================
function onRightTriggerStart() {
  if (STATE.menuVisible && checkUIInteraction()) return;
  if (gizmo.visible && checkGizmoInteraction()) return;

  if (STATE.knifeMode) { addKnifePoint(); return; }

  if (STATE.mode === 'OBJECT') {
    selectObjectRaycast();
  } else if (STATE.mode === 'EDIT') {
    if (STATE.editMode === 'VERTEX' && STATE.closestVertex) toggleSelection(STATE.closestVertex);
    else if (STATE.editMode === 'EDGE' && STATE.closestEdge) toggleSelection(STATE.closestEdge);
    else if (STATE.editMode === 'FACE' && STATE.closestFace) toggleSelection(STATE.closestFace);
  }
}

function onRightTriggerEnd() {
  if (STATE.grabbedGizmoAxis) STATE.grabbedGizmoAxis = null;
}

function onRightGripStart() {
  if (STATE.mode === 'EDIT') {
    if (STATE.editMode === 'VERTEX' && STATE.closestVertex) {
      STATE.grabbedElement = STATE.closestVertex;
      gripRight?.attach(STATE.grabbedElement);
    } else if (STATE.editMode === 'EDGE' && STATE.closestEdge) {
      STATE.grabbedElement = STATE.closestEdge;
      gripRight?.attach(STATE.grabbedElement);
    } else if (STATE.editMode === 'FACE' && STATE.closestFace) {
      STATE.grabbedElement = STATE.closestFace;
      gripRight?.attach(STATE.grabbedElement);
    }
  } else if (STATE.mode === 'OBJECT' && STATE.selected) {
    STATE.grabbedElement = STATE.selected;
    gripRight?.attach(STATE.grabbedElement);
  }
}

function onRightGripEnd() {
  if (!STATE.grabbedElement) return;

  if (STATE.grabbedElement.userData.isVertex) {
    const vertex = STATE.grabbedElement;
    const mesh = vertex.userData.parentMesh;
    mesh.attach(vertex);
    updateVertexGeometry(vertex);
  } else if (STATE.grabbedElement.userData.isEdge) {
    const edge = STATE.grabbedElement;
    const mesh = edge.userData.parentMesh;
    mesh.attach(edge);
    updateEdgeGeometry(edge);
  } else if (STATE.grabbedElement.userData.isFace) {
    const face = STATE.grabbedElement;
    const mesh = face.userData.parentMesh;
    mesh.attach(face);
    updateFaceGeometry(face);
  } else {
    scene.attach(STATE.grabbedElement);
  }

  STATE.grabbedElement = null;
}

function onLeftTriggerStart() { /* reservado */ }

function checkUIInteraction() {
  if (!ctrlRight) return false;

  _mat.identity().extractRotation(ctrlRight.matrixWorld);
  _ray.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
  _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat);

  const hits = _ray.intersectObjects(UI.buttons, false);
  if (hits.length > 0) {
    const btn = hits[0].object;
    if (btn.userData.action) {
      btn.userData.action();
      animateButtonPress(btn);
      return true;
    }
  }
  return false;
}

function animateButtonPress(btn) {
  const originalZ = btn.position.z;
  btn.position.z -= 0.005;
  setTimeout(() => { btn.position.z = originalZ; }, 120);
}

function checkGizmoInteraction() {
  if (!ctrlRight) return false;

  _mat.identity().extractRotation(ctrlRight.matrixWorld);
  _ray.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
  _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat);

  const hits = _ray.intersectObjects(gizmoHandles, true);
  if (hits.length > 0) {
    let parent = hits[0].object;
    while (parent.parent && !parent.userData.axis) parent = parent.parent;

    if (parent.userData.axis) {
      STATE.grabbedGizmoAxis = parent.userData.axis;
      gizmo.getWorldPosition(STATE.gizmoStartPos);
      ctrlRight.getWorldPosition(STATE.controllerStartPos);
      return true;
    }
  }
  return false;
}

function handleKeyPress(event) {
  switch (event.key.toLowerCase()) {
    case 'g': setTool('MOVE'); break;
    case 'r': setTool('ROTATE'); break;
    case 's': setTool('SCALE'); break;
    case 'tab':
      event.preventDefault();
      switchToMode(STATE.mode === 'OBJECT' ? 'EDIT' : 'OBJECT');
      break;
    case 'e': if (STATE.mode === 'EDIT') extrudeSelection(); break;
    case 'x':
    case 'delete': deleteSelected(); break;
    case '1': if (STATE.mode === 'EDIT') setEditMode('VERTEX'); break;
    case '2': if (STATE.mode === 'EDIT') setEditMode('EDGE'); break;
    case '3': if (STATE.mode === 'EDIT') setEditMode('FACE'); break;
    case 'z': if (event.ctrlKey) undoAction(); break;
  }
}

// ==========================================
// CREACIÓN / SELECCIÓN OBJETOS
// ==========================================
function spawnObject(type) {
  let geo;

  switch (type) {
    case 'box': geo = new THREE.BoxGeometry(0.2, 0.2, 0.2, 2, 2, 2); break;
    case 'sphere': geo = new THREE.SphereGeometry(0.12, 32, 24); break;
    case 'cylinder': geo = new THREE.CylinderGeometry(0.08, 0.08, 0.25, 32); break;
    case 'torus': geo = new THREE.TorusGeometry(0.1, 0.04, 24, 48); break;
    default: geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
  }

  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
    roughness: 0.5,
    metalness: 0.2
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = `${type}_${objects.length + 1}`;

  camera.getWorldPosition(_tempVecA);
  camera.getWorldQuaternion(_tempQuat);

  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(_tempQuat);
  mesh.position.copy(_tempVecA).add(forward.multiplyScalar(0.6));
  mesh.position.y = Math.max(mesh.position.y, 0.15);

  scene.add(mesh);
  objects.push(mesh);

  selectObject(mesh);
  updateLog(`✓ Creado: ${mesh.name}`);
}

function selectObject(obj) {
  if (STATE.selected === obj) return;

  if (STATE.selected && !STATE.selected.userData.isVertex && !STATE.selected.userData.isEdge && !STATE.selected.userData.isFace) {
    STATE.selected.material.emissive.setHex(0x000000);
  }

  STATE.selected = obj;

  if (obj) {
    obj.material.emissive.setHex(STATE.colors.selected);
    STATE.mainMesh = obj;
    showGizmo(STATE.tool !== 'SELECT');
  } else {
    STATE.mainMesh = null;
    showGizmo(false);
  }
}

function selectObjectRaycast() {
  if (!ctrlRight) return;

  _mat.identity().extractRotation(ctrlRight.matrixWorld);
  _ray.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
  _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat);

  const hits = _ray.intersectObjects(objects, false);
  if (hits.length > 0) selectObject(hits[0].object);
  else selectObject(null);
}

// ==========================================
// SELECCIÓN EDIT
// ==========================================
function toggleSelection(element) {
  const idx = STATE.selection.indexOf(element);

  if (idx > -1) {
    STATE.selection.splice(idx, 1);
    resetElementColor(element);
  } else {
    STATE.selection.push(element);
    highlightElement(element);
  }
  showGizmo(STATE.selection.length > 0 && STATE.tool !== 'SELECT');
}

function clearSelection() {
  STATE.selection.forEach(el => resetElementColor(el));
  STATE.selection = [];
}

function highlightElement(element) {
  if (element.material) {
    element.material.color.setHex(STATE.colors.highlight);
    element.scale.set(1.6, 1.6, 1.6);
  }
}

function resetElementColor(element) {
  if (element.userData.isVertex) {
    element.material.color.setHex(STATE.colors.vertex);
    element.scale.set(1, 1, 1);
  } else if (element.userData.isEdge) {
    element.material.color.setHex(STATE.colors.edge);
    element.scale.set(1, 1, 1);
  } else if (element.userData.isFace) {
    element.material.color.setHex(STATE.colors.face);
    element.scale.set(1, 1, 1);
  }
}

// ==========================================
// MODOS
// ==========================================
function switchToMode(mode) {
  if (STATE.mode === mode) return;

  if (STATE.mode === 'EDIT' && STATE.mainMesh) exitEditMode();

  STATE.mode = mode;
  clearSelection();

  if (mode === 'EDIT') {
    if (STATE.selected && objects.includes(STATE.selected)) {
      STATE.mainMesh = STATE.selected;
      enterEditMode();
      createEditMenu();
    } else {
      STATE.mode = 'OBJECT';
      updateLog('⚠️ Selecciona un objeto primero');
    }
  } else {
    createMainMenu();
  }

  updateLog(`📋 Modo: ${mode}`);
}

function enterEditMode() {
  if (!STATE.mainMesh) return;
  applyEditModeShading();
  setEditMode(STATE.editMode);
}

function exitEditMode() {
  if (!STATE.mainMesh) return;
  clearAllHelpers();
  restoreOriginalShading();
  STATE.mainMesh = null;
}

function setEditMode(mode) {
  if (!STATE.mainMesh) return;

  clearAllHelpers();
  STATE.editMode = mode;

  if (mode === 'VERTEX') createVertexHelpers();
  else if (mode === 'EDGE') createEdgeHelpers();
  else if (mode === 'FACE') createFaceHelpers();

  updateLog(`✏️ Edición: ${mode}`);
}

// ==========================================
// HELPERS
// ==========================================
function createVertexHelpers() {
  const mesh = STATE.mainMesh;
  const posAttr = mesh.geometry.attributes.position;
  const uniqueVertices = new Map();

  for (let i = 0; i < posAttr.count; i++) {
    const x = posAttr.getX(i);
    const y = posAttr.getY(i);
    const z = posAttr.getZ(i);
    const key = `${x.toFixed(4)}_${y.toFixed(4)}_${z.toFixed(4)}`;

    if (!uniqueVertices.has(key)) uniqueVertices.set(key, []);
    uniqueVertices.get(key).push(i);
  }

  uniqueVertices.forEach((indices) => {
    const v = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);

    const geo = new THREE.SphereGeometry(0.012, 12, 12);
    const mat = new THREE.MeshBasicMaterial({ color: STATE.colors.vertex });
    const helper = new THREE.Mesh(geo, mat);

    helper.position.copy(v);
    helper.userData = { isVertex: true, indices, parentMesh: mesh };

    mesh.add(helper);
    STATE.vertexHelpers.push(helper);
  });
}

function createEdgeHelpers() {
  const mesh = STATE.mainMesh;
  const posAttr = mesh.geometry.attributes.position;
  const edges = new Map();

  const index = mesh.geometry.index;
  const triangleCount = index ? index.count / 3 : posAttr.count / 3;

  for (let i = 0; i < triangleCount; i++) {
    const i0 = index ? index.getX(i * 3) : i * 3;
    const i1 = index ? index.getX(i * 3 + 1) : i * 3 + 1;
    const i2 = index ? index.getX(i * 3 + 2) : i * 3 + 2;

    addEdge(edges, i0, i1, posAttr);
    addEdge(edges, i1, i2, posAttr);
    addEdge(edges, i2, i0, posAttr);
  }

  edges.forEach(edgeData => {
    const helper = createEdgeHelper(edgeData, mesh);
    mesh.add(helper);
    STATE.edgeHelpers.push(helper);
  });
}

function addEdge(edges, idx1, idx2, posAttr) {
  const key = idx1 < idx2 ? `${idx1}-${idx2}` : `${idx2}-${idx1}`;
  if (!edges.has(key)) {
    const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, idx1);
    const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, idx2);
    edges.set(key, { v1, v2, indices: [idx1, idx2] });
  }
}

function createEdgeHelper(edgeData, mesh) {
  const { v1, v2, indices } = edgeData;
  const midpoint = v1.clone().add(v2).multiplyScalar(0.5);
  const length = v1.distanceTo(v2);

  const geo = new THREE.CylinderGeometry(0.008, 0.008, length, 8);
  const mat = new THREE.MeshBasicMaterial({ color: STATE.colors.edge });
  const helper = new THREE.Mesh(geo, mat);

  helper.position.copy(midpoint);

  const direction = v2.clone().sub(v1).normalize();
  helper.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);

  helper.userData = { isEdge: true, indices, v1: v1.clone(), v2: v2.clone(), parentMesh: mesh };
  return helper;
}

function createFaceHelpers() {
  const mesh = STATE.mainMesh;
  const posAttr = mesh.geometry.attributes.position;
  const index = mesh.geometry.index;
  const triangleCount = index ? index.count / 3 : posAttr.count / 3;

  for (let i = 0; i < triangleCount; i++) {
    const i0 = index ? index.getX(i * 3) : i * 3;
    const i1 = index ? index.getX(i * 3 + 1) : i * 3 + 1;
    const i2 = index ? index.getX(i * 3 + 2) : i * 3 + 2;

    const v0 = new THREE.Vector3().fromBufferAttribute(posAttr, i0);
    const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, i1);
    const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, i2);

    const helper = createFaceHelper(v0, v1, v2, [i0, i1, i2], mesh);
    mesh.add(helper);
    STATE.faceHelpers.push(helper);
  }
}

function createFaceHelper(v0, v1, v2, indices, mesh) {
  const center = v0.clone().add(v1).add(v2).divideScalar(3);

  const geo = new THREE.CircleGeometry(0.025, 12);
  const mat = new THREE.MeshBasicMaterial({
    color: STATE.colors.face,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.7
  });
  const helper = new THREE.Mesh(geo, mat);

  helper.position.copy(center);

  const edge1 = v1.clone().sub(v0);
  const edge2 = v2.clone().sub(v0);
  const normal = edge1.cross(edge2).normalize();
  helper.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);

  helper.userData = { isFace: true, indices, vertices: [v0.clone(), v1.clone(), v2.clone()], normal, parentMesh: mesh };
  return helper;
}

function clearAllHelpers() {
  if (STATE.mainMesh) {
    STATE.vertexHelpers.forEach(h => STATE.mainMesh.remove(h));
    STATE.edgeHelpers.forEach(h => STATE.mainMesh.remove(h));
    STATE.faceHelpers.forEach(h => STATE.mainMesh.remove(h));
  }
  STATE.vertexHelpers = [];
  STATE.edgeHelpers = [];
  STATE.faceHelpers = [];
}

// ==========================================
// GEOMETRÍA
// ==========================================
function updateVertexGeometry(vertex) {
  const mesh = vertex.userData.parentMesh;
  const posAttr = mesh.geometry.attributes.position;
  const indices = vertex.userData.indices;
  const newPos = vertex.position;

  indices.forEach(idx => {
    posAttr.setXYZ(idx, newPos.x, newPos.y, newPos.z);
  });

  posAttr.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
  mesh.geometry.computeBoundingSphere();

  updateRelatedHelpers();
}

function updateEdgeGeometry(edge) {
  const mesh = edge.userData.parentMesh;
  const posAttr = mesh.geometry.attributes.position;
  const indices = edge.userData.indices;

  const worldPos = new THREE.Vector3();
  edge.getWorldPosition(worldPos);
  mesh.worldToLocal(worldPos);

  const v1Original = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);
  const v2Original = new THREE.Vector3().fromBufferAttribute(posAttr, indices[1]);
  const originalMidpoint = v1Original.clone().add(v2Original).multiplyScalar(0.5);
  const offset = worldPos.sub(originalMidpoint);

  v1Original.add(offset);
  v2Original.add(offset);

  posAttr.setXYZ(indices[0], v1Original.x, v1Original.y, v1Original.z);
  posAttr.setXYZ(indices[1], v2Original.x, v2Original.y, v2Original.z);

  posAttr.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
  mesh.geometry.computeBoundingSphere();

  updateRelatedHelpers();
}

function updateFaceGeometry(face) {
  const mesh = face.userData.parentMesh;
  const posAttr = mesh.geometry.attributes.position;
  const indices = face.userData.indices;

  const worldPos = new THREE.Vector3();
  face.getWorldPosition(worldPos);
  mesh.worldToLocal(worldPos);

  const v0 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);
  const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[1]);
  const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[2]);
  const originalCenter = v0.clone().add(v1).add(v2).divideScalar(3);

  const offset = worldPos.sub(originalCenter);
  v0.add(offset); v1.add(offset); v2.add(offset);

  posAttr.setXYZ(indices[0], v0.x, v0.y, v0.z);
  posAttr.setXYZ(indices[1], v1.x, v1.y, v1.z);
  posAttr.setXYZ(indices[2], v2.x, v2.y, v2.z);

  posAttr.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
  mesh.geometry.computeBoundingSphere();

  updateRelatedHelpers();
}

function updateRelatedHelpers() {
  if (STATE.editMode === 'EDGE' && STATE.edgeHelpers.length > 0) {
    const mesh = STATE.mainMesh;
    const posAttr = mesh.geometry.attributes.position;

    STATE.edgeHelpers.forEach(edge => {
      const indices = edge.userData.indices;
      const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);
      const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[1]);
      const midpoint = v1.clone().add(v2).multiplyScalar(0.5);
      const length = v1.distanceTo(v2);

      edge.position.copy(midpoint);

      const baseLength = 0.008;
      edge.scale.y = length / baseLength;

      const direction = v2.clone().sub(v1).normalize();
      edge.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);

      edge.userData.v1 = v1.clone();
      edge.userData.v2 = v2.clone();
    });
  }

  if (STATE.editMode === 'FACE' && STATE.faceHelpers.length > 0) {
    const mesh = STATE.mainMesh;
    const posAttr = mesh.geometry.attributes.position;

    STATE.faceHelpers.forEach(face => {
      const indices = face.userData.indices;
      const v0 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);
      const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[1]);
      const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[2]);
      const center = v0.clone().add(v1).add(v2).divideScalar(3);

      face.position.copy(center);

      const edge1 = v1.clone().sub(v0);
      const edge2 = v2.clone().sub(v0);
      const normal = edge1.cross(edge2).normalize();
      face.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);

      face.userData.vertices = [v0.clone(), v1.clone(), v2.clone()];
      face.userData.normal = normal;
    });
  }
}

// ==========================================
// PROXIMIDAD
// ==========================================
function checkVertexProximity() {
  if (!selectorSphere || STATE.vertexHelpers.length === 0) return;

  selectorSphere.getWorldPosition(_tempVecA);
  let minDist = SELECTOR_RADIUS;
  let closest = null;

  for (let vertex of STATE.vertexHelpers) {
    vertex.getWorldPosition(_tempVecB);
    const dist = _tempVecA.distanceTo(_tempVecB);
    if (dist < minDist) { minDist = dist; closest = vertex; }
  }

  if (closest !== STATE.closestVertex) {
    if (STATE.closestVertex && !STATE.selection.includes(STATE.closestVertex)) {
      STATE.closestVertex.material.color.setHex(STATE.colors.vertex);
      STATE.closestVertex.scale.set(1, 1, 1);
    }
    if (closest) {
      closest.material.color.setHex(STATE.colors.highlight);
      closest.scale.set(1.4, 1.4, 1.4);
    }
    STATE.closestVertex = closest;
  }
}

function checkEdgeProximity() {
  if (!selectorSphere || STATE.edgeHelpers.length === 0) return;

  selectorSphere.getWorldPosition(_tempVecA);
  let minDist = SELECTOR_RADIUS;
  let closest = null;

  for (let edge of STATE.edgeHelpers) {
    edge.getWorldPosition(_tempVecB);
    const dist = _tempVecA.distanceTo(_tempVecB);
    if (dist < minDist) { minDist = dist; closest = edge; }
  }

  if (closest !== STATE.closestEdge) {
    if (STATE.closestEdge && !STATE.selection.includes(STATE.closestEdge)) {
      STATE.closestEdge.material.color.setHex(STATE.colors.edge);
      STATE.closestEdge.scale.set(1, 1, 1);
    }
    if (closest) {
      closest.material.color.setHex(STATE.colors.highlight);
      closest.scale.set(1.4, 1, 1.4);
    }
    STATE.closestEdge = closest;
  }
}

function checkFaceProximity() {
  if (!selectorSphere || STATE.faceHelpers.length === 0) return;

  selectorSphere.getWorldPosition(_tempVecA);
  let minDist = SELECTOR_RADIUS;
  let closest = null;

  for (let face of STATE.faceHelpers) {
    face.getWorldPosition(_tempVecB);
    const dist = _tempVecA.distanceTo(_tempVecB);
    if (dist < minDist) { minDist = dist; closest = face; }
  }

  if (closest !== STATE.closestFace) {
    if (STATE.closestFace && !STATE.selection.includes(STATE.closestFace)) {
      STATE.closestFace.material.color.setHex(STATE.colors.face);
      STATE.closestFace.material.opacity = 0.7;
      STATE.closestFace.scale.set(1, 1, 1);
    }
    if (closest) {
      closest.material.color.setHex(STATE.colors.highlight);
      closest.material.opacity = 0.95;
      closest.scale.set(1.6, 1.6, 1);
    }
    STATE.closestFace = closest;
  }
}

// ==========================================
// SHADING
// ==========================================
function setShading(mode) {
  STATE.shading = mode;

  objects.forEach(obj => {
    if (obj === STATE.mainMesh && STATE.mode === 'EDIT') return;
    applyShading(obj, mode);
  });

  if (STATE.mainMesh && STATE.mode === 'EDIT') applyEditModeShading();
  updateLog(`🎨 Shading: ${mode}`);
}

function applyShading(mesh, mode) {
  const material = mesh.material;

  switch (mode) {
    case 'SOLID':
      material.wireframe = false;
      material.flatShading = false;
      material.roughness = 0.5;
      material.metalness = 0.2;
      break;
    case 'WIREFRAME':
      material.wireframe = true;
      material.wireframeLinewidth = 1;
      break;
    case 'MATERIAL':
      material.wireframe = false;
      material.flatShading = false;
      material.roughness = 0.3;
      material.metalness = 0.5;
      break;
    case 'RENDERED':
      material.wireframe = false;
      material.flatShading = false;
      material.roughness = 0.2;
      material.metalness = 0.8;
      break;
  }

  material.needsUpdate = true;
}

function applyEditModeShading() {
  if (!STATE.mainMesh) return;
  const material = STATE.mainMesh.material;
  material.wireframe = false;
  material.transparent = true;
  material.opacity = 0.75;
  material.flatShading = true;
  material.needsUpdate = true;
}

function restoreOriginalShading() {
  if (!STATE.mainMesh) return;
  const material = STATE.mainMesh.material;
  material.transparent = false;
  material.opacity = 1.0;
  applyShading(STATE.mainMesh, STATE.shading);
}

// ==========================================
// TRANSFORM / TOOL
// ==========================================
function setTransform(mode) {
  STATE.transform = mode;
  updateGizmoPosition();
  updateLog(`🔧 Transform: ${mode}`);
}

function setTool(tool) {
  STATE.tool = tool;
  showGizmo(tool !== 'SELECT');
  updateLog(`🔨 Herramienta: ${tool}`);
}

function applyGizmoTransform() {
  if (!STATE.grabbedGizmoAxis || !ctrlRight) return;

  ctrlRight.getWorldPosition(_tempVecA);
  const delta = _tempVecA.clone().sub(STATE.controllerStartPos);

  if (STATE.tool === 'MOVE') {
    let movement = delta.clone();

    if (STATE.grabbedGizmoAxis === 'x') {
      const xAxis = new THREE.Vector3(1, 0, 0);
      if (STATE.transform === 'LOCAL' && STATE.mainMesh) xAxis.applyQuaternion(STATE.mainMesh.quaternion);
      movement = xAxis.multiplyScalar(delta.dot(xAxis));
    } else if (STATE.grabbedGizmoAxis === 'y') {
      const yAxis = new THREE.Vector3(0, 1, 0);
      if (STATE.transform === 'LOCAL' && STATE.mainMesh) yAxis.applyQuaternion(STATE.mainMesh.quaternion);
      movement = yAxis.multiplyScalar(delta.dot(yAxis));
    } else if (STATE.grabbedGizmoAxis === 'z') {
      const zAxis = new THREE.Vector3(0, 0, 1);
      if (STATE.transform === 'LOCAL' && STATE.mainMesh) zAxis.applyQuaternion(STATE.mainMesh.quaternion);
      movement = zAxis.multiplyScalar(delta.dot(zAxis));
    }

    if (STATE.mode === 'EDIT' && STATE.selection.length > 0) {
      STATE.selection.forEach(el => {
        el.position.add(movement);
        if (el.userData.isVertex) updateVertexGeometry(el);
        else if (el.userData.isEdge) updateEdgeGeometry(el);
        else if (el.userData.isFace) updateFaceGeometry(el);
      });
    } else if (STATE.mode === 'OBJECT' && STATE.selected) {
      STATE.selected.position.add(movement);
    }

    STATE.controllerStartPos.copy(_tempVecA);
  }
}

    const idx = objects.indexOf(STATE.selected);

    STATE.selected = null;
    STATE.mainMesh = null;
    updateLog('✓ Objeto eliminado');
  } else {

  }
}
