    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ==========================================
// CONFIGURACIÓN GLOBAL
// ==========================================
let scene, camera, renderer;
let ctrlRight, ctrlLeft, gripLeft, gripRight;
let uiPanel, propertiesPanel, numericPanel;
const objects = [];

let selectorSphere;
const SELECTOR_RADIUS = 0.08;

const _tempVecA = new THREE.Vector3();
const _tempVecB = new THREE.Vector3();
const _tempVecC = new THREE.Vector3();
const _tempQuat = new THREE.Quaternion();
const _ray = new THREE.Raycaster();
const _mat = new THREE.Matrix4();

let gizmo = null;
let gizmoHandles = [];

// ESTADO PRINCIPAL
const STATE = {
    mode: 'OBJECT',
    editMode: 'VERTEX',
    tool: 'SELECT',
    transform: 'GLOBAL',
    shading: 'SOLID',
    
    selected: null,
    mainMesh: null,
    selection: [],
    
    hoveredBtn: null,
    grabbedElement: null,
    grabbedGizmoAxis: null,
    gizmoStartPos: new THREE.Vector3(),
    controllerStartPos: new THREE.Vector3(),
    
    menuVisible: false,
    propertiesVisible: false,
    numericInputActive: false,
    currentInputField: null,
    
    closestVertex: null,
    closestEdge: null,
    closestFace: null,
    
    vertexHelpers: [],
    edgeHelpers: [],
    faceHelpers: [],
    
    // Herramientas especiales
    knifeMode: false,
    knifePoints: [],
    loopCutPreview: null,
    
    colors: {
        selected: 0xffa500,
        vertex: 0x00ff00,
        edge: 0xff8800,
        face: 0x00aaff,
        highlight: 0xffff00,
        knife: 0xff00ff
    },
    
    // Configuración de operaciones
    extrudeAmount: 0.1,
    subdivisionLevel: 1,
    bevelAmount: 0.02,
    insetAmount: 0.8
};

const UI = {
    panel: null,
    buttons: [],
    propertiesPanel: null,
    numericPanel: null,
    numericButtons: [],
    inputFields: {}
};

init();

// ==========================================
// INICIALIZACIÓN
// ==========================================
function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);
    scene.fog = new THREE.Fog(0x1a1a1a, 5, 20);

    // Iluminación mejorada
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(5, 10, 7.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    scene.add(keyLight);
    
    const fillLight = new THREE.DirectionalLight(0x6699ff, 0.9);
    fillLight.position.set(-5, 5, -5);
    scene.add(fillLight);
    
    const rimLight = new THREE.DirectionalLight(0xff9966, 0.7);
    rimLight.position.set(0, 5, -10);
    scene.add(rimLight);
    
    scene.add(new THREE.AmbientLight(0x404060, 0.5));
    
    // Grid y ejes
    const gridHelper = new THREE.GridHelper(20, 40, 0x444444, 0x222222);
    scene.add(gridHelper);
    
    const axesHelper = new THREE.AxesHelper(1);
    axesHelper.position.set(-4, 0.01, -4);
    scene.add(axesHelper);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 100);
    camera.position.set(0, 1.6, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.xr.enabled = true;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    setupControllers();
    createGizmo();
    createUIPanel();
    createPropertiesPanel();
    createNumericPanel();

    document.getElementById('btn-start').addEventListener('click', () => {
        navigator.xr.requestSession('immersive-vr', { 
            optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] 
        }).then(session => {
            renderer.xr.setSession(session);
            document.getElementById('overlay').style.display = 'none';
            scene.background = null;
        });
    });

    // Teclas de atajo (para testing en navegador)
    window.addEventListener('keydown', handleKeyPress);

    renderer.setAnimationLoop(render);
}

// ==========================================
// CONTROLADORES VR
// ==========================================
function setupControllers() {
    const modelFactory = new XRControllerModelFactory();

    const c0 = renderer.xr.getController(0);
    const c1 = renderer.xr.getController(1);

    const onConnected = (e) => {
        const controller = e.target;
        const handedness = e.data.handedness;
        
        if (handedness === 'right') {
            ctrlRight = controller;
            
            const geo = new THREE.SphereGeometry(0.01, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0.8 });
            selectorSphere = new THREE.Mesh(geo, mat);
            selectorSphere.position.set(0, -0.015, -0.05);
            ctrlRight.add(selectorSphere);
            
            const lineGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -2)
            ]);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x2b7fdb, opacity: 0.3, transparent: true });
            const line = new THREE.Line(lineGeo, lineMat);
            ctrlRight.add(line);
            
            controller.addEventListener('selectstart', onRightTriggerStart);
            controller.addEventListener('selectend', onRightTriggerEnd);
            controller.addEventListener('squeezestart', onRightGripStart);
            controller.addEventListener('squeezeend', onRightGripEnd);
            
        } else if (handedness === 'left') {
            ctrlLeft = controller;
            
            controller.addEventListener('selectstart', onLeftTriggerStart);
            controller.addEventListener('squeezestart', toggleMenu);
        }
    };
    
    c0.addEventListener('connected', onConnected);
    c1.addEventListener('connected', onConnected);
    scene.add(c0, c1);

    gripLeft = renderer.xr.getControllerGrip(0);
    gripLeft.add(modelFactory.createControllerModel(gripLeft));
    scene.add(gripLeft);
    
    gripRight = renderer.xr.getControllerGrip(1);
    gripRight.add(modelFactory.createControllerModel(gripRight));
    scene.add(gripRight);
}

// ==========================================
// GIZMO MEJORADO
// ==========================================
function createGizmo() {
    gizmo = new THREE.Group();
    gizmo.visible = false;
    
    const size = 0.15;
    const thickness = 0.005;
    
    // Ejes
    const axes = [
        { color: 0xff0000, dir: new THREE.Vector3(1, 0, 0), axis: 'x' },
        { color: 0x00ff00, dir: new THREE.Vector3(0, 1, 0), axis: 'y' },
        { color: 0x0000ff, dir: new THREE.Vector3(0, 0, 1), axis: 'z' }
    ];
    
    axes.forEach(axisData => {
        const group = createGizmoAxis(axisData.color, axisData.dir, size, thickness);
        group.userData = { axis: axisData.axis, isGizmoHandle: true };
        gizmo.add(group);
        gizmoHandles.push(group);
    });
    
    // Centro libre
    const centerGeo = new THREE.SphereGeometry(0.02, 16, 16);
    const centerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
    const center = new THREE.Mesh(centerGeo, centerMat);
    center.userData = { axis: 'xyz', isGizmoHandle: true };
    gizmo.add(center);
    gizmoHandles.push(center);
    
    scene.add(gizmo);
}

function createGizmoAxis(color, direction, length, thickness) {
    const group = new THREE.Group();
    
    // Línea del eje
    const lineGeo = new THREE.CylinderGeometry(thickness, thickness, length, 8);
    const lineMat = new THREE.MeshBasicMaterial({ color: color });
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.position.copy(direction.clone().multiplyScalar(length / 2));
    line.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
    group.add(line);
    
    // Punta
    const coneGeo = new THREE.ConeGeometry(0.015, 0.04, 12);
    const coneMat = new THREE.MeshBasicMaterial({ color: color });
    const cone = new THREE.Mesh(coneGeo, coneMat);
    cone.position.copy(direction.clone().multiplyScalar(length));
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
    group.add(cone);
    
    // Plano de arrastre (invisible)
    const planeGeo = new THREE.PlaneGeometry(length * 1.5, length * 1.5);
    const planeMat = new THREE.MeshBasicMaterial({ visible: false });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.position.copy(direction.clone().multiplyScalar(length / 2));
    
    // Orientar plano perpendicular al eje
    if (direction.x !== 0) {
        plane.rotation.y = Math.PI / 2;
    } else if (direction.z !== 0) {
        plane.rotation.y = 0;
    }
    
    group.add(plane);
    
    return group;
}

function updateGizmoPosition() {
    if (!gizmo.visible || (!STATE.selected && STATE.selection.length === 0)) return;
    
    if (STATE.mode === 'EDIT' && STATE.selection.length > 0) {
        const center = new THREE.Vector3();
        STATE.selection.forEach(el => {
            el.getWorldPosition(_tempVecA);
            center.add(_tempVecA);
        });
        center.divideScalar(STATE.selection.length);
        gizmo.position.copy(center);
        
        // Orientación
        if (STATE.transform === 'LOCAL' && STATE.mainMesh) {
            STATE.mainMesh.getWorldQuaternion(_tempQuat);
            gizmo.quaternion.copy(_tempQuat);
        } else if (STATE.transform === 'NORMAL' && STATE.selection[0] && STATE.selection[0].userData.normal) {
            gizmo.quaternion.setFromUnitVectors(
                new THREE.Vector3(0, 1, 0),
                STATE.selection[0].userData.normal
            );
        } else {
            gizmo.quaternion.identity();
        }
        
    } else if (STATE.mode === 'OBJECT' && STATE.selected) {
        STATE.selected.getWorldPosition(_tempVecA);
        gizmo.position.copy(_tempVecA);
        
        if (STATE.transform === 'LOCAL') {
            STATE.selected.getWorldQuaternion(_tempQuat);
            gizmo.quaternion.copy(_tempQuat);
        } else {
            gizmo.quaternion.identity();
        }
    }
}

function showGizmo(visible) {
    gizmo.visible = visible && (STATE.tool === 'MOVE' || STATE.tool === 'ROTATE' || STATE.tool === 'SCALE');
    if (visible) updateGizmoPosition();
}

// ==========================================
// UI PANEL PRINCIPAL
// ==========================================
function createUIPanel() {
    UI.panel = new THREE.Group();
    UI.panel.visible = false;
    
    const width = 0.40;
    const height = 0.55;
    
    const bgGeo = new THREE.PlaneGeometry(width, height);
    const bgMat = new THREE.MeshStandardMaterial({ 
        color: 0x1a1a1a, 
        transparent: true, 
        opacity: 0.95,
        roughness: 0.8,
        metalness: 0.2
    });
    const bg = new THREE.Mesh(bgGeo, bgMat);
    UI.panel.add(bg);
    
    const borderGeo = new THREE.EdgesGeometry(bgGeo);
    const borderMat = new THREE.LineBasicMaterial({ color: 0x2b7fdb, linewidth: 3 });
    const border = new THREE.LineSegments(borderGeo, borderMat);
    border.position.z = 0.001;
    UI.panel.add(border);
    
    const headerGeo = new THREE.PlaneGeometry(width, 0.06);
    const headerMat = new THREE.MeshBasicMaterial({ color: 0x2b7fdb, transparent: true, opacity: 0.9 });
    const header = new THREE.Mesh(headerGeo, headerMat);
    header.position.y = (height / 2) - 0.03;
    header.position.z = 0.002;
    UI.panel.add(header);
    
    createMainMenu();
    
    scene.add(UI.panel);
}

function createMainMenu() {
    clearUIButtons();
    
    const startY = 0.22;
    const spacing = 0.07;
    let y = startY;
    
    // MODOS
    createMenuSection('MODOS', y, 0.38); y -= 0.045;
    createIconButton('🎯', 'OBJECT', -0.14, y, () => switchToMode('OBJECT'), STATE.mode === 'OBJECT');
    createIconButton('✏️', 'EDIT', -0.04, y, () => switchToMode('EDIT'), STATE.mode === 'EDIT');
    y -= spacing;
    
    // CREAR
    createMenuSection('CREAR', y, 0.38); y -= 0.045;
    createIconButton('📦', 'Cubo', -0.14, y, () => spawnObject('box'));
    createIconButton('⚪', 'Esfera', -0.04, y, () => spawnObject('sphere'));
    createIconButton('🔵', 'Cilindro', 0.06, y, () => spawnObject('cylinder'));
    createIconButton('🍩', 'Torus', 0.16, y, () => spawnObject('torus'));
    y -= spacing;
    
    // VISUALIZACIÓN
    createMenuSection('VISUALIZACIÓN', y, 0.38); y -= 0.045;
    createIconButton('🎨', 'Solid', -0.14, y, () => setShading('SOLID'), STATE.shading === 'SOLID');
    createIconButton('🔲', 'Wire', -0.04, y, () => setShading('WIREFRAME'), STATE.shading === 'WIREFRAME');
    createIconButton('💎', 'Material', 0.06, y, () => setShading('MATERIAL'), STATE.shading === 'MATERIAL');
    createIconButton('🌟', 'Render', 0.16, y, () => setShading('RENDERED'), STATE.shading === 'RENDERED');
    y -= spacing;
    
    // TRANSFORMACIÓN
    createMenuSection('TRANSFORMACIÓN', y, 0.38); y -= 0.045;

    createIconButton('📍', 'Local', 0.01, y, () => setTransform('LOCAL'), STATE.transform === 'LOCAL');
    createIconButton('📐', 'Normal', 0.11, y, () => setTransform('NORMAL'), STATE.transform === 'NORMAL');

    createIconButton('👆', 'Select', -0.14, y, () => setTool('SELECT'), STATE.tool === 'SELECT');
    createIconButton('↔️', 'Move', -0.04, y, () => setTool('MOVE'), STATE.tool === 'MOVE');
    createIconButton('🔄', 'Rotate', 0.06, y, () => setTool('ROTATE'), STATE.tool === 'ROTATE');

    createIconButton('💾', 'Guardar', 0.06, y, saveScene);
    createIconButton('📂', 'Cargar', 0.16, y, loadScene);
}

function createEditMenu() {
    clearUIButtons();
    
    const startY = 0.22;
    const spacing = 0.07;
    let y = startY;
    
    createMenuSection('MODO EDICIÓN', y, 0.38); y -= 0.045;
    createIconButton('•', 'Vértice', -0.09, y, () => setEditMode('VERTEX'), STATE.editMode === 'VERTEX');
    createIconButton('—', 'Arista', 0.01, y, () => setEditMode('EDGE'), STATE.editMode === 'EDGE');
    createIconButton('▢', 'Cara', 0.11, y, () => setEditMode('FACE'), STATE.editMode === 'FACE');
    y -= spacing;
    
    createMenuSection('OPERACIONES', y, 0.38); y -= 0.045;
    createIconButton('➕', 'Extruir', -0.14, y, extrudeSelection);
    createIconButton('🔗', 'Merge', -0.04, y, mergeVertices);
    createIconButton('🌉', 'Puente', 0.06, y, bridgeEdges);
    createIconButton('✂️', 'Subdiv', 0.16, y, subdivideSelection);
    y -= spacing;
    
    createMenuSection('AVANZADO', y, 0.38); y -= 0.045;
    createIconButton('🔄', 'Loop', -0.14, y, insertLoopCut);
    createIconButton('🔪', 'Knife', -0.04, y, activateKnifeTool);
    createIconButton('📏', 'Inset', 0.06, y, insetFaces);
    createIconButton('🔷', 'Bevel', 0.16, y, bevelSelection);
    y -= spacing;
    
    createMenuSection('UTILIDADES', y, 0.38); y -= 0.045;
    createIconButton('🔢', 'Números', -0.14, y, toggleNumericPanel);
    createIconButton('🗑️', 'Delete', -0.04, y, deleteSelected);
    createIconButton('⬅️', 'Volver', 0.06, y, () => switchToMode('OBJECT'));
}

function createMenuSection(title, y, width) {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#0f0f0f';
    ctx.fillRect(0, 0, 512, 64);
    
    ctx.fillStyle = '#2b7fdb';
    ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(title, 10, 40);
    
    const texture = new THREE.CanvasTexture(canvas);
    const geo = new THREE.PlaneGeometry(width, 0.035);
    const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, y, 0.003);
    
    UI.panel.add(mesh);
}

function createIconButton(icon, label, x, y, callback, active = false) {
    const size = 0.06;
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;
    const ctx = canvas.getContext('2d');
    
    // Fondo
    const gradient = ctx.createLinearGradient(0, 0, 0, 128);
    if (active) {
        gradient.addColorStop(0, '#2b7fdb');
        gradient.addColorStop(1, '#1a5fa0');
    } else {
        gradient.addColorStop(0, '#3a3a3a');
        gradient.addColorStop(1, '#2a2a2a');
    }
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 128, 128);
    
    // Borde
    ctx.strokeStyle = active ? '#ffffff' : '#555555';
    ctx.lineWidth = active ? 4 : 2;
    ctx.strokeRect(2, 2, 124, 124);
    
    // Icono
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 52px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icon, 64, 48);
    
    // Label
    ctx.font = 'bold 14px Arial';
    ctx.fillText(label, 64, 100);
    
    const texture = new THREE.CanvasTexture(canvas);
    const geo = new THREE.PlaneGeometry(size, size);
    const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
    const btn = new THREE.Mesh(geo, mat);
    btn.position.set(x, y, 0.004);
    
    btn.userData = {
        isButton: true,
        action: callback,
        label: label
    };
    
    UI.panel.add(btn);
    UI.buttons.push(btn);
    
    return btn;
}

function clearUIButtons() {
    UI.buttons.forEach(btn => {
        if (UI.panel.children.includes(btn)) {
            UI.panel.remove(btn);
        }
    });
    UI.buttons = [];
}

// PANEL DE PROPIEDADES
// ==========================================
function createPropertiesPanel() {
    UI.propertiesPanel = new THREE.Group();
    UI.propertiesPanel.visible = false;
    
    const width = 0.30;
    const height = 0.35;
    
    const bgGeo = new THREE.PlaneGeometry(width, height);
    const bgMat = new THREE.MeshStandardMaterial({ 
        color: 0x0f0f0f, 
        transparent: true, 
        opacity: 0.95,
        roughness: 0.8
    });
    const bg = new THREE.Mesh(bgGeo, bgMat);
    UI.propertiesPanel.add(bg);
    
    const borderGeo = new THREE.EdgesGeometry(bgGeo);
    const borderMat = new THREE.LineBasicMaterial({ color: 0xffa500, linewidth: 2 });
    const border = new THREE.LineSegments(borderGeo, borderMat);
    border.position.z = 0.001;
    UI.propertiesPanel.add(border);
    
    // Header
    const headerCanvas = document.createElement('canvas');

// EVENTOS DE INTERACCIÓN
// ==========================================
function onRightTriggerStart() {
    // UI
    if ((STATE.menuVisible || STATE.numericInputActive) && checkUIInteraction()) {
        return;
    }
    
    // Gizmo
    if (gizmo.visible && checkGizmoInteraction()) {
        return;
    }
    
    // Knife tool
    if (STATE.knifeMode) {
        addKnifePoint();
        return;
    }
    
    // Selección
    if (STATE.mode === 'OBJECT') {
        selectObjectRaycast();
    } else if (STATE.mode === 'EDIT') {
        if (STATE.editMode === 'VERTEX' && STATE.closestVertex) {
            toggleSelection(STATE.closestVertex);
        } else if (STATE.editMode === 'EDGE' && STATE.closestEdge) {
            toggleSelection(STATE.closestEdge);
        } else if (STATE.editMode === 'FACE' && STATE.closestFace) {
            toggleSelection(STATE.closestFace);
        }
    }
}

function onRightTriggerEnd() {
    if (STATE.grabbedGizmoAxis) {
        STATE.grabbedGizmoAxis = null;
    }
}

function onRightGripStart() {
    if (STATE.mode === 'EDIT') {
        if (STATE.editMode === 'VERTEX' && STATE.closestVertex) {
            STATE.grabbedElement = STATE.closestVertex;
            gripRight.attach(STATE.grabbedElement);
        } else if (STATE.editMode === 'EDGE' && STATE.closestEdge) {
            STATE.grabbedElement = STATE.closestEdge;
            gripRight.attach(STATE.grabbedElement);
        } else if (STATE.editMode === 'FACE' && STATE.closestFace) {
            STATE.grabbedElement = STATE.closestFace;
            gripRight.attach(STATE.grabbedElement);
        }
    } else if (STATE.mode === 'OBJECT' && STATE.selected) {
        STATE.grabbedElement = STATE.selected;
        gripRight.attach(STATE.grabbedElement);
    }
}

function onRightGripEnd() {
    if (STATE.grabbedElement) {
        if (STATE.grabbedElement.userData.isVertex) {
            const vertex = STATE.grabbedElement;
            const mesh = vertex.userData.parentMesh;
            mesh.attach(vertex);
            updateVertexGeometry(vertex);
        } else if (STATE.grabbedElement.userData.isEdge) {
            const edge = STATE.grabbedElement;
            const mesh = edge.userData.parentMesh;
            mesh.attach(edge);
            updateEdgeGeometry(edge);
        } else if (STATE.grabbedElement.userData.isFace) {
            const face = STATE.grabbedElement;
            const mesh = face.userData.parentMesh;
            mesh.attach(face);
            updateFaceGeometry(face);
        } else {
            scene.attach(STATE.grabbedElement);
        }
        
        STATE.grabbedElement = null;
    }
}

function onLeftTriggerStart() {
    // Funcionalidad futura
}

function checkUIInteraction() {
    if (!ctrlRight) return false;
    
    _mat.identity().extractRotation(ctrlRight.matrixWorld);
    _ray.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
    _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat);
    
    const allButtons = [...UI.buttons, ...UI.numericButtons];
    const hits = _ray.intersectObjects(allButtons, false);
    
    if (hits.length > 0) {
        const btn = hits[0].object;
        if (btn.userData.action) {
            btn.userData.action();
            animateButtonPress(btn);
            return true;
        }
    }
    
    return false;
}

function animateButtonPress(btn) {
    const originalZ = btn.position.z;
    btn.position.z -= 0.005;
    setTimeout(() => { btn.position.z = originalZ; }, 120);
}

function checkGizmoInteraction() {
    if (!ctrlRight) return false;
    
    _mat.identity().extractRotation(ctrlRight.matrixWorld);
    _ray.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
    _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat);
    
    const hits = _ray.intersectObjects(gizmoHandles, true);
    
    if (hits.length > 0) {
        let parent = hits[0].object;
        while (parent.parent && !parent.userData.axis) {
            parent = parent.parent;
        }
        
        if (parent.userData.axis) {
            STATE.grabbedGizmoAxis = parent.userData.axis;
            gizmo.getWorldPosition(STATE.gizmoStartPos);
            ctrlRight.getWorldPosition(STATE.controllerStartPos);
            return true;
        }
    }
    
    return false;
}

function handleKeyPress(event) {
    // Atajos de teclado (para testing en navegador)
    switch(event.key.toLowerCase()) {
        case 'g': setTool('MOVE'); break;
        case 'r': setTool('ROTATE'); break;
        case 's': setTool('SCALE'); break;
        case 'tab': event.preventDefault(); switchToMode(STATE.mode === 'OBJECT' ? 'EDIT' : 'OBJECT'); break;
        case 'e': if (STATE.mode === 'EDIT') extrudeSelection(); break;
        case 'x': case 'delete': deleteSelected(); break;
        case '1': if (STATE.mode === 'EDIT') setEditMode('VERTEX'); break;
        case '2': if (STATE.mode === 'EDIT') setEditMode('EDGE'); break;
        case '3': if (STATE.mode === 'EDIT') setEditMode('FACE'); break;
        case 'z': if (event.ctrlKey) undoAction(); break;
    }
}

            } else if (STATE.editMode === 'EDGE') {

function spawnObject(type) {
    let geo;
    
    switch(type) {
        case 'box': 
            geo = new THREE.BoxGeometry(0.2, 0.2, 0.2, 2, 2, 2); 
            break;
        case 'sphere': 
            geo = new THREE.SphereGeometry(0.12, 32, 24); 
            break;
        case 'cylinder': 
            geo = new THREE.CylinderGeometry(0.08, 0.08, 0.25, 32); 
            break;
        case 'torus': 
            geo = new THREE.TorusGeometry(0.1, 0.04, 24, 48); 
            break;
        default: 
            geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    }
    
    const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
        roughness: 0.5,
        metalness: 0.2
    });
    
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.name = `${type}_${objects.length + 1}`;
    
    camera.getWorldPosition(_tempVecA);
    camera.getWorldQuaternion(_tempQuat);
    
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(_tempQuat);
    mesh.position.copy(_tempVecA).add(forward.multiplyScalar(0.6));
    mesh.position.y = Math.max(mesh.position.y, 0.15);
    
    scene.add(mesh);
    objects.push(mesh);
    
    selectObject(mesh);
    updateLog(`✓ Creado: ${mesh.name}`);
}

    if (STATE.selected && !STATE.selected.userData.isVertex && !STATE.selected.userData.isEdge && !STATE.selected.userData.isFace) {

        obj.material.emissive.setHex(STATE.colors.selected);

        showGizmo(STATE.tool !== 'SELECT');

    _ray.ray.origin.setFromMatrixPosition(ctrlRight.matrixWorld);
    _ray.ray.direction.set(0, 0, -1).applyMatrix4(_mat);

function toggleSelection(element) {

        element.material.color.setHex(STATE.colors.highlight);
        element.scale.set(1.6, 1.6, 1.6);

function resetElementColor(element) {
    if (element.userData.isVertex) {
        element.material.color.setHex(STATE.colors.vertex);

    } else if (element.userData.isEdge) {
        element.material.color.setHex(STATE.colors.edge);

    } else if (element.userData.isFace) {
        element.material.color.setHex(STATE.colors.face);

// ==========================================
// HELPERS DE EDICIÓN
// ==========================================
function createVertexHelpers() {
    const mesh = STATE.mainMesh;
    const posAttr = mesh.geometry.attributes.position;
    
    const uniqueVertices = new Map();
    
    for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const y = posAttr.getY(i);
        const z = posAttr.getZ(i);
        const key = `${x.toFixed(4)}_${y.toFixed(4)}_${z.toFixed(4)}`;
        
        if (!uniqueVertices.has(key)) {
            uniqueVertices.set(key, []);
        }
        uniqueVertices.get(key).push(i);
    }
    
    uniqueVertices.forEach((indices, key) => {
        const v = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);
        
        const geo = new THREE.SphereGeometry(0.012, 12, 12);
        const mat = new THREE.MeshBasicMaterial({ color: STATE.colors.vertex });
        const helper = new THREE.Mesh(geo, mat);
        
        helper.position.copy(v);
        helper.userData = {
            isVertex: true,
            indices: indices,
            parentMesh: mesh
        };
        
        mesh.add(helper);
        STATE.vertexHelpers.push(helper);
    });
}

function createEdgeHelpers() {
    const mesh = STATE.mainMesh;
    const posAttr = mesh.geometry.attributes.position;
    const edges = new Map();
    
    const index = mesh.geometry.index;
    const triangleCount = index ? index.count / 3 : posAttr.count / 3;
    
    for (let i = 0; i < triangleCount; i++) {
        const i0 = index ? index.getX(i * 3) : i * 3;
        const i1 = index ? index.getX(i * 3 + 1) : i * 3 + 1;
        const i2 = index ? index.getX(i * 3 + 2) : i * 3 + 2;
        
        addEdge(edges, i0, i1, posAttr);
        addEdge(edges, i1, i2, posAttr);
        addEdge(edges, i2, i0, posAttr);
    }
    
    edges.forEach(edgeData => {
        const helper = createEdgeHelper(edgeData, mesh);
        mesh.add(helper);
        STATE.edgeHelpers.push(helper);
    });
}

function addEdge(edges, idx1, idx2, posAttr) {
    const key = idx1 < idx2 ? `${idx1}-${idx2}` : `${idx2}-${idx1}`;
    
    if (!edges.has(key)) {
        const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, idx1);
        const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, idx2);
        edges.set(key, { v1, v2, indices: [idx1, idx2] });
    }
}

function createEdgeHelper(edgeData, mesh) {
    const { v1, v2, indices } = edgeData;
    const midpoint = v1.clone().add(v2).multiplyScalar(0.5);
    const length = v1.distanceTo(v2);
    
    const geo = new THREE.CylinderGeometry(0.008, 0.008, length, 8);
    const mat = new THREE.MeshBasicMaterial({ color: STATE.colors.edge });
    const helper = new THREE.Mesh(geo, mat);
    
    helper.position.copy(midpoint);
    
    const direction = v2.clone().sub(v1).normalize();
    helper.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
    
    helper.userData = {
        isEdge: true,
        indices: indices,
        v1: v1.clone(),
        v2: v2.clone(),
        parentMesh: mesh
    };
    
    return helper;
}

function createFaceHelpers() {
    const mesh = STATE.mainMesh;
    const posAttr = mesh.geometry.attributes.position;
    const index = mesh.geometry.index;
    const triangleCount = index ? index.count / 3 : posAttr.count / 3;
    
    for (let i = 0; i < triangleCount; i++) {
        const i0 = index ? index.getX(i * 3) : i * 3;
        const i1 = index ? index.getX(i * 3 + 1) : i * 3 + 1;
        const i2 = index ? index.getX(i * 3 + 2) : i * 3 + 2;
        
        const v0 = new THREE.Vector3().fromBufferAttribute(posAttr, i0);
        const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, i1);
        const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, i2);
        
        const helper = createFaceHelper(v0, v1, v2, [i0, i1, i2], mesh);
        mesh.add(helper);
        STATE.faceHelpers.push(helper);
    }
}

function createFaceHelper(v0, v1, v2, indices, mesh) {
    const center = v0.clone().add(v1).add(v2).divideScalar(3);
    
    const geo = new THREE.CircleGeometry(0.025, 12);
    const mat = new THREE.MeshBasicMaterial({ 
        color: STATE.colors.face,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.7
    });
    const helper = new THREE.Mesh(geo, mat);
    
    helper.position.copy(center);
    
    const edge1 = v1.clone().sub(v0);
    const edge2 = v2.clone().sub(v0);
    const normal = edge1.cross(edge2).normalize();
    helper.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
    
    helper.userData = {
        isFace: true,
        indices: indices,
        vertices: [v0.clone(), v1.clone(), v2.clone()],
        normal: normal,
        parentMesh: mesh
    };
    
    return helper;
}

function clearAllHelpers() {
    if (STATE.mainMesh) {
        STATE.vertexHelpers.forEach(h => STATE.mainMesh.remove(h));
        STATE.edgeHelpers.forEach(h => STATE.mainMesh.remove(h));
        STATE.faceHelpers.forEach(h => STATE.mainMesh.remove(h));
    }
    
    STATE.vertexHelpers = [];
    STATE.edgeHelpers = [];
    STATE.faceHelpers = [];
}

// ==========================================
// ACTUALIZACIÓN DE GEOMETRÍA
// ==========================================
function updateVertexGeometry(vertex) {
    const mesh = vertex.userData.parentMesh;
    const posAttr = mesh.geometry.attributes.position;
    const indices = vertex.userData.indices;
    const newPos = vertex.position;
    
    indices.forEach(idx => {
        posAttr.setXYZ(idx, newPos.x, newPos.y, newPos.z);
    });
    
    posAttr.needsUpdate = true;
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
    
    updateRelatedHelpers();
}

function updateEdgeGeometry(edge) {
    const mesh = edge.userData.parentMesh;
    const posAttr = mesh.geometry.attributes.position;
    const indices = edge.userData.indices;
    
    const worldPos = new THREE.Vector3();
    edge.getWorldPosition(worldPos);
    mesh.worldToLocal(worldPos);
    
    const v1Original = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);
    const v2Original = new THREE.Vector3().fromBufferAttribute(posAttr, indices[1]);
    const originalMidpoint = v1Original.clone().add(v2Original).multiplyScalar(0.5);
    const offset = worldPos.sub(originalMidpoint);
    
    v1Original.add(offset);
    v2Original.add(offset);
    
    posAttr.setXYZ(indices[0], v1Original.x, v1Original.y, v1Original.z);
    posAttr.setXYZ(indices[1], v2Original.x, v2Original.y, v2Original.z);
    
    posAttr.needsUpdate = true;
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
    
    updateRelatedHelpers();
}

function updateFaceGeometry(face) {
    const mesh = face.userData.parentMesh;
    const posAttr = mesh.geometry.attributes.position;
    const indices = face.userData.indices;
    
    const worldPos = new THREE.Vector3();
    face.getWorldPosition(worldPos);
    mesh.worldToLocal(worldPos);
    
    const v0 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);
    const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[1]);
    const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[2]);
    const originalCenter = v0.clone().add(v1).add(v2).divideScalar(3);
    
    const offset = worldPos.sub(originalCenter);
    
    v0.add(offset);
    v1.add(offset);
    v2.add(offset);
    
    posAttr.setXYZ(indices[0], v0.x, v0.y, v0.z);
    posAttr.setXYZ(indices[1], v1.x, v1.y, v1.z);
    posAttr.setXYZ(indices[2], v2.x, v2.y, v2.z);
    
    posAttr.needsUpdate = true;
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
    
    updateRelatedHelpers();
}

function updateRelatedHelpers() {
    if (STATE.editMode === 'EDGE' && STATE.edgeHelpers.length > 0) {
        const mesh = STATE.mainMesh;
        const posAttr = mesh.geometry.attributes.position;
        
        STATE.edgeHelpers.forEach(edge => {
            const indices = edge.userData.indices;
            const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);
            const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[1]);
            const midpoint = v1.clone().add(v2).multiplyScalar(0.5);
            const length = v1.distanceTo(v2);
            
            edge.position.copy(midpoint);
            
            const baseLength = 0.008;
            edge.scale.y = length / baseLength;
            
            const direction = v2.clone().sub(v1).normalize();
            edge.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            
            edge.userData.v1 = v1.clone();
            edge.userData.v2 = v2.clone();
        });
    }
    
    if (STATE.editMode === 'FACE' && STATE.faceHelpers.length > 0) {
        const mesh = STATE.mainMesh;
        const posAttr = mesh.geometry.attributes.position;
        
        STATE.faceHelpers.forEach(face => {
            const indices = face.userData.indices;
            const v0 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);
            const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[1]);
            const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[2]);
            const center = v0.clone().add(v1).add(v2).divideScalar(3);
            
            face.position.copy(center);
            
            const edge1 = v1.clone().sub(v0);
            const edge2 = v2.clone().sub(v0);
            const normal = edge1.cross(edge2).normalize();
            face.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
            
            face.userData.vertices = [v0.clone(), v1.clone(), v2.clone()];
            face.userData.normal = normal;
        });
    }
}

function checkVertexProximity() {
    if (!selectorSphere || STATE.vertexHelpers.length === 0) return;
    
    selectorSphere.getWorldPosition(_tempVecA);
    let minDist = SELECTOR_RADIUS;
    let closest = null;
    
    for (let vertex of STATE.vertexHelpers) {
        vertex.getWorldPosition(_tempVecB);
        const dist = _tempVecA.distanceTo(_tempVecB);
        
        if (dist < minDist) {
            minDist = dist;
            closest = vertex;
        }
    }
    
    if (closest !== STATE.closestVertex) {
        if (STATE.closestVertex && !STATE.selection.includes(STATE.closestVertex)) {
            STATE.closestVertex.material.color.setHex(STATE.colors.vertex);
            STATE.closestVertex.scale.set(1, 1, 1);

            closest.material.color.setHex(STATE.colors.highlight);
            closest.scale.set(1.4, 1.4, 1.4);
        }
        
        STATE.closestVertex = closest;
    }
}

// ==========================================
// SHADING Y VISUALIZACIÓN
// ==========================================
function setShading(mode) {
    STATE.shading = mode;
    
    objects.forEach(obj => {
        if (obj === STATE.mainMesh && STATE.mode === 'EDIT') return;
        applyShading(obj, mode);
    });
    
    if (STATE.mainMesh && STATE.mode === 'EDIT') {
        applyEditModeShading();
    }
    
    updateLog(`🎨 Shading: ${mode}`);
}

function applyShading(mesh, mode) {
    const material = mesh.material;
    
    switch(mode) {
        case 'SOLID':
            material.wireframe = false;
            material.flatShading = false;
            material.roughness = 0.5;
            material.metalness = 0.2;
            break;
            
        case 'WIREFRAME':
            material.wireframe = true;
            material.wireframeLinewidth = 1;
            break;
            
        case 'MATERIAL':
            material.wireframe = false;
            material.flatShading = false;
            material.roughness = 0.3;
            material.metalness = 0.5;
            break;
            
        case 'RENDERED':
            material.wireframe = false;
            material.flatShading = false;
            material.roughness = 0.2;
            material.metalness = 0.8;
            break;
    }
    
    material.needsUpdate = true;
}

function applyEditModeShading() {
    if (!STATE.mainMesh) return;
    
    const material = STATE.mainMesh.material;
    material.wireframe = false;
    material.transparent = true;
    material.opacity = 0.75;
    material.flatShading = true;
    material.needsUpdate = true;
}

function restoreOriginalShading() {
    if (!STATE.mainMesh) return;
    
    const material = STATE.mainMesh.material;
    material.transparent = false;
    material.opacity = 1.0;
    applyShading(STATE.mainMesh, STATE.shading);
}

// TRANSFORMACIÓN
// ==========================================
function setTransform(mode) {
    STATE.transform = mode;
    updateGizmoPosition();
    updateLog(`🔧 Transform: ${mode}`);
}

function setTool(tool) {
    STATE.tool = tool;
    showGizmo(tool !== 'SELECT');
    updateLog(`🔨 Herramienta: ${tool}`);
}

function applyGizmoTransform() {
    if (!STATE.grabbedGizmoAxis || !ctrlRight) return;
    
    ctrlRight.getWorldPosition(_tempVecA);
    
    const delta = _tempVecA.clone().sub(STATE.controllerStartPos);
    
    if (STATE.tool === 'MOVE') {
        let movement = delta.clone();
        
        // Restringir movimiento al eje seleccionado
        if (STATE.grabbedGizmoAxis === 'x') {
            const xAxis = new THREE.Vector3(1, 0, 0);
            if (STATE.transform === 'LOCAL' && STATE.mainMesh) {
                xAxis.applyQuaternion(STATE.mainMesh.quaternion);
            }
            movement = xAxis.multiplyScalar(delta.dot(xAxis));
        } else if (STATE.grabbedGizmoAxis === 'y') {
            const yAxis = new THREE.Vector3(0, 1, 0);
            if (STATE.transform === 'LOCAL' && STATE.mainMesh) {
                yAxis.applyQuaternion(STATE.mainMesh.quaternion);
            }
            movement = yAxis.multiplyScalar(delta.dot(yAxis));
        } else if (STATE.grabbedGizmoAxis === 'z') {
            const zAxis = new THREE.Vector3(0, 0, 1);
            if (STATE.transform === 'LOCAL' && STATE.mainMesh) {
                zAxis.applyQuaternion(STATE.mainMesh.quaternion);
            }
            movement = zAxis.multiplyScalar(delta.dot(zAxis));
        }
        
        if (STATE.mode === 'EDIT' && STATE.selection.length > 0) {
            STATE.selection.forEach(el => {
                el.position.add(movement);
                if (el.userData.isVertex) updateVertexGeometry(el);
                else if (el.userData.isEdge) updateEdgeGeometry(el);
                else if (el.userData.isFace) updateFaceGeometry(el);
            });
        } else if (STATE.mode === 'OBJECT' && STATE.selected) {
            STATE.selected.position.add(movement);
        }
        
        STATE.controllerStartPos.copy(_tempVecA);
    }
}

// OPERACIONES DE MODELADO
// ==========================================
function mergeVertices() {
    if (STATE.selection.length < 2 || !STATE.selection[0].userData.isVertex) {
        updateLog('⚠️ Selecciona 2+ vértices');
        return;
    }
    
    const mesh = STATE.selection[0].userData.parentMesh;
    const posAttr = mesh.geometry.attributes.position;
    
    const center = new THREE.Vector3();
    STATE.selection.forEach(v => center.add(v.position));
    center.divideScalar(STATE.selection.length);
    
    STATE.selection.forEach(v => {
        v.position.copy(center);
        updateVertexGeometry(v);
    });
    
    clearSelection();
    setEditMode('VERTEX');
    updateLog(`✓ ${STATE.selection.length} vértices unidos`);
}

function extrudeSelection() {
    if (STATE.selection.length === 0) {
        updateLog('⚠️ Selecciona elementos');
        return;
    }
    
    if (STATE.editMode === 'FACE') {
        extrudeFaces();
    } else if (STATE.editMode === 'EDGE') {
        extrudeEdges();
    } else {
        updateLog('⚠️ Solo para caras o aristas');
    }
}

function extrudeFaces() {
    if (STATE.selection.length === 0 || !STATE.selection[0].userData.isFace) {
        updateLog('⚠️ Selecciona caras');
        return;
    }
    
    const mesh = STATE.mainMesh;
    const posAttr = mesh.geometry.attributes.position;
    const newPositions = Array.from(posAttr.array);
    const startIdx = posAttr.count;
    
    STATE.selection.forEach(face => {
        const indices = face.userData.indices;
        const v0 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);
        const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[1]);
        const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[2]);
        
        const edge1 = v1.clone().sub(v0);
        const edge2 = v2.clone().sub(v0);
        const normal = edge1.cross(edge2).normalize();
        const offset = normal.multiplyScalar(STATE.extrudeAmount);
        
        const nv0 = v0.clone().add(offset);
        const nv1 = v1.clone().add(offset);
        const nv2 = v2.clone().add(offset);
        
        // Cara superior extruida
        newPositions.push(nv0.x, nv0.y, nv0.z);
        newPositions.push(nv1.x, nv1.y, nv1.z);
        newPositions.push(nv2.x, nv2.y, nv2.z);
        
        // Caras laterales
        // Lado v0-v1
        newPositions.push(v0.x, v0.y, v0.z, v1.x, v1.y, v1.z, nv0.x, nv0.y, nv0.z);
        newPositions.push(v1.x, v1.y, v1.z, nv1.x, nv1.y, nv1.z, nv0.x, nv0.y, nv0.z);
        
        // Lado v1-v2
        newPositions.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z, nv1.x, nv1.y, nv1.z);
        newPositions.push(v2.x, v2.y, v2.z, nv2.x, nv2.y, nv2.z, nv1.x, nv1.y, nv1.z);
        
        // Lado v2-v0
        newPositions.push(v2.x, v2.y, v2.z, v0.x, v0.y, v0.z, nv2.x, nv2.y, nv2.z);
        newPositions.push(v0.x, v0.y, v0.z, nv0.x, nv0.y, nv0.z, nv2.x, nv2.y, nv2.z);
    });
    
    mesh.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(newPositions), 3));
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
    
    clearSelection();
    setEditMode('FACE');
    updateLog(`✓ ${STATE.selection.length} caras extruidas`);
}

function extrudeEdges() {
    if (STATE.selection.length === 0 || !STATE.selection[0].userData.isEdge) {
        updateLog('⚠️ Selecciona aristas');
        return;
    }
    
    const mesh = STATE.mainMesh;
    const posAttr = mesh.geometry.attributes.position;
    const newPositions = Array.from(posAttr.array);
    
    STATE.selection.forEach(edge => {
        const indices = edge.userData.indices;
        const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);
        const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[1]);
        
        const direction = v2.clone().sub(v1).cross(new THREE.Vector3(0, 1, 0)).normalize();
        const offset = direction.multiplyScalar(STATE.extrudeAmount);
        
        const nv1 = v1.clone().add(offset);
        const nv2 = v2.clone().add(offset);
        
        // Crear quad (2 triángulos)
        newPositions.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z, nv1.x, nv1.y, nv1.z);
        newPositions.push(v2.x, v2.y, v2.z, nv2.x, nv2.y, nv2.z, nv1.x, nv1.y, nv1.z);
    });
    
    mesh.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(newPositions), 3));
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
    
    clearSelection();
    setEditMode('EDGE');
    updateLog(`✓ ${STATE.selection.length} aristas extruidas`);
}

function bridgeEdges() {
    if (STATE.selection.length !== 2 || !STATE.selection[0].userData.isEdge) {
        updateLog('⚠️ Selecciona exactamente 2 aristas');
        return;
    }
    
    const mesh = STATE.mainMesh;
    const posAttr = mesh.geometry.attributes.position;
    const newPositions = Array.from(posAttr.array);
    
    const edge1 = STATE.selection[0];
    const edge2 = STATE.selection[1];
    
    const v1a = new THREE.Vector3().fromBufferAttribute(posAttr, edge1.userData.indices[0]);
    const v1b = new THREE.Vector3().fromBufferAttribute(posAttr, edge1.userData.indices[1]);
    const v2a = new THREE.Vector3().fromBufferAttribute(posAttr, edge2.userData.indices[0]);
    const v2b = new THREE.Vector3().fromBufferAttribute(posAttr, edge2.userData.indices[1]);
    
    // Crear quad entre las dos aristas
    newPositions.push(v1a.x, v1a.y, v1a.z, v1b.x, v1b.y, v1b.z, v2a.x, v2a.y, v2a.z);
    newPositions.push(v1b.x, v1b.y, v1b.z, v2b.x, v2b.y, v2b.z, v2a.x, v2a.y, v2a.z);
    
    mesh.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(newPositions), 3));
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
    
    clearSelection();
    setEditMode('EDGE');
    updateLog('✓ Puente creado entre aristas');
}

function subdivideSelection() {
    if (!STATE.mainMesh) {
        updateLog('⚠️ Necesitas estar en modo edición');
        return;
    }
    
    const mesh = STATE.mainMesh;
    const posAttr = mesh.geometry.attributes.position;
    const index = mesh.geometry.index;
    const triangleCount = index ? index.count / 3 : posAttr.count / 3;
    
    const newPositions = [];
    
    for (let i = 0; i < triangleCount; i++) {
        const i0 = index ? index.getX(i * 3) : i * 3;
        const i1 = index ? index.getX(i * 3 + 1) : i * 3 + 1;
        const i2 = index ? index.getX(i * 3 + 2) : i * 3 + 2;
        
        const v0 = new THREE.Vector3().fromBufferAttribute(posAttr, i0);
        const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, i1);
        const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, i2);
        
        const m01 = v0.clone().add(v1).multiplyScalar(0.5);
        const m12 = v1.clone().add(v2).multiplyScalar(0.5);
        const m20 = v2.clone().add(v0).multiplyScalar(0.5);
        
        // 4 triángulos
        addTriangle(newPositions, v0, m01, m20);
        addTriangle(newPositions, v1, m12, m01);
        addTriangle(newPositions, v2, m20, m12);
        addTriangle(newPositions, m01, m12, m20);
    }
    
    mesh.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(newPositions), 3));
    mesh.geometry.setIndex(null);
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
    
    setEditMode(STATE.editMode);
    updateLog('✓ Subdivisión aplicada');
}

function addTriangle(positions, v0, v1, v2) {
    positions.push(v0.x, v0.y, v0.z);
    positions.push(v1.x, v1.y, v1.z);
    positions.push(v2.x, v2.y, v2.z);
}

    STATE.selection.forEach(face => {
        const indices = face.userData.indices;
        const v0 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[0]);
        const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[1]);
        const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, indices[2]);
        
        const center = v0.clone().add(v1).add(v2).divideScalar(3);
        
        const iv0 = v0.clone().lerp(center, 1 - STATE.insetAmount);
        const iv1 = v1.clone().lerp(center, 1 - STATE.insetAmount);
        const iv2 = v2.clone().lerp(center, 1 - STATE.insetAmount);
        
        // Cara interior (inset)
        newPositions.push(iv0.x, iv0.y, iv0.z);
        newPositions.push(iv1.x, iv1.y, iv1.z);
        newPositions.push(iv2.x, iv2.y, iv2.z);
        
        // Caras laterales para mantener topología
        // Triángulo v0-iv0-iv2
        newPositions.push(v0.x, v0.y, v0.z);
        newPositions.push(iv0.x, iv0.y, iv0.z);
        newPositions.push(iv2.x, iv2.y, iv2.z);
        
        // Triángulo iv0-v1-iv1
        newPositions.push(iv0.x, iv0.y, iv0.z);
        newPositions.push(v1.x, v1.y, v1.z);
        newPositions.push(iv1.x, iv1.y, iv1.z);
        
        // Triángulo iv1-v2-iv2
        newPositions.push(iv1.x, iv1.y, iv1.z);
        newPositions.push(v2.x, v2.y, v2.z);
        newPositions.push(iv2.x, iv2.y, iv2.z);
    });
    
    mesh.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(newPositions), 3));
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
    
    clearSelection();
    setEditMode('FACE');
    updateLog('✓ Inset aplicado a ' + STATE.selection.length + ' caras');
}

function bevelSelection() {
    if (STATE.selection.length === 0) {
        updateLog('⚠️ Selecciona elementos');
        return;
    }
    
    if (STATE.editMode === 'VERTEX') {
        bevelVertices();
    } else if (STATE.editMode === 'EDGE') {
        bevelEdges();
    } else {
        updateLog('⚠️ Bevel solo para vértices o aristas');
    }
}

function bevelVertices() {
    const mesh = STATE.mainMesh;
    const posAttr = mesh.geometry.attributes.position;
    
    STATE.selection.forEach(vertex => {
        const pos = vertex.position.clone();
        
        // Encontrar vértices vecinos
        const neighbors = [];
        const indices = vertex.userData.indices;
        
        // Buscar triángulos que contienen este vértice
        const index = mesh.geometry.index;
        const triangleCount = index ? index.count / 3 : posAttr.count / 3;
        
        for (let i = 0; i < triangleCount; i++) {
            const i0 = index ? index.getX(i * 3) : i * 3;
            const i1 = index ? index.getX(i * 3 + 1) : i * 3 + 1;
            const i2 = index ? index.getX(i * 3 + 2) : i * 3 + 2;
            
            if (indices.includes(i0) || indices.includes(i1) || indices.includes(i2)) {
                [i0, i1, i2].forEach(idx => {
                    if (!indices.includes(idx)) {
                        const v = new THREE.Vector3().fromBufferAttribute(posAttr, idx);
                        neighbors.push(v);
                    }
                });
            }
        }
        
        // Calcular posición biselada
        if (neighbors.length > 0) {
            const avg = new THREE.Vector3();
            neighbors.forEach(n => avg.add(n));
            avg.divideScalar(neighbors.length);
            
            const bevelPos = pos.clone().lerp(avg, STATE.bevelAmount);
            vertex.position.copy(bevelPos);
            updateVertexGeometry(vertex);
        }
    });
    
    updateLog('✓ Bevel aplicado a vértices');
}

function deleteSelectedElements() {
    if (STATE.editMode === 'VERTEX') {
        deleteVertices();
    } else if (STATE.editMode === 'EDGE') {

function deleteVertices() {
    const mesh = STATE.mainMesh;
    const posAttr = mesh.geometry.attributes.position;
    
    // Recopilar todos los índices a eliminar
    const indicesToDelete = new Set();
    STATE.selection.forEach(vertex => {
        vertex.userData.indices.forEach(idx => indicesToDelete.add(idx));
    });
    
    // Crear nueva geometría sin los vértices eliminados
    const newPositions = [];
    const indexMap = new Map();
    let newIndex = 0;
    
    for (let i = 0; i < posAttr.count; i++) {
        if (!indicesToDelete.has(i)) {
            newPositions.push(
                posAttr.getX(i),
                posAttr.getY(i),
                posAttr.getZ(i)
            );
            indexMap.set(i, newIndex++);
        }
    }
    
    if (newPositions.length === 0) {
        updateLog('⚠️ No se puede eliminar toda la geometría');
        return;
    }
    
    mesh.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(newPositions), 3));
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
    
    clearSelection();
    setEditMode('VERTEX');
    updateLog('✓ Vértices eliminados');
}

function deleteEdges() {
    updateLog('🗑️ Eliminar aristas en desarrollo');

}

function deleteFaces() {
    const mesh = STATE.mainMesh;
    const posAttr = mesh.geometry.attributes.position;
    
    // Recopilar índices de caras a eliminar
    const facesToDelete = new Set();
    STATE.selection.forEach((face, idx) => {
        const faceIndex = STATE.faceHelpers.indexOf(face);
        if (faceIndex !== -1) {
            facesToDelete.add(faceIndex);
        }
    });
    
    // Crear nueva geometría sin las caras eliminadas
    const newPositions = [];
    const index = mesh.geometry.index;
    const triangleCount = index ? index.count / 3 : posAttr.count / 3;
    
    for (let i = 0; i < triangleCount; i++) {
        if (!facesToDelete.has(i)) {
            const i0 = index ? index.getX(i * 3) : i * 3;
            const i1 = index ? index.getX(i * 3 + 1) : i * 3 + 1;
            const i2 = index ? index.getX(i * 3 + 2) : i * 3 + 2;
            
            newPositions.push(
                posAttr.getX(i0), posAttr.getY(i0), posAttr.getZ(i0),
                posAttr.getX(i1), posAttr.getY(i1), posAttr.getZ(i1),
                posAttr.getX(i2), posAttr.getY(i2), posAttr.getZ(i2)
            );
        }
    }
    
    if (newPositions.length === 0) {
        updateLog('⚠️ No se puede eliminar toda la geometría');
        return;
    }
    
    mesh.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(newPositions), 3));
    mesh.geometry.setIndex(null);
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
    
    clearSelection();
    setEditMode('FACE');
    updateLog('✓ ' + facesToDelete.size + ' caras eliminadas');
}

function applyMirrorModifier() {
    if (!STATE.selected || STATE.selected.userData.isVertex) {
        updateLog('⚠️ Selecciona un objeto');
        return;
    }
    
    const original = STATE.selected;
    const mirrored = original.clone();
    mirrored.scale.x *= -1;
    mirrored.position.x = original.position.x + 0.3;
    
    scene.add(mirrored);
    objects.push(mirrored);
    
    updateLog('✓ Modificador Mirror aplicado');
}

function applyArrayModifier() {
    if (!STATE.selected || STATE.selected.userData.isVertex) {
        updateLog('⚠️ Selecciona un objeto');
        return;
    }
    
    const original = STATE.selected;
    const count = 3;
    const offset = new THREE.Vector3(0.3, 0, 0);
    
    for (let i = 1; i <= count; i++) {
        const clone = original.clone();
        clone.position.copy(original.position).add(offset.clone().multiplyScalar(i));
        scene.add(clone);
        objects.push(clone);
    }
    
    updateLog('✓ Array modificador: ' + count + ' copias');
}

function duplicateObject() {
    if (!STATE.selected || STATE.selected.userData.isVertex) {
        updateLog('⚠️ Selecciona un objeto');
        return;
    }
    
    const clone = STATE.selected.clone();
    clone.position.x += 0.25;
    clone.name = STATE.selected.name + '_copia';
    
    scene.add(clone);
    objects.push(clone);
    selectObject(clone);
    
    updateLog('✓ Objeto duplicado');
}

function saveScene() {
    try {
        const sceneData = {
            version: '1.0',
            timestamp: Date.now(),
            objects: []
        };
        
        objects.forEach(obj => {
            sceneData.objects.push({
                name: obj.name,
                type: obj.geometry.type,
                position: obj.position.toArray(),
                rotation: obj.rotation.toArray(),
                scale: obj.scale.toArray(),
                color: obj.material.color.getHex(),
                geometry: {
                    positions: Array.from(obj.geometry.attributes.position.array)
                }
            });
        });
        
        const jsonData = JSON.stringify(sceneData);
        localStorage.setItem('mrStudioScene', jsonData);
        
        // También crear un blob para descarga
        const blob = new Blob([jsonData], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'scene_' + Date.now() + '.json';
        a.click();
        
        updateLog('✓ Escena guardada (' + objects.length + ' objetos)');
    } catch (error) {
        updateLog('❌ Error al guardar: ' + error.message);
    }
}

function loadScene() {
    try {
        const jsonData = localStorage.getItem('mrStudioScene');
        
        if (!jsonData) {
            updateLog('⚠️ No hay escena guardada');
            return;
        }
        
        const sceneData = JSON.parse(jsonData);
        
        // Limpiar escena actual
        objects.forEach(obj => scene.remove(obj));
        objects.length = 0;
        
        // Cargar objetos
        sceneData.objects.forEach(objData => {
            const positions = new Float32Array(objData.geometry.positions);
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.computeVertexNormals();
            
            const mat = new THREE.MeshStandardMaterial({
                color: objData.color,
                roughness: 0.5,
                metalness: 0.2
            });
            
            const mesh = new THREE.Mesh(geo, mat);
            mesh.name = objData.name;
            mesh.position.fromArray(objData.position);
            mesh.rotation.fromArray(objData.rotation);
            mesh.scale.fromArray(objData.scale);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            scene.add(mesh);
            objects.push(mesh);
        });
        
        updateLog('✓ Escena cargada (' + objects.length + ' objetos)');
    } catch (error) {
        updateLog('❌ Error al cargar: ' + error.message);
    }
}

// ==========================================
// SISTEMA DE UNDO/REDO
// ==========================================
const HISTORY = {
    stack: [],
    index: -1,
    maxSize: 50
};

function saveState() {
    // Guardar estado actual para undo
    const state = {
        timestamp: Date.now(),
        objects: objects.map(obj => ({
            uuid: obj.uuid,
            position: obj.position.clone(),
            rotation: obj.rotation.clone(),
            scale: obj.scale.clone(),
            geometry: obj.geometry.clone()
        }))
    };
    
    // Eliminar estados futuros si estamos en medio del stack
    HISTORY.stack.splice(HISTORY.index + 1);
    
    // Añadir nuevo estado
    HISTORY.stack.push(state);
    
    // Limitar tamaño
    if (HISTORY.stack.length > HISTORY.maxSize) {
        HISTORY.stack.shift();
    } else {
        HISTORY.index++;
    }
}

function undoAction() {
    if (HISTORY.index <= 0) {
        updateLog('⚠️ No hay nada que deshacer');
        return;
    }
    
    HISTORY.index--;
    restoreState(HISTORY.stack[HISTORY.index]);
    updateLog('↩️ Deshacer');
}

function redoAction() {
    if (HISTORY.index >= HISTORY.stack.length - 1) {
        updateLog('⚠️ No hay nada que rehacer');
        return;
    }
    
    HISTORY.index++;
    restoreState(HISTORY.stack[HISTORY.index]);
    updateLog('↪️ Rehacer');
}

function restoreState(state) {
    state.objects.forEach(objState => {
        const obj = objects.find(o => o.uuid === objState.uuid);
        if (obj) {
            obj.position.copy(objState.position);
            obj.rotation.copy(objState.rotation);
            obj.scale.copy(objState.scale);
            obj.geometry = objState.geometry.clone();
        }
    });
}

// ==========================================
// UTILIDADES DE EXPORTACIÓN
// ==========================================
function exportToOBJ() {
    let objContent = '# MR Studio Pro Export\n';
    objContent += '# ' + new Date().toISOString() + '\n\n';
    
    let vertexOffset = 1;
    
    objects.forEach((obj, objIndex) => {
        objContent += `o ${obj.name || 'Object_' + objIndex}\n`;
        
        const posAttr = obj.geometry.attributes.position;
        const worldMatrix = obj.matrixWorld;
        
        // Vértices
        for (let i = 0; i < posAttr.count; i++) {
            const v = new THREE.Vector3(
                posAttr.getX(i),
                posAttr.getY(i),
                posAttr.getZ(i)
            );
            v.applyMatrix4(worldMatrix);
            objContent += `v ${v.x.toFixed(6)} ${v.y.toFixed(6)} ${v.z.toFixed(6)}\n`;
        }
        
        // Caras
        for (let i = 0; i < posAttr.count; i += 3) {
            objContent += `f ${vertexOffset + i} ${vertexOffset + i + 1} ${vertexOffset + i + 2}\n`;
        }
        
        vertexOffset += posAttr.count;
        objContent += '\n';
    });
    
    // Descargar
    const blob = new Blob([objContent], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'export_' + Date.now() + '.obj';
    a.click();
    
    updateLog('✓ Exportado a OBJ');
}

function exportToSTL() {
    let stlContent = 'solid MRStudioExport\n';
    
    objects.forEach(obj => {
        const posAttr = obj.geometry.attributes.position;
        const normalAttr = obj.geometry.attributes.normal;
        const worldMatrix = obj.matrixWorld;
        const normalMatrix = new THREE.Matrix3().getNormalMatrix(worldMatrix);
        
        for (let i = 0; i < posAttr.count; i += 3) {
            // Normal
            const n = new THREE.Vector3(
                normalAttr.getX(i),
                normalAttr.getY(i),
                normalAttr.getZ(i)
            );
            n.applyMatrix3(normalMatrix).normalize();
            
            stlContent += `  facet normal ${n.x.toFixed(6)} ${n.y.toFixed(6)} ${n.z.toFixed(6)}\n`;
            stlContent += '    outer loop\n';
            
            // Vértices
            for (let j = 0; j < 3; j++) {
                const v = new THREE.Vector3(
                    posAttr.getX(i + j),
                    posAttr.getY(i + j),
                    posAttr.getZ(i + j)
                );
                v.applyMatrix4(worldMatrix);
                stlContent += `      vertex ${v.x.toFixed(6)} ${v.y.toFixed(6)} ${v.z.toFixed(6)}\n`;
            }
            
            stlContent += '    endloop\n';
            stlContent += '  endfacet\n';
        }
    });
    
    stlContent += 'endsolid MRStudioExport\n';
    
    // Descargar
    const blob = new Blob([stlContent], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'export_' + Date.now() + '.stl';
    a.click();
    
    updateLog('✓ Exportado a STL');
}

// ==========================================
// HERRAMIENTAS DE ANÁLISIS
// ==========================================
function analyzeGeometry() {
    if (!STATE.selected || STATE.selected.userData.isVertex) {
        updateLog('⚠️ Selecciona un objeto');
        return;
    }
    
    const geo = STATE.selected.geometry;
    const posAttr = geo.attributes.position;
    
    // Calcular estadísticas
    const stats = {
        vertices: posAttr.count,
        faces: Math.floor(posAttr.count / 3),
        edges: 0
    };
    
    // Calcular volumen aproximado
    let volume = 0;
    for (let i = 0; i < posAttr.count; i += 3) {
        const v0 = new THREE.Vector3().fromBufferAttribute(posAttr, i);
        const v1 = new THREE.Vector3().fromBufferAttribute(posAttr, i + 1);
        const v2 = new THREE.Vector3().fromBufferAttribute(posAttr, i + 2);
        
        volume += v0.dot(v1.cross(v2)) / 6;
    }
    
    console.log('=== ANÁLISIS DE GEOMETRÍA ===');
    console.log('Vértices:', stats.vertices);
    console.log('Caras:', stats.faces);
    console.log('Volumen aproximado:', Math.abs(volume).toFixed(4));
    
    updateLog(`📊 Verts: ${stats.vertices} | Faces: ${stats.faces}`);
}

function resetCamera() {
    camera.position.set(0, 1.6, 0);
    camera.rotation.set(0, 0, 0);

}

function focusOnSelected() {
    if (!STATE.selected || STATE.selected.userData.isVertex) {
        updateLog('⚠️ Selecciona un objeto');
        return;
    }
    
    const box = new THREE.Box3().setFromObject(STATE.selected);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    
    const maxDim = Math.max(size.x, size.y, size.z);
    const distance = maxDim * 2;
    
    camera.position.copy(center);
    camera.position.z += distance;
    camera.lookAt(center);
    
    updateLog('🎯 Enfocado en objeto');
}

function initAdvancedShortcuts() {
    window.addEventListener('keydown', (e) => {
        // Solo si no estamos en un input
        if (e.target.tagName === 'INPUT') return;
        
        switch(e.key.toLowerCase()) {
            case 'a':
                if (e.ctrlKey) {
                    e.preventDefault();
                    selectAll();
                }
                break;
            case 'i':
                if (STATE.mode === 'EDIT') {
                    e.preventDefault();
                    insetFaces();
                }
                break;
            case 'k':
                if (STATE.mode === 'EDIT') {
                    e.preventDefault();
                    activateKnifeTool();
                }
                break;
            case 'b':
                if (STATE.mode === 'EDIT') {
                    e.preventDefault();
                    bevelSelection();
                }
                break;
            case 'm':
                e.preventDefault();
                mergeVertices();
                break;
            case 'p':
                e.preventDefault();
                separateSelection();
                break;
            case 'j':
                e.preventDefault();
                joinSelection();
                break;
            case 'f':
                e.preventDefault();
                focusOnSelected();
                break;
            case 'home':
                e.preventDefault();
                resetCamera();
                break;
        }
    });
}

function selectAll() {
    if (STATE.mode === 'EDIT') {
        clearSelection();
        
        if (STATE.editMode === 'VERTEX') {
            STATE.vertexHelpers.forEach(v => toggleSelection(v));
        } else if (STATE.editMode === 'EDGE') {
            STATE.edgeHelpers.forEach(e => toggleSelection(e));
        } else if (STATE.editMode === 'FACE') {
            STATE.faceHelpers.forEach(f => toggleSelection(f));
        }
        
        updateLog('✓ Todo seleccionado');
    }
}
